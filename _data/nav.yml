# Sidebar navigation, in display order.
# Top-level entries with `children` render as a collapsible section.
# A `children` entry can itself be a group (has its own nested `children`)
# to any depth — nesting is fully recursive (see _includes/nav-list.html).
# A group with no `children` and no `url` renders as a "Soon" placeholder.
#
# Ordering rule: each list is sorted alphabetically by default. Where a list
# has a genuine reading-order dependency (a later topic assumes an earlier
# one), items are numbered ("1. ", "2. ", ...) instead so the intended order
# stays obvious even if the list is ever re-sorted. Lists with no numbers can
# be read in any order.
#
# "Security" is currently the only main topic group, so it does not need a
# numeric prefix. Add ordering only when multiple main groups require it.

