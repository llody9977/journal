      "originating_feedback": "A fresh Section 13 review found three overclaims of the same shape on pages whose purpose is evaluating certification claims. Topic 13.4 stated that a payment HSM must hold PCI PTS HSM approval before the networks permit PIN processing, when the PCI PIN Security Requirements accept PCI PTS HSM approval or FIPS 140-2 Level 3 or higher. It listed EAL1 to EAL7 under the heading of international mutual recognition without stating that CCRA-2014 recognition stops at EAL2 with ALC_FLR or collaborative Protection Profile conformance, and that NIAP no longer issues EAL ratings at all. It also gave QSCD as EN 419 221-5's assurance level, when a remote-signing QSCD additionally requires EN 419 241-2. Topic 13.1 stated that enterprise buyers require a SOC 2 Type II report.",
      "decision": "Where a page presents a certification as required, name the accepted alternatives and the scope of recognition. State both PCI PIN routes and say why PCI PTS HSM is the stronger one; add a recognition-scope section to the Common Criteria coverage covering the CCRA EAL2 cap, SOG-IS, and NIAP's protection-profile-only model; present EN 419 221-5 as one component of a QSCD determination in its own body section; and replace the SOC 2 requirement claim with guidance on reading a report's scope, period, opinion and complementary user entity controls.",
      "rationale": "On a page that teaches a reader to validate a vendor's claim, an overclaim about what is required is the same defect the page warns against. Recognition scope is the specific thing a reader cannot infer from an EAL number and most needs, and omitting it makes a vendor's EAL5 certificate look internationally accepted when it is not.",
      "authoritative_sources": [
        {
          "title": "PCI SSC PIN Security Requirements",
          "url": "https://www.pcisecuritystandards.org/standards/pin-security/",
          "supports": "PIN-processing HSMs may be PCI PTS HSM approved or FIPS 140-2 Level 3 or higher validated."
