      "decision": "Cite the current 2026-07-28 revision on Topic 7.3, describe stdio and Streamable HTTP as the two standard transports, quote the annotation-trust requirement with its scope and its 'unless they come from trusted servers' condition, present human-in-the-loop as the specification's SHOULD with the three-class privilege table labelled a journal working model, reserve 'confused deputy' for the proxy consent-cookie attack the specification names, and add a section on local MCP server compromise.",
