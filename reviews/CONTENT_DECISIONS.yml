      "originating_feedback": "A fresh Section 11 review found that Topic 11.4 said Lambda functions default to a 15-minute timeout, that its diagram claimed microVM isolation per function invocation while the adjacent bullet described /tmp persisting across invocations, that reserved concurrency was presented as a Denial of Wallet mitigation with no residual risk, that the cited AWS whitepaper URL redirected to a different document, and that the OWASP Serverless Top 10 was cited without its incubator status or 2018 date.",
      "decision": "State that the Lambda default timeout is 3 seconds and 900 seconds is the maximum; describe isolation as per execution environment reused across invocations rather than per invocation; state that a reserved concurrency cap bounds spend by throttling legitimate callers too, converting Denial of Wallet into denial of service; replace the retired whitepaper citation with the current Lambda security documentation; and label the OWASP Serverless Top 10 as an incubator project whose only release is the 2018 interpretation document.",
      "rationale": "The timeout error inverted the risk by inventing a permissive default that does not exist. The per-invocation isolation claim contradicted the page's own /tmp threat and would lead a reader to conclude that local disk is not shared. The concurrency cap is the page's headline mitigation and its trade-off is the residual risk the writing standard requires. The whitepaper URL returned HTTP 200 while serving a different page, so the link checker could not catch it.",
      "authoritative_sources": [
        {
          "title": "AWS Lambda: Configure function timeout",
          "url": "https://docs.aws.amazon.com/lambda/latest/dg/configuration-timeout.html",
          "supports": "The default timeout is 3 seconds, adjustable up to a maximum of 900 seconds (15 minutes)."
        },
        {
