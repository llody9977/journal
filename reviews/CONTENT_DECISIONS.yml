      "rationale": "The acronym, the abbreviation, and the attribution were each verifiable against the framework's own publication and each was wrong; a reader searching for 'MASH' finds nothing. The Z-score cutoff is a convention that silently assumes a distribution security telemetry rarely has, so stating it prevents the threshold from being read as a law. A hunt that keeps pivoting on a confirmed compromise tips the adversary and contaminates volatile evidence, so the stand-down rule is operational safety, not process decoration.",
