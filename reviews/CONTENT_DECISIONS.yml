    {
      "id": "CD-0011",
      "title": "Attribute an HMAC tag to some holder of the shared key, not a unique origin",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/hash-functions-macs.md",
          "assets/img/hmac-flow.svg"
        ],
        "concepts": [
          "HMAC origin authentication",
          "shared-key attribution",
