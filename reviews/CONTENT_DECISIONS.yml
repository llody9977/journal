      "originating_feedback": "A fresh Section 13 review found reference sections describing content the pages did not contain. Topic 13.4's two primary references were AICPA SOC 2 and the FedRAMP Marketplace, neither discussed anywhere on a page about FIPS 140-3, Common Criteria, PCI PTS HSM and EN 419 221-5, and its callout closed on a FedRAMP scoping statement the body never set up. Topic 13.2 cited the IIA Three Lines Model and NIST SP 800-39 while discussing neither. Meanwhile material subjects went unsourced: Topic 13.1 had dedicated sections on the OWASP suite and SOC 2 with no link to either, plus unlinked CISA CPGs and FedRAMP; Topic 13.2 presented the FAIR formula with no citation at all; Topic 13.4 gave no source for PCI PTS HSM, EN 419 221-5 or ISO/IEC 15408.",
      "decision": "Either restore the content a reference implies or replace the reference with one the page actually rests on. Add the governance-roles section that the IIA Three Lines citation implies to Topic 13.2 and cite Open FAIR for the risk formula; replace Topic 13.4's references with FIPS 140-3, the CMVP database, the CCRA, PCI PIN Security and the EN 419 221-5 protection profile, and rewrite its callout to summarize what the page teaches; add inline sources at first mention for the OWASP suite, SOC 2, CISA CPGs and FedRAMP on Topic 13.1.",
      "rationale": "A reference section is a claim about what established the page's conclusions. When it names documents the page never uses, a reader following it finds nothing and the page's evidence base is unverifiable; when a headline subject has no source at all, the same is true in the other direction. Restoring the missing governance content was preferable to deleting the citation because the callout already asserted that governance roles guide the choices.",
