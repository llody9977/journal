      "originating_feedback": "A fresh Section 13 review measured all nine of the section's diagrams under CD-0074 and found six carrying defects. Five stage titles in security-program-roadmap.svg overflowed their panels, one running off the 1200-unit canvas entirely. cmmi-maturity-levels.svg and owasp-samm-functions.svg each overflowed by up to 18.5 units. Separately, the white connector-label pills in grc-framework-stack.svg, cis-implementation-groups.svg and common-criteria-eal.svg were drawn straddling the panel bottom border, punching a gap in the outline; in the first two they also overlapped the body-text baseline and clipped descenders, so the Layer 1 line rendered as 'Protect, Detect. Respond, and Recover' with the comma reduced to a period. A separate defect in nist-csf-functions.svg had the subtitle words transposed across the line break.",
