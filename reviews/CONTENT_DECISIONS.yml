      "originating_feedback": "The Chapter 3 review found that PQC operations discussed backup, failover, and rollback without the critical LMS/XMSS constraint that one-time signing state must never be reused.",
      "decision": "Separate stateful LMS/XMSS operations from stateless ML-DSA and SLH-DSA. Treat the signing index as protected monotonic key state that must advance durably before signature release and must not be duplicated or rolled back by ordinary backup, snapshot, or failover procedures.",
      "rationale": "Reusing a one-time signature key can enable forgery. A service that resumes after a crash is not safely recovered unless it also proves that previously allocated signing state cannot be reused.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-208",
          "url": "https://csrc.nist.gov/pubs/sp/800/208/final",
          "supports": "LMS and XMSS require careful state maintenance, prohibit one-time-key reuse, and impose specific module and distributed-signing constraints."
        }
      ],
      "verification_methods": [
        "Check migration, backup, crash, restore, failover, and concurrency guidance for state reuse risk.",
        "Verify that the page distinguishes stateful and stateless post-quantum signature schemes.",
        "Confirm that successful service restart is not presented as proof of safe signer recovery."
      ],
      "approved_outcome": "PQC operational planning includes durable monotonic signer state, anti-cloning controls, permitted HA designs, capacity tracking, and crash/restore/failover tests for LMS/XMSS.",
      "invalidation_conditions": [
