    {
      "id": "CD-0001",
      "title": "Represent security objectives, domain scopes, risk decisions, and controls as relationships rather than containment",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/security-fundamentals.md",
          "assets/img/security-domains-overlap.svg"
        ],
        "concepts": [
          "security domain boundaries",
          "risk management relationship",
          "security control execution",
          "CIA objectives",
          "conceptual diagram containment"
        ]
      },
      "originating_feedback": "A fresh Section 1 review found that concentric SVG containers visually asserted that controls contain risk management and that risk management contains security-domain scopes, while the prose described a directional engineering relationship.",
      "decision": "Use a directional journal working model instead of nested containment: security objectives define outcomes, domain scopes establish context, risk management selects responses, controls implement those responses, and monitoring evidence feeds reassessment.",
      "rationale": "Objectives, scopes, risk decisions, and controls are related but are not progressively nested ontological sets. A directional model preserves the page's intended operating sequence without implying that technical controls encompass governance or that CIA objectives exist only inside one domain.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-37 Rev. 2",
          "url": "https://csrc.nist.gov/pubs/sp/800/37/r2/final",
          "supports": "Risk management, control implementation, assessment, authorization, and monitoring are interacting lifecycle activities."
        },
        {
          "title": "NIST SP 800-39",
          "url": "https://csrc.nist.gov/pubs/sp/800/39/final",
          "supports": "Risk framing, assessment, response, and monitoring connect risk decisions across organizational and system levels."
        }
      ],
      "verification_methods": [
        "Compare the visible SVG relationships with the page prose, alt text, caption, and cited NIST lifecycle descriptions.",
        "Render the SVG at full size and in the responsive page."
      ],
      "approved_outcome": "A non-nested four-stage relationship diagram with a monitoring and residual-risk feedback path; matching SVG description, page alt text, and caption; explicit journal-working-model qualification.",
      "invalidation_conditions": [
        "The page changes to teach a different relationship model and explains why containment is semantically intended.",
        "A governing primary source introduces a normative containment model that the page explicitly adopts.",
        "Rendered evidence shows that the directional model is unreadable or implies a different incorrect relationship."
      ],
      "related_decisions": [
        "CD-0006"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "4f1d088344b3cd2b146412aefd2352b2f658f6919252b215c54e2d0c0f69a685",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
    {
      "id": "CD-0002",
      "title": "Retain the FIPS 199 and FIPS 200 sequence but use the official High baseline terminology",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/security-objectives-properties.md"
        ],
        "concepts": [
          "FIPS 199 high-water mark",
          "FIPS 200 impact level",
          "SP 800-53B High baseline",
          "high-assurance baseline"
        ]
      },
      "originating_feedback": "The FIPS 199 and FIPS 200 sequencing was correct, but the phrase 'high-assurance FIPS 200 baseline' was not the official name and could be confused with separate assurance requirements.",
      "decision": "Preserve the existing tuple-to-overall-impact explanation and call the selected control set the SP 800-53B High baseline for a high-impact system.",
      "rationale": "FIPS 199 preserves confidentiality, integrity, and availability impact values in the system security category. FIPS 200 applies the high-water mark to select one of the Low, Moderate, or High baselines. The correction is terminological and must not reverse the already-verified sequence.",
      "authoritative_sources": [
        {
          "title": "FIPS 200",
          "url": "https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.200.pdf",
          "supports": "FIPS 200 selects the low, moderate, or high control baseline according to the system impact level."
        },
        {
          "title": "NIST SP 800-53B",
          "url": "https://csrc.nist.gov/pubs/sp/800/53/b/upd1/final",
          "supports": "SP 800-53B defines the Low, Moderate, and High control baselines and describes the FIPS 199/200 high-water-mark relationship."
        }
      ],
      "verification_methods": [
        "Compare the complete paragraph with the FIPS 199 system security category and FIPS 200 baseline-selection language."
      ],
      "approved_outcome": "Use 'the corresponding SP 800-53B High baseline is a system-wide minimum control baseline, not a set of technical safeguards alone' while retaining the existing FIPS 199 tuple and FIPS 200 overall-impact explanation.",
      "invalidation_conditions": [
        "FIPS 199, FIPS 200, or SP 800-53B is superseded with a materially different categorization or baseline-selection model.",
        "The page changes scope away from the U.S. federal model.",
        "New primary evidence shows that the retained sequencing is inaccurate."
      ],
      "related_decisions": [
        "CD-0003"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "4f1d088344b3cd2b146412aefd2352b2f658f6919252b215c54e2d0c0f69a685",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
    {
      "id": "CD-0003",
      "title": "Describe accountability as attribution to an authenticated entity, not necessarily a proofed person",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/security-objectives-properties.md",
          "assets/img/security-objectives-properties-matrix.svg",
          "topics/identity-access-fundamentals.md"
        ],
        "concepts": [
          "accountability",
          "authenticated entity context",
          "verified real-world identity",
          "identity proofing",
          "audit attribution"
        ]
      },
      "originating_feedback": "The security-properties diagram used 'Verified Identity Context,' which could imply real-world identity proofing and conflicted with Section 1.7's explicit coverage of pseudonymous users, workloads, devices, and agents.",
      "decision": "Use 'authenticated entity context' for accountability unless a specific claim truly depends on real-world identity proofing.",
      "rationale": "Accountability requires actions to be traceable to an entity. Authentication and attribution can apply to pseudonymous accounts and non-human identities; identity proofing is a separate assurance question.",
      "authoritative_sources": [
        {
          "title": "NIST CSRC Accountability Glossary",
          "url": "https://csrc.nist.gov/glossary/term/accountability",
          "supports": "Accountability is the ability to trace actions uniquely to an entity."
        },
        {
          "title": "NIST SP 800-63-4",
          "url": "https://pages.nist.gov/800-63-4/",
          "supports": "Identity proofing, authentication, and federation are separate functions and assurance dimensions."
        }
      ],
      "verification_methods": [
        "Compare the diagram label with the page's accountability row and Section 1.7 identity-type and assurance distinctions."
      ],
      "approved_outcome": "The diagram uses 'Attributing System Actions to Authenticated Entity Context'; prose continues to qualify attribution strength by identity binding and log integrity.",
      "invalidation_conditions": [
        "The diagram is narrowed to a system in which every accountable subject is explicitly required and verified to be a proofed real-world person.",
        "The governing accountability or digital-identity definitions materially change.",
        "The phrase is replaced by terminology that preserves the same proofing boundary more clearly."
      ],
      "related_decisions": [
        "CD-0002",
        "CD-0007"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "4f1d088344b3cd2b146412aefd2352b2f658f6919252b215c54e2d0c0f69a685",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
