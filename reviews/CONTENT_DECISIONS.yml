      "id": "CD-0059",
      "title": "Label Section 10 author-created checklists as journal working models and scope its page descriptions",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/web-application-vulnerabilities.md",
          "topics/api-microservice-security.md",
          "topics/ssdlc-security-testing.md",
