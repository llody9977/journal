      "originating_feedback": "A fresh Section 12 review found that Topic 12.1 stated investigators 'must adhere to NIST SP 800-86 Chain of Custody protocols' to 'ensure' admissibility, attributed SHA-256 and SHA-512 to SP 800-86, presented a four-step condensation as 'the RFC 3227 Order of Volatility' with 'must' rather than the RFC's 'should', labelled Shimcache and Amcache as proof of execution, described 'cryptographic snapshots' of cloud volumes, and named Volatility as an acquisition tool and Autopsy in alt text that appears nowhere in the diagram.",
      "decision": "Restate chain of custody as supporting rather than guaranteeing admissibility, matching Topic 1.8; attribute the SHA-256 recommendation to current practice while recording that SP 800-86 predates SHA-2 and names MD5 and SHA-1; quote RFC 3227's actual tiers with its BCP 55 status and 'should'; split the artifact table so execution evidence and existence evidence are separate rows with reliability caveats; and rebuild the diagram, alt text and description so all three agree.",
      "rationale": "SP 800-86 explicitly disclaims use as legal advice and states that guidelines 'should support' admissibility, so 'must' and 'ensure' were both unsupported by the cited source and contradicted Topic 1.8. Treating Shimcache as execution evidence is a well-documented forensic error that produces timelines attributing activity to binaries that never ran.",
      "authoritative_sources": [
