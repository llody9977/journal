      "rationale": "CD-0074 established measurement for text against panels but not for decorative overlays drawn on top of text, and the clipped comma shows the gap: a white shape drawn after a text node silently edits the sentence a reader sees, while every syntax, link and structure check passes. Moving the label out of the collision zone removes the class rather than the instance.",
