      "originating_feedback": "A fresh Section 9 review rendered every page and found seven diagram frames drawing on three images: 9.1 embedded one image twice, 9.2 twice, and 9.4 three times, under captions promising a five-tier defense-in-depth stack, a PDP and PEP logical architecture, PrivateLink subnet endpoints, and a Git commit to atomic node replacement lifecycle, none of which existed in any image. Browser measurement at a 375px viewport found the 1200-wide diagrams rendering 285px across, putting 11.5px body text at an effective 2.7 CSS px, and only 9.3 offered the full-size affordance already used by 34 other topic pages. The 9.3 diagram's alt text and caption also claimed seven Privacy by Design principles while the panel showed five.",
      "decision": "Apply the rule recorded in CD-0033 and extended by CD-0038 and CD-0049 to Section 9: build a dedicated SVG for every diagram frame, rewrite each caption and alt string to describe only what its own image shows, complete the Privacy by Design panel so all seven principles appear, and wrap every Section 9 frame in the repository's diagram-frame-openable pattern.",
      "rationale": "CD-0033 established this rule from a Section 6 review, CD-0038 extended it to Section 7 and CD-0049 to Section 8, but each recorded only its own section's files in scope, so the identical defect class survived untouched into Section 9 for the fourth time. The rule is repository-wide in substance: a caption naming content the image lacks teaches the wrong thing, and an alt string describing a non-existent diagram is worse for a screen-reader user than no diagram at all. Neither is visible to syntax, link, or structure checks, which is why CD-0057 adds a detector rather than relying on the next reviewer noticing.",
      "authoritative_sources": [
