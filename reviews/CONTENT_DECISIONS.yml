      "originating_feedback": "A fresh Section 10 review found Topic 10.4 stating that 'iOS and Android assign a unique User ID (UID) and isolated filesystem directory to every installed app', describing storage as 'iOS Keychain (Secure Enclave)', listing four of the eight MASVS control groups without saying it was a subset, and carrying an SVG line asserting that both platforms' key stores are 'backed by hardware TPM'.",
      "decision": "State each platform's model separately from its vendor documentation: Android assigns a distinct Linux UID per app with kernel enforcement plus per-app SELinux domains from Android 9 for API 28 and above, while iOS runs all third-party apps as the non-privileged user 'mobile' and isolates them with a mandatory sandbox profile and a randomly assigned home directory. Describe the iOS Keychain as an encrypted SQLite database on the file system whose per-item secret keys require a round trip through the Secure Enclave, rather than as storage inside the Enclave. State that neither platform uses a TPM and name the actual hardware — Secure Enclave, TEE, StrongBox. Enumerate all eight MASVS control groups.",
      "rationale": "The merged statement is not a simplification but a factual error on the iOS side, and it matters when reasoning about what a platform-specific sandbox bypass reaches. The Keychain conflation misplaces the trust boundary: the database is on disk and readable as ciphertext, which is a different threat model from key material inside secure hardware. TPM is a Trusted Computing Group specification for PC-class platforms and appears on neither mobile platform.",
      "authoritative_sources": [
        {
          "title": "Apple Platform Security: Security of runtime process",
          "url": "https://support.apple.com/guide/security/security-of-runtime-process-sec15bfe098e/web",
