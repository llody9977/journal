      "originating_feedback": "A fresh Section 11 review found that Topic 11.2 attributed a read-only root filesystem requirement to the restricted Pod Security Standard, presented a default-deny NetworkPolicy as self-enforcing, listed the user namespace as active isolation, and described service mesh mTLS as application-layer (L7) encryption covering all pod-to-pod traffic.",
      "decision": "State the restricted level's actual control set and say explicitly that it does not include readOnlyRootFilesystem; add the CNI-plugin dependency as a named silent-failure mode with a connectivity-test verification instead of `kubectl get netpol`; state that hostUsers defaults to true so container root is host root unless a pod opts in; and describe mTLS as transport-layer authentication scoped to meshed workloads, noting PERMISSIVE mode still accepts plaintext.",
      "rationale": "Each of the four was a control a reader could rely on and not receive. The read-only root filesystem claim is the most severe because it describes protection that no Kubernetes level applies, and the NetworkPolicy no-op is the most operationally likely because the object is accepted and the obvious audit command reports success. The page's own diagram footer already omitted the read-only claim, so the page contradicted itself.",
      "authoritative_sources": [
        {
          "title": "Kubernetes: Pod Security Standards",
          "url": "https://kubernetes.io/docs/concepts/security/pod-security-standards/",
          "supports": "The restricted level comprises baseline plus volume types, allowPrivilegeEscalation false, runAsNonRoot, non-zero runAsUser, seccomp RuntimeDefault or Localhost, and drop ALL capabilities with NET_BIND_SERVICE addable. readOnlyRootFilesystem does not appear at any level."
        },
        {
          "title": "Kubernetes: Network Policies",
          "url": "https://kubernetes.io/docs/concepts/services-networking/network-policies/",
          "supports": "Network policies are implemented by the network plugin; creating a NetworkPolicy resource without a controller that implements it will have no effect."
        },
        {
          "title": "Kubernetes: User namespaces",
          "url": "https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/",
          "supports": "hostUsers defaults to true; a pod must set hostUsers false to use a user namespace."
        },
        {
          "title": "Istio: Security concepts",
          "url": "https://istio.io/latest/docs/concepts/security/",
          "supports": "mTLS is established by sidecar proxies as transport authentication and applies to workloads in the mesh; PERMISSIVE mode accepts both mutual TLS and plain text."
        }
      ],
      "verification_methods": [
        "Confirm Topic 11.2 states that restricted does not require a read-only root filesystem.",
        "Confirm the Pod Security Admission diagram footer states the same exclusion.",
        "Confirm the NetworkPolicy section names the CNI dependency and gives a connectivity-test verification.",
        "Confirm the checklist no longer accepts `kubectl get netpol` alone as enforcement evidence."
      ],
      "approved_outcome": "Topic 11.2 and its admission diagram state the restricted control set accurately, name the NetworkPolicy CNI dependency as a silent no-op with a positive verification method, state the user-namespace default, and scope mTLS to transport layer and mesh membership.",
