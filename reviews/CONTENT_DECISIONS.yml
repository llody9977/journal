      "originating_feedback": "The Section 4 review found that OAuth was restricted to human third-party delegation, access tokens were treated as arbitrary JWTs, the diagram mixed OAuth and login, and mTLS client authentication was conflated with certificate-bound access tokens.",
      "decision": "Define OAuth, OIDC, token format/profile, client authentication, sender constraint, and resource authorization as separate boundaries, then show how a selected flow composes them.",
      "rationale": "These layers have different consumers, validation rules, and failure modes. Collapsing them encourages ID Token misuse, algorithm confusion, incomplete token validation, and assumptions that client authentication automatically constrains an access token.",
      "authoritative_sources": [
        {
          "title": "RFC 6749",
          "url": "https://www.rfc-editor.org/rfc/rfc6749.html",
          "supports": "OAuth includes delegated and client-credentials authorization and defines roles without requiring every resource owner to be a human."
        },
        {
          "title": "OpenID Connect Core 1.0",
          "url": "https://openid.net/specs/openid-connect-core-1_0.html",
          "supports": "OIDC defines ID Tokens and client validation for end-user authentication."
        },
        {
          "title": "RFC 8705",
          "url": "https://www.rfc-editor.org/rfc/rfc8705.html",
          "supports": "Mutual-TLS client authentication and certificate-bound access tokens are separate mechanisms."
        },
        {
          "title": "RFC 9449",
          "url": "https://www.rfc-editor.org/rfc/rfc9449.html",
          "supports": "DPoP uses an application-layer proof JWT and confirmation binding with defined validation and replay limitations."
        }
      ],
      "verification_methods": [
        "Trace the Authorization Code with PKCE diagram as a pure OAuth flow and verify the page separately states the OIDC additions.",
        "Execute the illustrative JWS code and confirm its explanation limits the demonstrated property.",
        "Check every mTLS and DPoP claim for token-endpoint, resource-server, key-binding, freshness, and replay preconditions."
      ],
      "approved_outcome": "The pages use protocol-defined credential and assertion terminology, validate tokens under explicit profiles, and separate client authentication from sender-constrained token enforcement.",
      "invalidation_conditions": [
        "A page explicitly narrows to one profile that composes these boundaries differently and documents that scope.",
        "A later Standards Track specification replaces the cited mechanism or validation model."
      ],
