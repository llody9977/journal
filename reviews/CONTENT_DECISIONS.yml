    {
      "id": "CD-0009",
      "title": "Treat Grover exponents as ideal query bounds rather than concrete security-strength ratings",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/symmetric-cryptography.md",
          "topics/symmetric-vs-asymmetric.md",
          "topics/post-quantum-cryptography.md",
          "topics/recommended-algorithms.md",
          "assets/img/quantum-algorithm-impact.svg"
        ],
        "concepts": [
          "Grover query complexity",
          "concrete quantum security strength",
          "AES-128 Category 1",
          "AES-256 post-quantum margin",
          "symmetric key doubling"
        ]
      },
      "originating_feedback": "The Section 2 review found that several pages and the shared quantum diagram converted Grover's ideal 2^(n/2) sequential query exponent into a concrete security-strength rating and a universal requirement to double symmetric key sizes.",
      "decision": "Present 2^(n/2) as an ideal sequential query bound and separately explain the implementation resources that determine concrete attack cost. Retain AES-128 as NIST's Category 1 comparison baseline and frame AES-256 as additional profile- and risk-dependent margin.",
      "rationale": "A query exponent does not account for reversible-oracle cost, circuit depth, error correction, parallelization, qubit count, or wall-clock time. Calling AES-128 a practical 64-bit primitive contradicts NIST's PQC comparison model and overstates what the asymptotic result proves.",
      "authoritative_sources": [
        {
          "title": "NIST PQC Security Evaluation Criteria",
          "url": "https://csrc.nist.gov/Projects/Post-Quantum-Cryptography/Post-Quantum-Cryptography-Standardization/Evaluation-Criteria/Security-%28Evaluation-Criteria%29",
          "supports": "NIST defines Category 1 relative to the resources required to attack AES-128 and cautions that concrete quantum security is more nuanced than simple asymptotic estimates."
        }
      ],
      "verification_methods": [
        "Compare every Grover repetition in prose, tables, captions, alt text, and the shared SVG.",
        "Confirm that key-size recommendations remain scoped to protocol, profile, threat model, and protection lifetime."
      ],
      "approved_outcome": "Grover is described as an ideal sequential query bound, AES-128 remains the Category 1 comparison baseline, and AES-256 is additional margin rather than a universal doubling mandate.",
      "invalidation_conditions": [
        "NIST changes its PQC security-category comparison model or publishes a superseding concrete symmetric-key requirement.",
        "A page adopts a specific quantum architecture and resource model that supports a narrower concrete estimate.",
        "New primary cryptanalytic evidence materially changes the best-known attack model."
      ],
      "related_decisions": [
        "CD-0014"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "d8a2ec35e126c9a95cae3b6b2c558a85e13f37815e2e597e5b31b094120a9a88",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
    {
      "id": "CD-0010",
      "title": "Keep key agreement, transport, KEM encapsulation, and traffic-key derivation distinct",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/cryptography-overview.md",
          "topics/asymmetric-cryptography.md",
          "topics/symmetric-vs-asymmetric.md",
          "topics/post-quantum-cryptography.md",
          "topics/key-exchange-derivation.md",
          "topics/tls-ssl-handshake.md",
          "assets/img/diffie-hellman.svg",
          "assets/img/tls-cryptography-layers.svg",
          "assets/img/tls-handshake.svg"
        ],
        "concepts": [
          "key establishment taxonomy",
          "ML-KEM encapsulation",
          "Diffie-Hellman agreement",
          "key transport",
          "TLS traffic-key derivation",
          "X25519MLKEM768"
        ]
      },
      "originating_feedback": "The Section 2 review found repeated wording that described DH or ML-KEM as wrapping, distributing, or directly producing a pre-existing AES key and diagrams that rendered the hybrid TLS group as pure Diffie-Hellman.",
      "decision": "State who contributes or creates the shared secret for each mechanism, identify what crosses the wire, and show that a protocol KDF derives traffic secrets, keys, and IVs from key-establishment output. Draw X25519MLKEM768 using its actual ML-KEM and X25519 share components.",
      "rationale": "Agreement, transport, and encapsulation have different message flows, compromise consequences, and forward-secrecy properties. TLS negotiates an AEAD and derives its traffic keys; it does not distribute a pre-existing AES-256 key.",
      "authoritative_sources": [
        {
          "title": "FIPS 203",
          "url": "https://csrc.nist.gov/pubs/fips/203/final",
          "supports": "ML-KEM encapsulation outputs a shared secret and ciphertext; decapsulation recovers the shared secret."
        },
        {
          "title": "RFC 9846",
          "url": "https://www.rfc-editor.org/rfc/rfc9846.html",
          "supports": "TLS 1.3 defines the handshake modes and HKDF key schedule that derive traffic secrets and keys."
        },
        {
          "title": "RFC 10024",
          "url": "https://www.rfc-editor.org/rfc/rfc10024.html",
          "supports": "X25519MLKEM768 concatenates an ML-KEM encapsulation key or ciphertext with an X25519 share in the client and server key shares."
        }
      ],
      "verification_methods": [
        "Trace the inputs, outputs, and transmitted values for each mechanism across every affected page and diagram.",
        "Exercise the RSA, ECDH, and TLS-related demonstrations and compare their displayed explanations with the actual code paths."
      ],
      "approved_outcome": "Agreement and KEM output shared secret material, transport protects a sender-selected key, and protocol KDFs derive negotiated traffic keys and IVs; hybrid TLS visuals show both ML-KEM and X25519 components.",
      "invalidation_conditions": [
        "A page narrows to a construction that explicitly wraps a caller-supplied key and labels that construction precisely.",
        "TLS or ML-KEM is superseded by a specification with materially different message flow or key-schedule semantics.",
        "A clearer taxonomy preserves the same actors, transmitted values, and compromise boundaries."
      ],
      "related_decisions": [
        "CD-0009",
        "CD-0014"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "d8a2ec35e126c9a95cae3b6b2c558a85e13f37815e2e597e5b31b094120a9a88",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
