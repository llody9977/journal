          "title": "NIST SP 800-86",
          "url": "https://csrc.nist.gov/pubs/sp/800/86/final",
          "supports": "That the publication recommends rather than mandates, disclaims use as legal advice, states guidelines should support admissibility, and names MD5 and SHA-1 as the message digest algorithms in use."
        },
        {
          "title": "RFC 3227 (BCP 55)",
          "url": "https://www.rfc-editor.org/rfc/rfc3227.txt",
          "supports": "Best Current Practice status, the RFC 2119 keyword usage, and the order of volatility tiers in section 2.1 which group live network and process state with memory."
        }
      ],
      "verification_methods": [
        "Confirm no text on Topic 12.1 states that any practice ensures or guarantees admissibility.",
        "Confirm the RFC 3227 tiers on the page match section 2.1 and that BCP 55 status is stated.",
        "Confirm Shimcache and Amcache are described as existence evidence in prose, table, diagram and callout.",
        "Confirm the diagram description, page alt text and drawn diagram name the same tools."
      ],
      "approved_outcome": "Topic 12.1 states the admissibility boundary, the correct RFC 3227 ordering and status, current hash guidance with honest attribution, and a clean execution-versus-existence split across every format.",
      "invalidation_conditions": [
