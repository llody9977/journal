    {
      "id": "CD-0054",
      "title": "Teach the seven tenets of NIST SP 800-207, attribute the Microsoft and Gartner framings, and state what revocation actually ends",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/zero-trust-architecture.md",
          "assets/img/zero-trust-architecture.svg",
          "assets/img/zero-trust-pdp-pep-flow.svg"
        ],
        "concepts": [
          "zero trust tenets",
          "assume breach attribution",
          "CARTA attribution",
          "token revocation semantics",
          "ZTA threat model",
          "normative strength of NIST guidance"
        ]
      },
      "originating_feedback": "A fresh Section 9 review found that Topic 9.2, titled for NIST SP 800-207, taught 'The Three Core Tenets of Zero Trust' as assume breach, explicit verification, and least privilege access, repeated across the description, callout, diagram, and alt text. Text extracted directly from the SP 800-207 PDF shows section 2.1 enumerates seven tenets and that the strings 'assume breach' and 'CARTA' appear zero times in the document. The page also presented CARTA inside a box labelled as the NIST control plane, described SP 800-207 as governing and authoritative, claimed a risk signal revokes an active session token immediately via short-lived JWTs or RFC 7009, and carried no threat model for the architecture at all.",
      "decision": "Replace the three-principle section with the seven tenets as SP 800-207 states them, including the document's own framing of them as an ideal goal. Attribute 'verify explicitly, least privilege, assume breach' to Microsoft and CARTA to Gartner, and present tenet 6 and the section 3.3 trust algorithm as the NIST statement of continuous re-evaluation. Describe SP 800-207 as a reference model rather than governing or authoritative. Separate what a PEP termination, an RFC 7009 revocation, and a locally validated self-contained JWT each actually end. Add the seven threats from SP 800-207 section 5, and the three approaches and four deployment variations from section 3.",
      "rationale": "Attributing a vendor's three-principle summary to a NIST publication on a page titled for that publication is the most consequential defect available on this page: it is the reader's whole recall of what the standard says. The revocation claim is the second: treating a short token lifetime as revocation leaves a residual window equal to the token's remaining life, and self-contained tokens validated locally are the common deployment. Section 5 was the largest gap, because concentrating access decisions into a control plane makes the PDP simultaneously the highest-value target and a hard availability dependency, and no summary of Zero Trust that omits this is usable for design.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-207: Zero Trust Architecture",
          "url": "https://csrc.nist.gov/pubs/sp/800/207/final",
          "supports": "Seven tenets in section 2.1 and their ideal-goal framing; PE, PA, and PEP definitions and the trust algorithm in section 3; three approaches and four deployment variations; seven threats in section 5; and the absence of the terms 'assume breach' and 'CARTA'."
        },
        {
          "title": "Microsoft: Zero Trust as a security foundation",
          "url": "https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview",
          "supports": "That verify explicitly, use least privilege access, and assume breach are Microsoft's three Zero Trust principles."
        },
        {
          "title": "RFC 7009: OAuth 2.0 Token Revocation",
          "url": "https://www.rfc-editor.org/rfc/rfc7009",
          "supports": "That revocation is performed at the authorization server, so a self-contained token validated locally by a resource server stays acceptable until it expires."
        }
      ],
      "verification_methods": [
        "Compare the enumerated tenets against section 2.1 of the SP 800-207 PDF.",
        "Confirm no representation on the page or in its diagrams attributes 'assume breach' or CARTA to NIST.",
        "Confirm the revocation paragraph distinguishes PEP termination, authorization-server revocation, and local token validation."
      ],
      "approved_outcome": "Topic 9.2 teaches SP 800-207's seven tenets with correct attribution for the vendor and analyst framings, states SP 800-207's guidance status, separates the three revocation mechanisms, and covers the section 5 threats to the architecture itself.",
      "invalidation_conditions": [
        "NIST publishes a revision of SP 800-207 that changes the tenet set or the component model.",
        "A later specification changes how token revocation propagates to locally validated tokens."
      ],
      "related_decisions": [
        "CD-0028",
        "CD-0052"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-14",
      "last_reviewed_on": "2026-08-14"
    },
    {
      "id": "CD-0055",
      "title": "State cloud isolation and perimeter controls as bounded by the condition each depends on, using what the providers document",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/cloud-secure-architecture-patterns.md",
          "assets/img/cloud-secure-architecture-patterns.svg",
          "assets/img/cloud-service-perimeters.svg",
          "assets/img/immutable-infrastructure-lifecycle.svg"
        ],
        "concepts": [
          "multi-tenant isolation",
          "gVisor classification",
          "VPC Service Controls limits",
          "PrivateLink scope",
          "tmpfs noexec default",
          "service control policies",
          "shared responsibility model"
        ]
      },
      "originating_feedback": "A fresh Section 9 review found Topic 9.4 classifying gVisor as a MicroVM, naming AWS Service Catalog as the AWS analogue of VPC Service Controls, claiming that microVM isolation eliminates container breakout, that PrivateLink eliminates public internet exposure, and that VPC Service Controls prevents unauthorized data movement even if valid IAM credentials are compromised, and stating that a read-only root filesystem forces writes into non-executable tmpfs mounts. The page also attributed AWS elastic network interface terminology to Azure Private Link, gave an unsourced 24-hour node recycling interval, and never defined the shared responsibility model the rest of the page assumes.",
      "decision": "Give every isolation layer an explicit condition column stating what has to hold. Classify gVisor as a userspace application kernel distinct from a hardware-virtualized microVM. Replace AWS Service Catalog with service control policies, resource control policies, and VPC endpoint policies. Restate the VPC Service Controls claim inside Google's documented scope, including unsupported services, metadata movement, and callers already inside the perimeter. State that PrivateLink does not remove a service's public endpoint or restrict the reachable target set without an endpoint policy, and use Azure's own term, private endpoint. State that neither Docker's --tmpfs nor a Kubernetes memory-backed emptyDir applies noexec by default. Label the node recycling interval as local operational policy, and open the page with the shared responsibility model.",
      "rationale": "Every corrected claim failed in the same direction: an absolute where the provider documents a condition. The tmpfs claim is the most directly exploitable, because a reader following it believes scratch space is non-executable when it is not, which is exactly the surface a post-exploitation dropper uses. The gVisor classification matters because the row's whole purpose is to distinguish isolation strengths, and a userspace syscall interceptor has a materially different threat model from hardware virtualization.",
      "authoritative_sources": [
        {
          "title": "Google Cloud: VPC Service Controls overview",
          "url": "https://cloud.google.com/vpc-service-controls/docs/overview",
          "supports": "That the perimeter denies access from unauthorized networks using stolen credentials, covers supported services only, is not designed to enforce comprehensive controls on metadata movement, and complements rather than replaces IAM."
        },
        {
          "title": "gVisor documentation",
          "url": "https://gvisor.dev/docs/",
          "supports": "That gVisor is an application kernel intercepting system calls in userspace and is explicitly not a virtual machine."
        },
        {
          "title": "Docker: tmpfs mounts",
          "url": "https://docs.docker.com/engine/storage/tmpfs/",
          "supports": "That noexec is not a default tmpfs mount option and must be specified explicitly."
        },
        {
          "title": "Microsoft: What is Azure Private Link?",
          "url": "https://learn.microsoft.com/en-us/azure/private-link/private-link-overview",
          "supports": "That Azure's construct is a private endpoint in a virtual network and that instance-level mapping is what provides leakage protection."
        },
        {
          "title": "AWS: What Is Service Catalog?",
          "url": "https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html",
          "supports": "That AWS Service Catalog governs provisioning of approved products and is not a service perimeter or exfiltration control."
        }
      ],
      "verification_methods": [
        "Confirm no isolation or perimeter claim on the page is stated without its condition.",
        "Confirm each provider claim matches the scope stated in that provider's own documentation."
      ],
      "approved_outcome": "Topic 9.4 states each isolation layer with the assumption it rests on, each perimeter control with what it does not stop, and the tmpfs and node-recycling details as the providers and local policy actually define them.",
      "invalidation_conditions": [
        "A provider changes the documented scope or default behavior of one of these controls.",
        "Docker or Kubernetes changes the default mount options for tmpfs or memory-backed emptyDir."
      ],
      "related_decisions": [
        "CD-0052",
        "CD-0053"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-14",
      "last_reviewed_on": "2026-08-14"
    },
    {
      "id": "CD-0056",
      "title": "Restore the fail-safe versus fail-open boundary and the layer-independence condition on Topic 9.1, and align complete mediation with Topics 1.6 and 4.2",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/security-design-principles.md",
          "assets/img/security-design-principles.svg",
          "assets/img/defense-in-depth-tiers.svg"
        ],
        "concepts": [
          "Saltzer and Schroeder principles",
          "fail-safe versus fail-open",
          "complete mediation caching",
          "layer independence",
          "normative strength",
          "work factor and compromise recording"
        ]
      },
      "originating_feedback": "A fresh Section 9 review found Topic 9.1 defining complete mediation as checking every request 'without relying on cached decisions', which contradicts Topic 1.6's 'without caching permission decisions indefinitely' and Topic 4.2's statement that a bounded, revocable cached decision preserves complete mediation. The page also called the eight principles 'the authoritative foundation' and rendered all eight as must statements, asserted without condition that a failure in one tier is contained by the next, omitted the fail-safe versus fail-open boundary that Topic 1.6 explicitly warns about, omitted that defense in depth is not one of the eight, and cited the paper through a West Virginia University URL that no longer resolves while labelling the link IEEE Proceedings.",
      "decision": "Define complete mediation as checking every access on every invocation with caching permitted only under bounded freshness and propagating revocation. Present the eight as design heuristics rather than an authoritative standard, add the paper's two further principles (work factor and compromise recording) with its own caveat that they apply only imperfectly, and state that defense in depth and separation of duties are not among the eight. Add a section separating fail-safe defaults, fail-closed, and fail-open, and noting that the safe direction in safety engineering is hazard-dependent. Add the independence condition to defense in depth and state that layering lowers likelihood rather than eliminating it. Replace the dead reference with the author-hosted MIT copy and correct the citation.",
      "rationale": "The caching definition was a direct cross-page contradiction, and 9.1 is the page a reader consults first, so the stricter wrong reading is the one that sticks. The fail-safe boundary is the omission with the largest practical consequence: 'fail-safe' and 'fail-open' are not synonyms, and a system that fails in the wrong direction during an outage fails silently. Stating layer independence matters because counting boxes on an architecture diagram is the usual substitute for counting independent failure modes.",
      "authoritative_sources": [
        {
          "title": "Saltzer & Schroeder, The Protection of Information in Computer Systems",
          "url": "https://web.mit.edu/Saltzer/www/publications/protection/",
          "supports": "The eight enumerated design principles and their definitions, and the two further principles from physical security that the paper states apply only imperfectly to computer systems."
        }
      ],
      "verification_methods": [
        "Compare the complete mediation wording against Topics 1.6 and 4.2.",
        "Confirm the reference URL resolves and that the citation names the correct publication venue.",
        "Confirm the page states that defense in depth is not among the eight."
      ],
      "approved_outcome": "Topic 9.1 states the eight principles as heuristics with their trade-offs, separates fail-safe from fail-open, gives defense in depth its independence condition, and cites a resolving primary source.",
      "invalidation_conditions": [
        "Topic 1.6 or 4.2 changes its position on bounded caching, which would require all three to move together.",
        "A different authoritative copy of the 1975 paper becomes the repository's preferred citation."
      ],
      "related_decisions": [
        "CD-0006",
        "CD-0052",
        "CD-0053"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-14",
      "last_reviewed_on": "2026-08-14"
    },
