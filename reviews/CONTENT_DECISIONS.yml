      "id": "CD-0081",
      "title": "Make the GRC evidence-collection script paginate and account for keys it cannot evidence",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/grc-framework-strategy.md"
