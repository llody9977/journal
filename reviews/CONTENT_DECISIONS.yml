      "originating_feedback": "A fresh Section 9 review found the Topic 9.2 lede rendering literal asterisks around 'Assume Breach' in the browser, because kramdown does not parse Markdown inside block-level raw HTML such as a <p class=\"lede\"> element. Every automated check in the repository passed on that page. The same review found seven diagram frames drawing on three images, the fourth consecutive section to carry that defect, with no check able to see it. A scan of the built HTML for literal asterisks additionally found two formula lines whose '||' concatenation operators had been counted by kramdown as GFM table delimiters, restructuring the paragraph into a table and breaking the emphasis: the naive MAC construction on Topic 2.8 and the HKDF-Expand block formula on Topic 2.9.",
      "decision": "Extend scripts/verify_rendering_hazards.py with two detectors: Markdown emphasis or links inside block-level raw HTML, reported as a blocking failure; and one image used by more than one diagram frame on a page, reported as a non-blocking warning that names every remaining occurrence. Fix the three pre-existing block-HTML findings on Topics 2.12, 1.3, and 2.13. Fix the two pipe-reparsed formulas with the <p class=\"formula\"> pattern and HTML pipe entities. Do not add a source-level detector for that class: both candidate patterns tested against the repository matched dozens of Liquid filter expressions and JavaScript logical-or operators, so the reliable detector is a scan of built HTML for literal Markdown, which is a rendered-output check rather than a source check.",
      "rationale": "Both defects are invisible to syntax, link, and structure checks and both had survived multiple reviews, which is the same argument that produced CD-0034, CD-0042, and CD-0047 for math spans. The block-HTML case blocks because the fix is a one-line substitution with no judgment involved. The reused-image case warns rather than blocks because replacing a frame requires a purpose-built diagram whose content has been checked against a page, which the register has done one section at a time; a warning keeps the remaining eight files visible instead of letting each review rediscover them.",
      "authoritative_sources": [
        {
          "title": "kramdown syntax: HTML blocks",
          "url": "https://kramdown.gettalong.org/syntax.html",
          "supports": "That Markdown inside block-level HTML is not parsed unless the parser is configured for it, so emphasis written there reaches the reader as source text."
        }
      ],
      "verification_methods": [
        "Run the check against a page with known Markdown inside a lede and confirm it fails.",
        "Run the check against Section 9 after remediation and confirm no reused image is reported.",
        "Confirm the warning path exits zero so the publishing gate is not blocked by the tracked backlog.",
        "Scan the built HTML of all 94 topic pages for literal '**' and confirm none remains."
      ],
      "approved_outcome": "The rendering-hazard check blocks on Markdown inside block-level raw HTML, reports every reused diagram image as a named warning, and passes cleanly across all 94 topic files after the three pre-existing block-HTML findings are fixed.",
      "invalidation_conditions": [
        "The site adopts a kramdown configuration that parses Markdown inside block HTML.",
        "The one-image-per-frame rule is completed across every section, at which point the warning can become a blocking failure."
      ],
      "related_decisions": [
        "CD-0034",
        "CD-0047",
        "CD-0052"
