      },
      "originating_feedback": "The Section 7 fresh review found Topic 9.3 claiming that differential privacy 'guarantees that query outputs reveal no information about any single individual', which contradicts the corrected bounding language on Topic 7.5, and flagged it as an out-of-scope item. Reading the page for that fix surfaced three neighbouring overclaims in the same content units.",
      "decision": "State that differential privacy provides a bound set by epsilon rather than eliminating inference. Describe anonymization as judged by GDPR Recital 26's means-reasonably-likely test rather than as irreversible by any party under any circumstances, and note that published re-identification research has recovered individuals from datasets released as anonymous. Separate the Privacy by Design principles from GDPR Article 25's binding obligation instead of describing the principles as embedded in it. Give each PET an assumption-or-cost column, and state that FHE and SMPC are distinct primitives.",
      "rationale": "The differential privacy wording was the specific inconsistency reported, and leaving the neighbouring absolutes would have left the page overclaiming in the same direction under the same rule — the review standard requires the whole affected content unit to be corrected, not the quoted sentence alone. 'Irreversible by any party under any circumstances' is the more consequential error of the two, because it invites treating an anonymization claim as permanent when the regulation frames it as a risk judgment that moves as linkage data and compute get cheaper. Attributing the seven principles to Article 25 also blurs a design framework into a legal obligation.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-226: Guidelines for Evaluating Differential Privacy Guarantees",
          "url": "https://doi.org/10.6028/NIST.SP.800-226",
          "supports": "That differential privacy states a bound rather than eliminating inference, and that no universal epsilon threshold is specified."
        },
        {
          "title": "ISO/IEC 27701:2025",
          "url": "https://www.iso.org/standard/27701",
          "supports": "The standard's current second edition, October 2025, and its stand-alone scope."
        }
      ],
      "verification_methods": [
        "Confirm Topics 9.3 and 7.5 use the same bounding language for differential privacy.",
        "Confirm Topics 9.3 and 7.5 both treat FHE and SMPC as distinct primitives.",
        "Confirm no absolute claim about anonymization survives in prose, table, diagram, or callout."
      ],
      "approved_outcome": "Topic 9.3 states what each PET bounds and at what cost, separates the design framework from the legal obligation, and frames anonymization as a dated risk judgment.",
      "invalidation_conditions": [
        "A regulator or standards body replaces the reasonable-means test with a different criterion.",
        "A later ISO/IEC 27701 edition supersedes the 2025 second edition."
      ],
      "related_decisions": [
