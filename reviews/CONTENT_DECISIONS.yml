        {
          "title": "Common Criteria Recognition Arrangement (2014)",
          "url": "https://www.commoncriteriaportal.org/ccra/index.cfm",
          "supports": "Mutual recognition covers assurance components up to EAL2 plus ALC_FLR, or conformance to a collaborative Protection Profile."
        },
        {
          "title": "SOG-IS protection profiles",
          "url": "https://www.sogis.eu/uk/pp_en.html",
          "supports": "EN 419 221-5 is a CEN protection profile; a remote-signing QSCD pairs it with EN 419 241-2."
        }
