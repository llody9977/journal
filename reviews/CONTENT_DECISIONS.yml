      "last_reviewed_on": "2026-08-13"
    },
    {
      "id": "CD-0005",
      "title": "Treat replication as one dependency of tested failover, not a complete availability mitigation",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/risk-fundamentals.md",
          "topics/operational-resilience-business-continuity-disaster-recovery.md"
        ],
        "concepts": [
          "multi-region replication",
          "single-zone database dependency",
          "failover",
          "replica promotion",
          "traffic redirection",
          "disaster recovery"
        ]
      },
      "originating_feedback": "The risk matrix said that a single-zone database dependency was mitigated by multi-region replication, while Section 1.9 correctly explained that replication alone is not a complete recovery strategy.",
      "decision": "Describe the mitigation as a tested multi-location failover design that may include replication, promotion, dependency recovery, and traffic redirection.",
      "rationale": "A second copy does not by itself make a service available. Recovery depends on detecting failure, promoting or activating capacity, redirecting traffic, restoring dependencies and credentials, and validating the recovered service.",
      "authoritative_sources": [
        {
          "title": "AWS Well-Architected REL11-BP02",
          "url": "https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_withstand_component_failures_failover2good.html",
          "supports": "Cross-Region replicas still require promotion and traffic redirection during failover."
        },
        {
          "title": "AWS Well-Architected REL10-BP01",
          "url": "https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_fault_isolation_multiaz_region_system.html",
          "supports": "Multi-location resilience combines replication with failover design and location-specific dependencies."
        }
      ],
      "verification_methods": [
        "Compare the risk example with the recovery-strategy, clean-recovery, failover, and testing qualifications in Section 1.9."
      ],
      "approved_outcome": "The risk matrix states that the failure mode is mitigated with a tested multi-location failover design, potentially including cross-region replication, replica promotion, dependency recovery, and traffic redirection.",
      "invalidation_conditions": [
        "The example is explicitly narrowed to data durability rather than service availability.",
        "The referenced platform provides and verifies transparent failover as an inseparable property of the named replication mechanism.",
        "Current primary guidance materially changes the recovery mechanics."
      ],
      "related_decisions": ["CD-0006"],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "4f1d088344b3cd2b146412aefd2352b2f658f6919252b215c54e2d0c0f69a685",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
    {
      "id": "CD-0006",
      "title": "Make preventive-control adequacy conditional on design, configuration, operation, and evidence",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/security-controls-defense-in-depth.md",
          "topics/security-fundamentals.md"
        ],
        "concepts": [
          "preventive control adequacy",
          "known threats",
          "defense in depth",
          "residual risk",
          "control effectiveness"
        ]
      },
      "originating_feedback": "The defense-in-depth page categorically said that preventive controls provide adequate baseline protection against known threats.",
      "decision": "State that preventive controls can provide baseline protection only for threats they were designed, configured, operating, and evidenced to address.",
      "rationale": "A known threat does not make a control adequate. Coverage depends on scope, configuration, implementation defects, operating state, dependencies, attacker paths, and the organization's risk tolerance.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-53 Rev. 5",
          "url": "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final",
          "supports": "Controls express outcomes and require organization-specific selection, tailoring, implementation, and assessment."
        },
        {
          "title": "NIST CSF 2.0",
          "url": "https://www.nist.gov/cyberframework",
          "supports": "Protect, Detect, Respond, and Recover are complementary outcome areas rather than a guarantee that preventive safeguards are adequate."
        }
      ],
      "verification_methods": [
        "Challenge the statement with known-threat counterexamples involving disabled, incomplete, bypassable, or untested controls.",
        "Compare it with the page's design, implementation, operating-effectiveness, and control-lifecycle distinctions."
      ],
      "approved_outcome": "Use conditional wording tied to design, configuration, operating state, and evidence before explaining the need for complementary preventive, detective, and corrective controls.",
      "invalidation_conditions": [
        "The sentence is narrowed to one specific control with defined coverage and current evidence that establishes adequacy for the stated threat model.",
        "The page adopts a sourced normative definition of adequacy with explicit evaluation criteria.",
        "New evidence demonstrates that the qualification is materially incomplete."
      ],
      "related_decisions": ["CD-0001", "CD-0005"],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "4f1d088344b3cd2b146412aefd2352b2f658f6919252b215c54e2d0c0f69a685",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
    {
      "id": "CD-0007",
      "title": "Separate federation assertion issuance from relying-party validation",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/identity-access-fundamentals.md",
          "assets/img/identity-access-architecture.svg"
        ],
        "concepts": [
          "federation assertion issuance",
          "identity provider",
          "relying party validation",
          "federated tokens",
          "FAL"
        ]
      },
      "originating_feedback": "The IAM lede used the non-standard phrase 'asserting federated tokens,' collapsing the issuer, assertion or token representation, transmission, and relying-party validation steps.",
      "decision": "Describe the IAM lifecycle as issuing federation assertions or tokens and validating them at relying parties.",
      "rationale": "In the NIST federation model, an identity provider creates and sends an assertion and the relying party validates it. Protocols may encode the assertion as an ID Token, but the token is not itself an actor that is 'asserted.'",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-63C-4",
          "url": "https://pages.nist.gov/800-63-4/sp800-63c.html",
          "supports": "The IdP creates and sends assertions and the RP validates them; an OpenID Connect ID Token is an example assertion representation."
        }
      ],
      "verification_methods": [
        "Compare the lede with the page's Federation and Trust-Agreement Management lifecycle row and the IAM diagram's FAL card."
      ],
      "approved_outcome": "The lede says 'issuing federation assertions or tokens and validating them at relying parties'; downstream lifecycle text retains the distinct IdP and RP responsibilities.",
      "invalidation_conditions": [
        "The page narrows to one protocol whose formal terminology requires a different actor and operation description.",
        "NIST or the adopted federation specification materially changes the issuer and relying-party roles.",
        "A clearer replacement preserves the same actor and validation boundaries."
      ],
      "related_decisions": ["CD-0003", "CD-0008"],
      "supersedes": [],
      "superseded_by": null,
      "originating_review_state_id": "4f1d088344b3cd2b146412aefd2352b2f658f6919252b215c54e2d0c0f69a685",
      "originated_on": "2026-08-13",
      "last_reviewed_on": "2026-08-13"
    },
    {
      "id": "CD-0008",
      "title": "Show IAM stage progression without implying that IAL, AAL, and FAL are sequential",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/identity-access-fundamentals.md",
          "assets/img/identity-access-architecture.svg"
        ],
        "concepts": [
          "IAM diagram connectors",
          "setup to runtime to revocation",
          "IAL AAL FAL independence",
          "lifecycle sequence"
        ]
      },
      "originating_feedback": "The optional review item noted that the caption expressed setup, enforcement, and revocation as a sequence while the diagram relied only on numbered cards and had no visible stage connectors.",
      "decision": "Add connectors between the setup row, runtime enforcement row, and lifecycle revocation and audit row, but do not connect IAL, AAL, and FAL to one another as if they were sequential levels or stages.",
      "rationale": "The lifecycle groups have a useful operating progression, while NIST requires IAL, AAL, and FAL to be selected independently. Stage-level connectors improve recall without creating a new assurance-model error.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-63-4",
          "url": "https://pages.nist.gov/800-63-4/",
          "supports": "IAL, AAL, and FAL address separate assurance dimensions and are selected independently."
        }
      ],
      "verification_methods": [
        "Render the SVG and confirm that arrows connect row-level lifecycle stages rather than the three assurance cards.",
        "Compare the visible connectors with the SVG description, page alt text, and caption."
      ],
      "approved_outcome": "Visible row-level arrows labeled for runtime use and revocation or audit, with enough vertical spacing to avoid card overlap; no arrows that imply IAL then AAL then FAL progression.",
      "invalidation_conditions": [
        "The diagram is redesigned so another unambiguous visual device communicates the same stage progression.",
        "Rendered arrows overlap or materially reduce readability.",
        "The page's lifecycle scope changes so setup, enforcement, and revocation are no longer the intended relationship."
      ],
      "related_decisions": ["CD-0007"],
      "supersedes": [],
      "superseded_by": null,
