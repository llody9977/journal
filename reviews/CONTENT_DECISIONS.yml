      },
      "originating_feedback": "A fresh Section 13 review found the table headed 'ISO/IEC 27701:2025 PIMS Control Mapping' citing clauses 7.2.1, 7.2.2, 7.2.5, 7.2.6, 7.3.1-7.3.9, 7.4.1-7.4.8, 7.5.1 and 8.5.8. Those are ISO/IEC 27701:2019 numbers. The 2025 edition adopted the Harmonized Structure, so clauses 4-10 are the generic management-system clauses (clause 7 is Support, clause 8 is Operation) and the privacy controls moved into a consolidated Annex A. Two rows were also wrong under the 2019 numbering they actually used: data minimisation was mapped to 7.2.5/7.2.6, which are Privacy impact assessment and Contracts with PII processors, while privacy by design was mapped to 7.4, which is where minimisation actually lives. The breach-notification row cited 7.5.1 (Identify basis for PII transfer between jurisdictions) and 8.5.8 (Change of subcontractor to process PII), neither of which concerns breach notification.",
      "decision": "Re-key the table to ISO/IEC 27701:2025 Annex A control areas (A.1.2 conditions for collection and processing, A.1.3 obligations to PII principals, A.1.4 privacy by design and privacy by default), name only individually confirmed control identifiers (A.1.2.6, A.1.2.7, A.1.2.8, A.1.3.11, A.1.4.5), explain the 2019-to-2025 restructure in prose above the table, point readers at the standard's own Annex F correspondence table, and state that an exact control number for a Statement of Applicability must be taken from the standard rather than from this or any other secondary mapping. Correct the CCPA right-to-correct citation to Sec. 1798.106.",
      "rationale": "A clause-to-statute crosswalk is the most operational artifact on the page, and pointing an implementer at the wrong controls of a withdrawn edition while labelling them current is worse than omitting the mapping. Group-level Annex A references are verifiable from public sources and remain correct; individual sub-numbers beyond the confirmed set are not verifiable without the paid standard, so the page states that limit instead of guessing.",
      "authoritative_sources": [
        {
          "title": "ISO/IEC 27701:2025",
          "url": "https://www.iso.org/standard/27701",
          "supports": "The 2025 edition uses the Harmonized Structure with clauses 4-10 and consolidates privacy controls into Annex A (A.1 controllers, A.2 processors, A.3 information security)."
        },
        {
          "title": "California Consumer Privacy Act",
          "url": "https://oag.ca.gov/privacy/ccpa",
          "supports": "The right to correct inaccurate personal information is Sec. 1798.106, distinct from Sec. 1798.105 (delete) and Sec. 1798.110 (know)."
        }
      ],
      "verification_methods": [
        "Confirm against published descriptions of ISO/IEC 27701:2025 that clause 7 is Support and clause 8 is Operation.",
        "Confirm the Annex A group headings and the individually named control identifiers against public control references.",
        "Confirm ISO/IEC 27701:2019 titles for 7.2.5, 7.4.x, 7.5.1 and 8.5.8 to establish that the previous mapping was wrong under either edition."
      ],
      "approved_outcome": "The mapping table cites 2025 Annex A control areas, names only verified control identifiers, discloses that exact sub-numbers must come from the standard, and no longer presents 2019 clause numbers as current.",
      "invalidation_conditions": [
        "A further edition of ISO/IEC 27701 renumbers Annex A.",
        "The complete 2025 Annex A control list becomes available from an authoritative public source, at which point the table can name every control precisely."
      ],
