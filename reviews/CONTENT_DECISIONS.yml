        ],
        "concepts": [
          "journal working model labelling",
          "diagnostic checklist provenance",
          "comprehensive scope claim",
          "page description accuracy",
          "illustrative timings"
        ]
      },
      "originating_feedback": "A fresh Section 10 review found that all four pages presented six-row author-created diagnostic checklists with audit-evidence columns as though drawn from a published standard, and that all four descriptions opened 'Comprehensive technical guide to' while required foundational gaps remained. The same pattern was found on Topic 12.2, which additionally presented manual-versus-automated response durations as measured values with no source.",
      "decision": "Apply the rule recorded in CD-0035 and extended by CD-0050 and CD-0053 to Section 10: prefix every author-created diagnostic checklist with an explicit journal-working-model statement, and change each page description from 'Comprehensive technical guide to' to 'Technical reference for'. Apply the same treatment to Topic 12.2 and relabel its SOAR timing table as illustrative orders of magnitude rather than measured benchmarks. Also label the five-phase SSDLC view on Topic 10.3 as a journal working model, since NIST SP 800-218 defines four practice groups rather than lifecycle phases.",
      "rationale": "WRITING_STYLE requires an author-created synthesis to be labelled so a reader cannot mistake it for an official model, requires numerical values to be sourced or marked illustrative, and requires a comprehensiveness claim to define and justify its scope. Sections 1, 6, 8, and 9 had already moved to the scoped formulation, so Section 10 was the inconsistent case.",
      "authoritative_sources": [
        {
