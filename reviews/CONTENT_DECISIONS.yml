    {
      "id": "CD-0076",
      "title": "Track the current edition when a standard renames or re-bases its levels: ASVS 5.0, CSF 2.0 Tiers, SLSA v1.2, BSIMM16",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "topics/cybersecurity-standards.md",
          "topics/security-maturity-models.md"
        ],
        "concepts": [
          "ASVS level names",
          "CSF Tiers",
          "External Participation",
          "SLSA track versioning",
          "BSIMM edition currency",
          "OWASP SAMM level names",
          "superseded edition",
          "standard edition currency"
        ]
      },
      "originating_feedback": "A fresh Section 13 review found four version-currency defects of the same shape, where a page named a current version and then described a previous edition's content. Topic 13.1 named ASVS 5.0.0 and gave the ASVS 4.0 level names (Opportunistic, Standard, High Assurance) with a Level 1 description that ASVS 5.0 explicitly contradicts. Topic 13.5 attributed to NIST an explicit clarification that CSF Tiers are not maturity levels, which appears in CSF 1.1 but in neither CSF 2.0 nor the cited SP 1302; described the Tiers using CSF 1.1's removed External Participation element rather than CSF 2.0's two dimensions; attributed the track-based level scheme to SLSA v1.2 when v1.x introduced it and v1.2's actual headline change is the approved Source track; and cited BSIMM14 when BSIMM16 was published in February 2026. The same page also gave OWASP SAMM invented level names, Unperformed and Optimized, the latter contradicting the sourced Level 3 description eight lines below it.",
      "decision": "State each level scheme in the words of its current edition, name the edition that a historical statement belongs to rather than attributing it to the current one, and never carry a level name that the standard does not use. Specifically: give ASVS 5.0 levels their priority-based definitions with the proportions the standard states; attribute the 'not maturity levels' sentence to CSF 1.1 and describe CSF 2.0 Tiers by their two dimensions, Cybersecurity Risk Governance and Cybersecurity Risk Management; attribute the track scheme to SLSA v1.x and record the Source track as v1.2's change; cite BSIMM16; and use SAMM's own Level 0-3 descriptions with no invented names.",
      "rationale": "Naming a current version and describing a superseded one is more misleading than citing the old version openly, because the reader has no signal to check. The four defects share a cause: a level scheme is the part of a standard most likely to be re-based between editions and least likely to look stale when it is.",
      "authoritative_sources": [
        {
          "title": "OWASP ASVS 5.0 - What is the ASVS?",
          "url": "https://owasp.org/www-project-application-security-verification-standard/",
          "supports": "ASVS 5.0 defines three priority-based levels holding roughly 20, 50 and 30 percent of requirements, and states that Level 1 is not necessarily verifiable by an external black-box tester."
        },
        {
          "title": "NIST Cybersecurity Framework 2.0 (CSWP 29)",
          "url": "https://doi.org/10.6028/NIST.CSWP.29",
          "supports": "Section 3.2 says Tiers characterize the rigor of cybersecurity risk governance and management practices; it contains no statement that Tiers are not maturity levels."
        },
        {
          "title": "NIST SP 1302 Quick-Start Guide for Using the CSF Tiers",
          "url": "https://csrc.nist.gov/pubs/sp/1302/final",
          "supports": "Each Tier has separate descriptions for Cybersecurity Risk Governance and Cybersecurity Risk Management; there is no external-participation dimension."
        },
        {
          "title": "SLSA v1.2 What's new",
          "url": "https://slsa.dev/spec/v1.2/whats-new",
          "supports": "v1.2's change relative to v1.1 is the addition of the approved Source track; the track structure predates it."
        },
        {
          "title": "OWASP SAMM benchmark report",
          "url": "https://owaspsamm.org/benchmark/benchmark-report/",
          "supports": "SAMM levels are numbered 0 to 3 with descriptive text and carry no names such as Unperformed or Optimized."
        }
      ],
      "verification_methods": [
        "Read the current edition's own level definitions before restating them.",
        "When a page asserts that a standards body says something, locate the sentence in the cited document; if it is only in a previous edition, name that edition.",
        "Check the publication date of every maturity-model reference against the current edition at review time."
      ],
      "approved_outcome": "Section 13 states ASVS 5.0, CSF 2.0 Tier, SLSA v1.2 and SAMM level content in the current editions' own terms, cites BSIMM16, and attributes historical statements to the edition that made them.",
      "invalidation_conditions": [
        "Any of these standards publishes a new edition that re-bases its levels again.",
        "A future CSF edition restores an explicit maturity-level disclaimer or an external-participation Tier dimension."
      ],
      "related_decisions": [
        "CD-0030",
