        ]
      },
      "originating_feedback": "A fresh Section 13 review found three defects in the automated GRC evidence-collection script. Its docstring promised an AWS KMS key rotation and IAM MFA audit while only the KMS function existed. It called kms.list_keys() without pagination, which returns at most 100 keys and ignores Truncated and NextMarker, so an account with more keys would produce a complete-looking evidence payload from an arbitrary subset. And it called get_key_rotation_status on every customer-managed key, which raises UnsupportedOperationException for asymmetric keys, HMAC keys, imported key material and custom key stores, aborting the run before anything was printed.",
      "decision": "Paginate with get_paginator('list_keys'); filter to symmetric keys with AWS-generated material before calling get_key_rotation_status and record everything else as not_applicable with the reason rather than skipping it; correct the docstring to what the script does; and follow the block with an explicit statement of what the evidence proves and what it leaves unevidenced.",
      "rationale": "Silent truncation is the worst failure mode available to an evidence collector, because the output is indistinguishable from a complete run and an auditor is being handed a population that was never fully read. Recording non-rotatable keys as not_applicable keeps the population complete and makes the manual remainder visible instead of hiding it.",
      "authoritative_sources": [
        {
          "title": "boto3 KMS list_keys",
          "url": "https://docs.aws.amazon.com/boto3/latest/reference/services/kms/client/list_keys.html",
          "supports": "Limit defaults to 100 and the response is paginated via Truncated and NextMarker."
        },
        {
          "title": "boto3 KMS get_key_rotation_status",
          "url": "https://docs.aws.amazon.com/boto3/latest/reference/services/kms/client/get_key_rotation_status.html",
          "supports": "Automatic rotation is supported only for symmetric encryption KMS keys; the call raises UnsupportedOperationException otherwise."
        }
      ],
      "verification_methods": [
        "Check every cloud-API listing call in journal code for pagination.",
        "Check every per-resource call against the documented exception list for resource types the enumeration can return.",
        "Confirm the surrounding prose states what the demonstration does not prove."
      ],
      "approved_outcome": "The script paginates, classifies non-rotatable keys as not_applicable with a reason, carries an accurate docstring, and is followed by an explicit proves/does-not-prove statement.",
      "invalidation_conditions": [
        "AWS extends automatic rotation to further key types.",
        "The example is replaced by one using a different provider or API."
