      "rationale": "CD-0025 recorded an invalidation condition of 'MITRE changes the core structure of the Enterprise ATT&CK matrix or taxonomy hierarchy'. That condition is now met by current primary evidence, so the earlier outcome is superseded on this point rather than reversed by preference. Because the count itself is what drifted, the page must additionally teach the reader not to rely on a hardcoded number - detection content tagged to a retired tactic name will not map cleanly after an ATT&CK upgrade.",
