title: Field Journal
description: >-
  My working security engineering journal — explanations, command output,
  diagrams, references, and corrections kept for the next time I need them.
baseurl: "/journal"
url: "https://llody9977.github.io"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
