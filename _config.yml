title: Field Journal
description: >-
  My working security engineering journal — explanations, command output,
  diagrams, references, and corrections kept for the next time I need them.
baseurl: "/journal"
url: "https://llody9977.github.io"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .ruby-version
  - AGENTS.md
  - README.md
  - REVIEW_STANDARD.md
  - WRITING_STYLE.md
  - Gemfile
  - Gemfile.lock
  - bin
  - node_modules
  - package-lock.json
  - package.json
  - reviews
  - scripts
  - vendor
