<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Threat Frameworks Architecture</title>
  <desc id="description">Threat Frameworks Architecture showing Design-Time Threat Modeling (STRIDE, PASTA, VAST, OCTAVE, OWASP 4-Question) and Operational Intrusion Intelligence (Cyber Kill Chain, Diamond Model, MITRE ATT&amp;CK &amp; D3FEND).</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Threat Frameworks Architecture</text>
  <text x="50" y="88" font-size="16" fill="#475569">Threat Frameworks Architecture showing Design-Time Threat Modeling (STRIDE, PASTA, VAST, OCTAVE, OWASP 4-Question) and Operational Intrusion Intelligence (Cyber Kill Chain, Diamond Model, MITRE ATT&amp;CK &amp; D3FEND).</text>
  
    <!-- Top Section: Design-Time Threat Modeling Frameworks (y=115, h=135) -->
    <!-- Card 1: STRIDE & DFD (x=40, w=355) -->
    <rect x="40" y="115" width="355" height="135" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5" />
    <text x="60" y="142" font-size="11" font-weight="900" letter-spacing="1" fill="#b91c1c">DESIGN-TIME: STRIDE &amp; DFD MAPPING</text>
    <text x="60" y="165" font-size="14" font-weight="800" fill="#0f172a">Developer-Centric Threat Taxonomy</text>
    <line x1="60" y1="176" x2="375" y2="176" stroke="#b91c1c" stroke-opacity="0.3" stroke-width="1" />
    <text x="60" y="196" font-size="11.5" font-weight="500" fill="#475569">• 6 Categories: Spoofing, Tampering, Repudiation,</text>
    <text x="60" y="214" font-size="11.5" font-weight="500" fill="#475569">  Info Disclosure, DoS, Elevation of Privilege</text>

    <!-- Card 2: PASTA & VAST (x=422, w=355) -->
    <rect x="422" y="115" width="355" height="135" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
    <text x="442" y="142" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">DESIGN-TIME: PASTA &amp; VAST METHODOLOGIES</text>
    <text x="442" y="165" font-size="14" font-weight="800" fill="#0f172a">Risk-Centric &amp; Agile DevSecOps</text>
    <line x1="442" y1="176" x2="757" y2="176" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
    <text x="442" y="196" font-size="11.5" font-weight="500" fill="#475569">• PASTA: 7-stage business impact risk alignment</text>
    <text x="442" y="214" font-size="11.5" font-weight="500" fill="#475569">• VAST: Automated DevSecOps CI/CD storyboarding</text>

    <!-- Card 3: OWASP 4-Questions (x=805, w=355) -->
    <rect x="805" y="115" width="355" height="135" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
    <text x="825" y="142" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">DESIGN-TIME: OWASP 4-QUESTION ENGINE</text>
    <text x="825" y="165" font-size="14" font-weight="800" fill="#0f172a">Continuous Sprint Review Engine</text>
    <line x1="825" y1="176" x2="1140" y2="176" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
    <text x="825" y="196" font-size="11.5" font-weight="500" fill="#475569">• 1. Model $ightarrow$ 2. Threats $ightarrow$ 3. Controls $ightarrow$ 4. Audit</text>
    <text x="825" y="214" font-size="11.5" font-weight="500" fill="#475569">• Universal meta-process across engineering teams</text>

    <!-- Middle Section: Runtime & Operational Threat Intel (y=265, h=145) -->
    <!-- Card 1: Cyber Kill Chain (x=40, w=355) -->
    <rect x="40" y="265" width="355" height="145" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <text x="60" y="292" font-size="11" font-weight="900" letter-spacing="1" fill="#7c3aed">RUNTIME: CYBER KILL CHAIN (7 STAGES)</text>
    <text x="60" y="315" font-size="13" font-weight="800" fill="#0f172a">Linear Intrusion Lifecycle</text>
    <line x1="60" y1="326" x2="375" y2="326" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" />
    <text x="60" y="346" font-size="11" font-weight="500" fill="#475569">Recon $ightarrow$ Weaponize $ightarrow$ Deliver $ightarrow$ Exploit</text>
    <text x="60" y="364" font-size="11" font-weight="500" fill="#475569">$ightarrow$ Install $ightarrow$ C2 $ightarrow$ Actions on Objectives</text>

    <!-- Card 2: Diamond Model (x=422, w=355) -->
    <rect x="422" y="265" width="355" height="145" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
    <text x="442" y="292" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">RUNTIME: DIAMOND MODEL (PIVOTING)</text>
    <text x="442" y="315" font-size="13" font-weight="800" fill="#0f172a">Adversary Attribution Matrix</text>
    <line x1="442" y1="326" x2="757" y2="326" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
    <text x="442" y="346" font-size="11" font-weight="500" fill="#475569">Connects 4 Pivoting Vertices:</text>
    <text x="442" y="364" font-size="11" font-weight="500" fill="#475569">Adversary $leftrightarrow$ Capability $leftrightarrow$ Infrastructure $leftrightarrow$ Victim</text>

    <!-- Card 3: MITRE ATT&CK & D3FEND (x=805, w=355) -->
    <rect x="805" y="265" width="355" height="145" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="825" y="292" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">RUNTIME: MITRE ATT&amp;CK &amp; D3FEND</text>
    <text x="825" y="315" font-size="13" font-weight="800" fill="#0f172a">Non-Linear TTP Knowledge Base</text>
    <line x1="825" y1="326" x2="1140" y2="326" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
    <text x="825" y="346" font-size="11" font-weight="500" fill="#475569">• ATT&amp;CK: 15 Tactics &amp; 600+ TTPs (Offensive)</text>
    <text x="825" y="364" font-size="11" font-weight="500" fill="#475569">• D3FEND: Model, Harden, Detect, Isolate (Defensive)</text>

    <!-- Bottom Stage: Threat Framework Taxonomy Summary (y=425, h=50) -->
    <rect x="40" y="425" width="1120" height="50" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <text x="600" y="446" text-anchor="middle" font-size="11" font-weight="900" letter-spacing="1" fill="#0f172a">THREAT FRAMEWORK ARCHITECTURE TAXONOMY</text>
    <text x="600" y="462" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Design-Time Threat Modeling (STRIDE/PASTA/VAST/OCTAVE) $longleftrightarrow$ Operational Intrusion Intel (Kill Chain / Diamond / MITRE ATT&amp;CK &amp; D3FEND)</text>
</svg>
