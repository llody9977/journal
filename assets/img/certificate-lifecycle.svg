<svg viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="620" fill="#ffffff" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491a3" />
    </marker>
  </defs>

  <!-- hexagon connecting arcs, drawn first so nodes sit on top -->
  <g fill="none" stroke="#8491a3" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M330 175 A160 160 0 0 1 462 253" />
    <path d="M470 267 A160 160 0 0 1 470 353" />
    <path d="M462 367 A160 160 0 0 1 330 445" />
    <path d="M310 445 A160 160 0 0 1 178 367" />
    <path d="M170 353 A160 160 0 0 1 170 267" />
    <path d="M178 253 A160 160 0 0 1 305 178" />
  </g>

  <!-- nodes: hexagon layout, cx=350 cy=310 R=160 -->
  <g>
    <!-- 1 Key Generation (top) -->
    <rect x="255" y="110" width="190" height="66" rx="12" fill="#193e9f" />
    <text x="350" y="136" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">① Key Generation</text>
    <text x="350" y="154" font-size="10.5" fill="#c9d7fb" text-anchor="middle">private key never leaves the subject</text>

    <!-- 2 CSR (upper right) -->
    <rect x="470" y="190" width="180" height="66" rx="12" fill="#2457d6" />
    <text x="560" y="216" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">② CSR</text>
    <text x="560" y="234" font-size="10.5" fill="#dbe7ff" text-anchor="middle">sent to the CA</text>

    <!-- 3 Validation (lower right) -->
    <rect x="470" y="365" width="180" height="66" rx="12" fill="#2457d6" />
    <text x="560" y="391" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">③ Validation</text>
    <text x="560" y="409" font-size="10.5" fill="#dbe7ff" text-anchor="middle">DV / OV / EV check</text>

    <!-- 4 Issuance (bottom) -->
    <rect x="255" y="445" width="190" height="66" rx="12" fill="#2457d6" />
    <text x="350" y="471" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">④ Issuance</text>
    <text x="350" y="489" font-size="10.5" fill="#dbe7ff" text-anchor="middle">CA signs the certificate</text>

    <!-- 5 Deployment (lower left) -->
    <rect x="50" y="365" width="180" height="66" rx="12" fill="#2457d6" />
    <text x="140" y="391" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">⑤ Deployment</text>
    <text x="140" y="409" font-size="10.5" fill="#dbe7ff" text-anchor="middle">installed with full chain</text>

    <!-- 6 Renewal (upper left) -->
    <rect x="50" y="190" width="180" height="66" rx="12" fill="#2457d6" />
    <text x="140" y="216" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">⑥ Renewal</text>
    <text x="140" y="234" font-size="10.5" fill="#dbe7ff" text-anchor="middle">before it expires — loops to ②</text>
  </g>

  <!-- revocation, branching off from Deployment -->
  <line x1="140" y1="431" x2="140" y2="520" stroke="#a14c00" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)" />
  <rect x="45" y="520" width="190" height="66" rx="12" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="140" y="546" font-size="14" font-weight="700" fill="#a14c00" text-anchor="middle">⚠ Revocation</text>
  <text x="140" y="564" font-size="10" fill="#a14c00" text-anchor="middle">anytime, if compromised</text>
  <text x="140" y="577" font-size="10" fill="#a14c00" text-anchor="middle">or mis-issued</text>

  <text x="350" y="315" font-size="12" fill="#8491a3" text-anchor="middle" font-family="ui-monospace,monospace" letter-spacing="1">CERTIFICATE</text>
  <text x="350" y="332" font-size="12" fill="#8491a3" text-anchor="middle" font-family="ui-monospace,monospace" letter-spacing="1">LIFECYCLE</text>
</svg>
