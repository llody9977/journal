<svg viewBox="0 0 1200 435" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Automated X.509 Certificate Lifecycle &amp; ACME Protocol</title>
  <desc id="description">Automated lifecycle: Key Generation → CSR Submission → DV Validation → CA Issuance → Deployment → Renewal</desc>
  <rect width="1200" height="435" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Automated X.509 Certificate Lifecycle &amp; ACME Protocol</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Automated lifecycle: Key Generation → CSR Submission → DV Validation → CA Issuance →</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">Deployment → Renewal</text>
  
    <g>
      <!-- Top Row: 6 Sequential Lifecycle Cards -->
      <!-- Step 1: Key Generation -->
      <rect x="50" y="110" width="165" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="65" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">STEP 1</text>
      <text x="65" y="158" font-size="14" font-weight="800" fill="#0f172a">Key Generation</text>
      <text x="65" y="180" font-size="11.5" font-weight="500" fill="#475569">Generate private key</text>
      <text x="65" y="196" font-size="11" font-weight="600" fill="#0f766e">Kept in RAM / HSM</text>

      <path d="M215 165 L245 165" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

      <!-- Step 2: CSR Submission -->
      <rect x="245" y="110" width="165" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="260" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">STEP 2</text>
      <text x="260" y="158" font-size="14" font-weight="800" fill="#0f172a">CSR Request</text>
      <text x="260" y="180" font-size="11.5" font-weight="500" fill="#475569">PKCS#10 payload</text>
      <text x="260" y="196" font-size="11" font-weight="600" fill="#2563eb">Sent to ACME CA</text>

      <path d="M410 165 L440 165" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

      <!-- Step 3: Domain Validation -->
      <rect x="440" y="110" width="165" height="110" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
      <text x="455" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">STEP 3</text>
      <text x="455" y="158" font-size="14" font-weight="800" fill="#0f172a">DV Validation</text>
      <text x="455" y="180" font-size="11.5" font-weight="500" fill="#475569">DNS-01 / HTTP-01</text>
      <text x="455" y="196" font-size="10" font-weight="600" fill="#b45309">Validates Domain Control</text>

      <path d="M605 165 L635 165" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

      <!-- Step 4: CA Issuance -->
      <rect x="635" y="110" width="165" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
      <text x="650" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">STEP 4</text>
      <text x="650" y="158" font-size="14" font-weight="800" fill="#0f172a">CA Issuance</text>
      <text x="650" y="180" font-size="11.5" font-weight="500" fill="#475569">Signs X.509 cert</text>
      <text x="650" y="196" font-size="11" font-weight="600" fill="#0f766e">&#8804;200 Day Lifetime (2026)</text>

      <path d="M800 165 L830 165" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

      <!-- Step 5: Web Deployment -->
      <rect x="830" y="110" width="165" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
      <text x="845" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">STEP 5</text>
      <text x="845" y="158" font-size="14" font-weight="800" fill="#0f172a">Web Deployment</text>
      <text x="845" y="180" font-size="11.5" font-weight="500" fill="#475569">Installs full chain</text>
      <text x="845" y="196" font-size="11" font-weight="600" fill="#0f172a">Binds to TLS Server</text>

      <path d="M995 165 L1025 165" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

      <!-- Step 6: ARI Auto-Renewal -->
      <rect x="1025" y="110" width="125" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="1037" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">STEP 6</text>
      <text x="1037" y="158" font-size="13" font-weight="800" fill="#0f172a">ARI Renewal</text>
      <text x="1037" y="180" font-size="10.5" font-weight="500" fill="#475569">Auto-renew</text>
      <text x="1037" y="196" font-size="10.5" font-weight="600" fill="#2563eb">ACME Agent</text>

      <!-- Auto-Renewal Loop Arrow (Card 6 back to Card 2) -->
      <path d="M 1087 220 L 1087 260 L 327 260 L 327 225" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
      <rect x="620" y="248" width="180" height="24" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
      <text x="710" y="264" text-anchor="middle" font-size="11" font-weight="800" fill="#2563eb">Automated ACME Renewal Loop</text>

      <!-- Bottom Branch: Emergency Revocation -->
      <rect x="50" y="320" width="1100" height="110" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="70" y="348" font-size="11" font-weight="900" letter-spacing="1" fill="#b91c1c">EMERGENCY EXCEPTION: REVOCATION (CRL / OCSP STAPLING)</text>
      <text x="70" y="374" font-size="16" font-weight="800" fill="#0f172a">Key Compromise or Mis-Issuance Trigger</text>
      <text x="70" y="398" font-size="13" font-weight="600" fill="#475569">CA revokes certificate serial number; browser checks status via OCSP Stapling or Certificate Revocation Lists (CRL)</text>
      <text x="70" y="416" font-size="12" font-weight="700" fill="#b91c1c">Revocation is best-effort, not guaranteed-immediate: many clients soft-fail when status is unavailable</text>
    </g>
</svg>
