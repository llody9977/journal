<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Cloud &amp; Distributed Secure Architecture Patterns Diagram</title>
  <desc id="description">Cloud Secure Architecture diagram showing multi-tenant isolation, VPC Service Controls, PrivateLink, immutable infrastructure, and egress filtering.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Cloud &amp; Distributed Secure Architecture Patterns</text>
  <text x="50" y="75" font-size="14" fill="#475569">Multi-tenant isolation, VPC Service Controls, PrivateLink endpoints, and immutable infrastructure patterns.</text>
  
  <!-- Multi-Tenant Isolation (x=40, w=540, y=105, h=160) -->
  <rect x="40" y="105" width="540" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">MULTI-TENANT DATA &amp; WORKLOAD ISOLATION</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">Logical vs Physical Boundary Segregation</text>
  <line x1="60" y1="166" x2="560" y2="166" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">• Compute: Dedicated instance / container microVMs (Firecracker / gVisor)</text>
  <text x="60" y="206" font-size="11.5" font-weight="500" fill="#475569">• Storage: Row-level security (RLS), tenant key per-tenant envelope encryption</text>
  <text x="60" y="226" font-size="11.5" font-weight="500" fill="#475569">• Control Plane: Isolated IAM role assume policies per customer tenant</text>

  <!-- Cloud Perimeters (x=620, w=540, y=105, h=160) -->
  <rect x="620" y="105" width="540" height="160" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="640" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">NETWORK &amp; SERVICE PERIMETERS</text>
  <text x="640" y="155" font-size="14" font-weight="800" fill="#0f172a">Private Endpoints &amp; Egress Control</text>
  <line x1="640" y1="166" x2="1140" y2="166" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="640" y="186" font-size="11.5" font-weight="500" fill="#475569">• AWS PrivateLink / Azure Private Link: Traffic stays on cloud backbone</text>
  <text x="640" y="206" font-size="11.5" font-weight="500" fill="#475569">• GCP VPC Service Controls: Prevents data exfiltration across API perimeters</text>
  <text x="640" y="226" font-size="11.5" font-weight="500" fill="#475569">• Egress Filtering: Strict FQDN proxy whitelist blocking un-authorized C2 outbound</text>

  <!-- Immutable Infrastructure (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">IMMUTABLE INFRASTRUCTURE &amp; SIDECAR PATTERNS</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Zero-Patching-In-Place &amp; Decoupled Security Services</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="366" font-size="11.5" font-weight="500" fill="#475569">• Immutable Nodes: Workloads deployed as read-only container images; never modified in place</text>
  <text x="60" y="384" font-size="11.5" font-weight="500" fill="#475569">• Sidecar Proxy Pattern: Offloads mTLS encryption, authentication, and logging from application containers</text>
  <text x="60" y="402" font-size="11.5" font-weight="500" fill="#475569">• Ephemeral Lifespans: Continuous automatic worker node recycling (24-hour max lifespan) to purge undetected malware</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">CLOUD ARCHITECTURE: MULTI-TENANT ISOLATION → PRIVATE LINK PERIMETERS → IMMUTABLE WORKLOADS → SIDECAR SECURITY</text>
</svg>
