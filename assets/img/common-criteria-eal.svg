<svg viewBox="0 0 1200 1349" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Common Criteria evaluation assurance levels</title>
  <desc id="description">Higher EALs require progressively more rigorous design evidence and independent evaluation.</desc>
  <rect width="1200" height="1349" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Common Criteria evaluation assurance levels</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Higher EALs require progressively more rigorous design evidence and independent</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">evaluation.</text>
  
    <g>
      <rect x="80" y="130" width="1040" height="130" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="105" y="161" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">EAL 1</text>
      <text x="105" y="195" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Functionally tested</text>
      <text x="105" y="235" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Basic independent testing of available product information.</text>
    </g>

    <g>
      <rect x="80" y="304" width="1040" height="130" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="105" y="335" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">EAL 2</text>
      <text x="105" y="369" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Structurally tested</text>
      <text x="105" y="409" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Adds developer evidence and structural analysis.</text>
    </g>

    <g>
      <rect x="80" y="478" width="1040" height="130" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="105" y="509" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">EAL 3</text>
      <text x="105" y="543" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Methodically tested and checked</text>
      <text x="105" y="583" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Adds systematic development and testing evidence.</text>
    </g>

    <g>
      <rect x="80" y="652" width="1040" height="130" rx="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
      <text x="105" y="683" font-size="12" font-weight="900" letter-spacing="1" fill="#7c3aed">EAL 4</text>
      <text x="105" y="717" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Methodically designed, tested, and reviewed</text>
      <text x="105" y="757" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Common upper target for conventional commercial products.</text>
    </g>

    <g>
      <rect x="80" y="826" width="1040" height="130" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
      <text x="105" y="857" font-size="12" font-weight="900" letter-spacing="1" fill="#15803d">EAL 5</text>
      <text x="105" y="891" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Semiformally designed and tested</text>
      <text x="105" y="931" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Adds semiformal design descriptions and stronger analysis.</text>
    </g>

    <g>
      <rect x="80" y="1000" width="1040" height="130" rx="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
      <text x="105" y="1031" font-size="12" font-weight="900" letter-spacing="1" fill="#b91c1c">EAL 6</text>
      <text x="105" y="1065" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Semiformally verified design and tested</text>
      <text x="105" y="1105" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Targets high-value assets with specialized engineering.</text>
    </g>

    <g>
      <rect x="80" y="1174" width="1040" height="130" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="105" y="1205" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">EAL 7</text>
      <text x="105" y="1239" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Formally verified design and tested</text>
      <text x="105" y="1279" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Maximum rigor for narrowly scoped, extremely high-risk systems.</text>
    </g>

    <path d="M600 264 L600 300" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="270" width="112" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="680.0" y="287" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">MORE RIGOR</text>
    <path d="M600 438 L600 474" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="444" width="112" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="680.0" y="461" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">MORE RIGOR</text>
    <path d="M600 612 L600 648" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="618" width="112" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="680.0" y="635" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">MORE RIGOR</text>
    <path d="M600 786 L600 822" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="792" width="112" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="680.0" y="809" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">MORE RIGOR</text>
    <path d="M600 960 L600 996" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="966" width="112" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="680.0" y="983" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">MORE RIGOR</text>
    <path d="M600 1134 L600 1170" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="1140" width="112" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="680.0" y="1157" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">MORE RIGOR</text>
</svg>
