<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Infrastructure as Code (IaC) &amp; Immutable Security Architecture</title>
  <desc id="description">IaC Security diagram showing Checkov/tfsec static scanning, Drift Detection, Immutable Infrastructure, and Ephemeral Workloads.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Infrastructure as Code (IaC) &amp; Immutable Security</text>
  <text x="50" y="75" font-size="14" fill="#475569">Static IaC scanning (Checkov/tfsec), Drift Detection, Immutable Nodes, and Ephemeral Workloads.</text>
  
  <!-- IaC Scanning (x=40, w=540, y=105, h=160) -->
  <rect x="40" y="105" width="540" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">STATIC IAC SECURITY SCANNING (CHECKOV / TFSEC)</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">Pre-Deployment Configuration Hardening</text>
  <line x1="60" y1="166" x2="560" y2="166" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">• Terraform / CloudFormation Scanning: Detects public S3 buckets, open security groups (0.0.0.0/0)</text>
  <text x="60" y="206" font-size="11.5" font-weight="500" fill="#475569">• Policy-as-Code (OPA / Conftest): Rego policy enforcement on terraform plan JSON outputs</text>
  <text x="60" y="226" font-size="11.5" font-weight="500" fill="#475569">• CI/CD PR Gates: Blocking pull request merges if high-severity IaC misconfigurations are detected</text>

  <!-- Drift Detection & Immutable Deployment (x=620, w=540, y=105, h=160) -->
  <rect x="620" y="105" width="540" height="160" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="640" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">DRIFT DETECTION &amp; IMMUTABLE DEPLOYMENT</text>
  <text x="640" y="155" font-size="14" font-weight="800" fill="#0f172a">Reconciling Runtime vs Code State</text>
  <line x1="640" y1="166" x2="1140" y2="166" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="640" y="186" font-size="11.5" font-weight="500" fill="#475569">• Drift Detection: Automated reconcilers detecting out-of-band manual cloud console modifications</text>
  <text x="640" y="206" font-size="11.5" font-weight="500" fill="#475569">• Immutable Infrastructure: Virtual machine AMI / container replacement instead of live SSH patching</text>
  <text x="640" y="226" font-size="11.5" font-weight="500" fill="#475569">• GitOps (ArgoCD / Flux): Continuous automated sync enforcing git state as single source of truth</text>

  <!-- Ephemeral Workloads (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">EPHEMERAL WORKLOADS &amp; SECURE TEMPLATES</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Short-Lived Compute &amp; Hardened Golden Images</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="366" font-size="11.5" font-weight="500" fill="#475569">• Golden Image Pipelines: Packer pipelines building CIS-hardened VM images automatically</text>
  <text x="60" y="384" font-size="11.5" font-weight="500" fill="#475569">• Ephemeral Nodes: Automatic max-age recycling purging latent persistence and rootkits</text>
  <text x="60" y="402" font-size="11.5" font-weight="500" fill="#475569">• Zero-SSH Access: Replacing SSH keys with AWS Systems Manager Session Manager / GCP OS Login</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">IAC PIPELINE: TERRAFORM COMMIT → CHECKOV SCANNING → GITOPS AUTO-RECONCILIATION → IMMUTABLE REPLACEMENT</text>
</svg>
