<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Adversary Emulation &amp; Continuous Security Validation Architecture</title>
  <desc id="description">Adversary Emulation diagram showing Purple Teaming workflows, Atomic Red Team execution, Breach &amp; Attack Simulation (BAS), and empirical ATT&amp;CK coverage scoring.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Adversary Emulation &amp; Continuous Security Validation</text>
  <text x="50" y="75" font-size="14" fill="#475569">Purple Teaming workflows, Atomic Red Team, Breach &amp; Attack Simulation (BAS), and empirical ATT&amp;CK coverage validation.</text>
  
  <!-- Purple Teaming vs Red vs BAS (x=40, w=540, y=105, h=160) -->
  <rect x="40" y="105" width="540" height="160" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#7c3aed">OFFENSIVE &amp; DEFENSIVE ALIGNMENT MODELS</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">Red Team vs Purple Team vs BAS</text>
  <line x1="60" y1="166" x2="560" y2="166" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">• Red Teaming: Objective-based, stealthy adversarial simulation</text>
  <text x="60" y="206" font-size="11.5" font-weight="500" fill="#475569">• Purple Teaming: Collaborative, transparent attack execution + detection tuning</text>
  <text x="60" y="226" font-size="11.5" font-weight="500" fill="#475569">• BAS (Breach &amp; Attack Simulation): Continuous automated TTP testing</text>

  <!-- Open Emulation Frameworks (x=620, w=540, y=105, h=160) -->
  <rect x="620" y="105" width="540" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="640" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">OPEN EMULATION FRAMEWORKS &amp; ATOMS</text>
  <text x="640" y="155" font-size="14" font-weight="800" fill="#0f172a">Atomic Red Team &amp; CALDERA</text>
  <line x1="640" y1="166" x2="1140" y2="166" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="640" y="186" font-size="11.5" font-weight="500" fill="#475569">• Atomic Red Team: Granular YAML-defined TTP test payloads</text>
  <text x="640" y="206" font-size="11.5" font-weight="500" fill="#475569">• MITRE CALDERA: Automated multi-stage adversary emulation agent</text>
  <text x="640" y="226" font-size="11.5" font-weight="500" fill="#475569">• Prelude Operator: Continuous autonomous security validation agent</text>

  <!-- Empirical Coverage & Gap Map (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">EMPIRICAL COVERAGE MEASUREMENT &amp; GAP MAPS</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Theoretical Mapping vs Measured Telemetry Evidence</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="366" font-size="11.5" font-weight="500" fill="#475569">1. Select ATT&amp;CK Technique → 2. Execute Atomic Payload → 3. Check EDR / SIEM Ingestion</text>
  <text x="60" y="384" font-size="11.5" font-weight="500" fill="#475569">4. Verify Alert Trigger → 5. Measure Mean Time to Detect (MTTD) → 6. Update Empirical Coverage Heatmap</text>
  <text x="60" y="402" font-size="11.5" font-weight="500" fill="#475569">Goal: Transform unverified assumption maps into empirically proven defense posture.</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">VALIDATION LIFECYCLE: TTP SELECTION → AUTOMATED ATOMIC EXECUTION → SIEM ALERT VERIFICATION → COVERAGE SCORE UPDATE</text>
</svg>
