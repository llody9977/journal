<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Conceptual segmentation enforcement layers</title>
  <desc id="description">Internet traffic enters a public zone through an enforcement point. A second enforcement point permits a narrow flow to an application zone, workload policy restricts communication inside that zone, and another enforcement point permits a narrow database flow to a data zone. A separate management zone has a controlled administrative path. Telemetry receives decisions from all enforcement points.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
  </defs>

  <text x="45" y="52" font-size="28" font-weight="850" fill="#0f172a">Segmentation enforcement layers</text>
  <text x="45" y="80" font-size="14.5" fill="#475569">Topology groups assets; policy at each viable path creates isolation and evidence.</text>

  <rect x="45" y="135" width="190" height="190" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="70" y="169" font-size="12" font-weight="900" letter-spacing="1" fill="#475569">UNTRUSTED PATH</text>
  <text x="70" y="218" font-size="21" font-weight="800" fill="#0f172a">Internet</text>
  <text x="70" y="254" font-size="14" fill="#475569">Clients · partners</text>
  <text x="70" y="278" font-size="14" fill="#475569">untrusted networks</text>

  <rect x="285" y="120" width="235" height="220" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="310" y="154" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">PUBLIC ZONE</text>
  <text x="310" y="202" font-size="20" font-weight="800" fill="#0f172a">Edge proxy</text>
  <text x="310" y="235" font-size="14" fill="#475569">Only published listeners</text>
  <text x="310" y="258" font-size="14" fill="#475569">No direct data path</text>
  <rect x="322" y="287" width="160" height="30" rx="15" fill="#dbeafe"/>
  <text x="402" y="307" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">BOUNDARY POLICY</text>

  <rect x="570" y="105" width="280" height="250" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <text x="595" y="139" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">APPLICATION ZONE</text>
  <text x="595" y="184" font-size="18" font-weight="800" fill="#0f172a">Frontend → service</text>
  <text x="595" y="214" font-size="14" fill="#475569">Workload identity + port</text>
  <rect x="605" y="246" width="210" height="42" rx="14" fill="#ccfbf1"/>
  <text x="710" y="272" text-anchor="middle" font-size="12" font-weight="800" fill="#0f766e">WORKLOAD POLICY</text>
  <text x="595" y="325" font-size="13.5" fill="#475569">Denied peers remain unreachable</text>

  <rect x="915" y="120" width="255" height="220" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="940" y="154" font-size="12" font-weight="900" letter-spacing="1" fill="#c2410c">DATA ZONE</text>
  <text x="940" y="202" font-size="20" font-weight="800" fill="#0f172a">Database</text>
  <text x="940" y="235" font-size="14" fill="#475569">Only named application</text>
  <text x="940" y="258" font-size="14" fill="#475569">identity on database port</text>
  <rect x="955" y="287" width="175" height="30" rx="15" fill="#ffedd5"/>
  <text x="1042" y="307" text-anchor="middle" font-size="11" font-weight="800" fill="#9a3412">BOUNDARY POLICY</text>

  <path d="M243 230 L277 230" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M528 230 L562 230" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M858 230 L907 230" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="545" y="214" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">HTTPS</text>
  <text x="883" y="214" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">DB PORT</text>

  <rect x="215" y="400" width="300" height="78" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="240" y="431" font-size="12" font-weight="900" letter-spacing="1" fill="#7c3aed">MANAGEMENT ZONE</text>
  <text x="240" y="458" font-size="14" fill="#475569">Admin access only · no routine transit</text>

  <rect x="685" y="400" width="300" height="78" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="710" y="431" font-size="12" font-weight="900" letter-spacing="1" fill="#475569">TELEMETRY</text>
  <text x="710" y="458" font-size="14" fill="#475569">Rule decisions · denied paths · sensor health</text>

  <path d="M515 439 L677 439" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M710 363 L710 392" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
</svg>
