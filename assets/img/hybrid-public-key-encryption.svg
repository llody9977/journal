<svg viewBox="0 0 1200 585" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Hybrid encryption: asymmetric key transport, symmetric data encryption</title>
  <desc id="description">The sender encrypts bulk data with a random DEK and protects only that DEK with the recipient's public key.</desc>
  <rect width="1200" height="585" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Hybrid Encryption Architecture</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">The sender encrypts bulk data with a random DEK and protects only that DEK with the</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">recipient's public key.</text>
  <rect x="10" y="120" width="250" height="60" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="135" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Sender</text><path d="M135 180 V520" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="940" y="120" width="250" height="60" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="1065" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Recipient</text><path d="M1065 180 V520" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/><rect x="170" y="192" width="320" height="56" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="188" y="214" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">1. GENERATE RANDOM DEK</text><text x="188" y="235" text-anchor="start" font-size="12" font-weight="500" fill="#475569">AES-256 data key</text>
    <path d="M135 290 L1065 290" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="535.2" y="258" width="129.6" height="24" rx="12" fill="#ffffff"/><text x="600" y="275" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">2. SEND CIPHERTEXT</text><text x="600" y="314" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">Payload encrypted with the DEK</text>
    <path d="M135 360 L1065 360" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="524.4" y="328" width="151.20000000000002" height="24" rx="12" fill="#ffffff"/><text x="600" y="345" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">3. SEND ENCRYPTED DEK</text><text x="600" y="384" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">DEK protected with recipient public key</text><rect x="710" y="402" width="320" height="56" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="728" y="424" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">4. RECOVER DEK</text><text x="728" y="445" text-anchor="start" font-size="12" font-weight="500" fill="#475569">Recipient private key decrypts or unwraps the DEK</text><rect x="710" y="472" width="320" height="56" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="728" y="494" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">5. DECRYPT PAYLOAD</text><text x="728" y="515" text-anchor="start" font-size="12" font-weight="500" fill="#475569">Recovered DEK decrypts and authenticates the data</text><rect x="90" y="535" width="1020" height="46" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="564" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Asymmetric cryptography protects the small data key; symmetric cryptography handles the large payload efficiently.</text>
</svg>
