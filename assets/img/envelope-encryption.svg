<svg viewBox="0 0 1200 687" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Envelope encryption with a KMS</title>
  <desc id="description">The application encrypts data locally with a DEK and stores only the wrapped DEK beside the ciphertext.</desc>
  <rect width="1200" height="687" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Envelope encryption with a KMS</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">The application encrypts data locally with a DEK and stores only the wrapped DEK the</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">beside ciphertext.</text>
  <rect x="55" y="130" width="1090" height="115" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="85" y="172" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">1 · Generate DEK</text><text x="400" y="167" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Create a random symmetric data encryption key for the payload.</text><rect x="55" y="263" width="1090" height="115" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><text x="85" y="305" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">2 · Encrypt payload</text><text x="400" y="300" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Use the plaintext DEK with an AEAD cipher, then remove the plaintext DEK from memory.</text><rect x="55" y="396" width="1090" height="115" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="85" y="438" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">3 · Wrap DEK</text><text x="400" y="433" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">KMS protects the DEK under a KEK or customer-managed key without exposing that KEK.</text><rect x="55" y="529" width="1090" height="115" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/><text x="85" y="571" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">4 · Store envelope</text><text x="400" y="566" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Persist ciphertext, nonce, tag, metadata, and wrapped DEK together.</text>
</svg>
