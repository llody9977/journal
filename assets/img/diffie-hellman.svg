<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff" />

  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491a3" />
    </marker>
  </defs>

  <!-- Public parameter -->
  <rect x="290" y="20" width="180" height="34" rx="6" fill="#a14c00" />
  <text x="380" y="42" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Public: g, p (sent in the clear)</text>

  <path d="M370 54 L200 90" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah4)" />
  <path d="M390 54 L560 90" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah4)" />

  <!-- Alice / Bob column headers -->
  <text x="150" y="85" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Alice</text>
  <text x="610" y="85" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Bob</text>

  <!-- Secrets -->
  <rect x="80" y="95" width="140" height="34" rx="6" fill="#0f766e" />
  <text x="150" y="117" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">secret a (never sent)</text>

  <rect x="540" y="95" width="140" height="34" rx="6" fill="#9f1239" />
  <text x="610" y="117" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">secret b (never sent)</text>

  <path d="M150 129 L150 155" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah4)" />
  <path d="M610 129 L610 155" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah4)" />

  <!-- Sent values (two-tone) -->
  <rect x="80" y="160" width="70" height="34" rx="0" fill="#a14c00" />
  <rect x="150" y="160" width="70" height="34" rx="0" fill="#0f766e" />
  <rect x="80" y="160" width="140" height="34" rx="6" fill="none" stroke="#111827" stroke-width="1.5" />
  <text x="150" y="207" font-size="11.5" fill="#111827" text-anchor="middle">sends g^a mod p</text>

  <rect x="540" y="160" width="70" height="34" rx="0" fill="#a14c00" />
  <rect x="610" y="160" width="70" height="34" rx="0" fill="#9f1239" />
  <rect x="540" y="160" width="140" height="34" rx="6" fill="none" stroke="#111827" stroke-width="1.5" />
  <text x="610" y="207" font-size="11.5" fill="#111827" text-anchor="middle">sends g^b mod p</text>

  <!-- crossing arrows -->
  <path d="M225 177 L555 250" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah4)" />
  <path d="M535 177 L205 250" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah4)" />

  <!-- eavesdropper -->
  <circle cx="380" cy="215" r="24" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="380" y="211" font-size="10" font-weight="700" fill="#a14c00" text-anchor="middle">sees only</text>
  <text x="380" y="223" font-size="9" fill="#a14c00" text-anchor="middle">g, p, g^a, g^b</text>

  <!-- final shared secrets (three-tone) -->
  <rect x="80" y="270" width="47" height="34" fill="#a14c00" />
  <rect x="127" y="270" width="46" height="34" fill="#0f766e" />
  <rect x="173" y="270" width="47" height="34" fill="#9f1239" />
  <rect x="80" y="270" width="140" height="34" rx="6" fill="none" stroke="#111827" stroke-width="1.5" />
  <text x="150" y="320" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">(g^b)^a mod p</text>

  <rect x="540" y="270" width="47" height="34" fill="#a14c00" />
  <rect x="587" y="270" width="46" height="34" fill="#0f766e" />
  <rect x="633" y="270" width="47" height="34" fill="#9f1239" />
  <rect x="540" y="270" width="140" height="34" rx="6" fill="none" stroke="#111827" stroke-width="1.5" />
  <text x="610" y="320" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">(g^a)^b mod p</text>

  <text x="380" y="365" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Same result on both sides — the shared secret</text>
  <text x="380" y="387" font-size="12" fill="#475569" text-anchor="middle">Neither a, b, nor the shared secret itself ever crossed the network</text>
  <text x="380" y="408" font-size="11" fill="#8491a3" text-anchor="middle">(ECDH: same idea, points on an elliptic curve instead of modular exponentiation)</text>
</svg>
