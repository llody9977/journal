<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="dhk-title dhk-desc">
  <title id="dhk-title">Diffie-Hellman key agreement</title>
  <desc id="dhk-desc">Alice and Bob share public domain parameters, a prime modulus p and generator g, both known to eavesdroppers. Each generates an ephemeral private key in memory and computes a public share, g raised to that private key modulo p. They exchange only the public shares. Each then raises the peer's share to their own private key, and both arrive at the identical shared secret g to the power ab modulo p. The result is passed through a protocol KDF to derive traffic keys and IVs. An eavesdropper who sees both public shares cannot compute the secret without solving the discrete logarithm.</desc>
  <rect width="1200" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Diffie-Hellman Key Agreement Architecture</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Endpoints exchange public key shares over an insecure channel to independently compute the same shared secret S</text>

  <!-- Public Domain Parameters Header (y=110, h=45) -->
  <rect x="40" y="110" width="1120" height="45" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="138" font-size="13" font-weight="800" fill="#92400e" text-anchor="middle">PUBLIC DOMAIN PARAMETERS: Prime modulus p, Generator g (Known to all, including eavesdroppers)</text>

  <!-- Left: Party A (Alice) (x=40, y=170, w=490, h=280) -->
  <rect x="40" y="170" width="490" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="197" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">PARTY A (ALICE)</text>
  <text x="60" y="222" font-size="13" font-weight="800" fill="#0f172a">1. Generate Ephemeral Private Key: <tspan fill="#dc2626">a</tspan> (Secret RAM)</text>
  <text x="60" y="248" font-size="13" font-weight="800" fill="#0f172a">2. Compute Public Key Share: <tspan fill="#2563eb">A = g<tspan baseline-shift="super" font-size="70%">a</tspan> mod p</tspan></text>
  <text x="60" y="274" font-size="12.5" font-weight="700" fill="#2563eb">3. Transmit Public Key A to Party B --&gt;</text>
  
  <rect x="60" y="298" width="450" height="135" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="75" y="323" font-size="11" font-weight="900" fill="#1e40af">4. SHARED SECRET CALCULATION (ALICE)</text>
  <text x="75" y="348" font-size="13.5" font-weight="800" fill="#1e40af">S = B<tspan baseline-shift="super" font-size="70%">a</tspan> mod p = (g<tspan baseline-shift="super" font-size="70%">b</tspan>)<tspan baseline-shift="super" font-size="70%">a</tspan> mod p = g<tspan baseline-shift="super" font-size="70%">ab</tspan> mod p</text>
  <line x1="75" y1="360" x2="495" y2="360" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="382" font-size="12" font-weight="700" fill="#16a34a">Result: Shared Secret S derived in Alice's RAM</text>
  <text x="75" y="402" font-size="11" fill="#475569">Passed through a protocol KDF to derive traffic keys and IVs</text>

  <!-- Central Network Transmission Channel (x=530 to 670) -->
  <!-- Public Key A Arrow (Alice -> Bob) -->
  <path d="M 535 250 L 665 250" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="600" y="242" font-size="11.5" font-weight="800" fill="#2563eb" text-anchor="middle">Send Key A --&gt;</text>

  <!-- Public Key B Arrow (Bob -> Alice) -->
  <path d="M 665 274 L 535 274" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="600" y="292" font-size="11.5" font-weight="800" fill="#16a34a" text-anchor="middle">&lt;-- Send Key B</text>

  <!-- Right: Party B (Bob) (x=670, y=170, w=490, h=280) -->
  <rect x="670" y="170" width="490" height="280" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="197" font-size="11" font-weight="900" letter-spacing="1" fill="#16a34a">PARTY B (BOB)</text>
  <text x="690" y="222" font-size="13" font-weight="800" fill="#0f172a">1. Generate Ephemeral Private Key: <tspan fill="#dc2626">b</tspan> (Secret RAM)</text>
  <text x="690" y="248" font-size="13" font-weight="800" fill="#0f172a">2. Compute Public Key Share: <tspan fill="#16a34a">B = g<tspan baseline-shift="super" font-size="70%">b</tspan> mod p</tspan></text>
  <text x="690" y="274" font-size="12.5" font-weight="700" fill="#16a34a">3. Transmit Public Key B to Party A &lt;--</text>

  <rect x="690" y="298" width="450" height="135" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="705" y="323" font-size="11" font-weight="900" fill="#15803d">4. SHARED SECRET CALCULATION (BOB)</text>
  <text x="705" y="348" font-size="13.5" font-weight="800" fill="#15803d">S = A<tspan baseline-shift="super" font-size="70%">b</tspan> mod p = (g<tspan baseline-shift="super" font-size="70%">a</tspan>)<tspan baseline-shift="super" font-size="70%">b</tspan> mod p = g<tspan baseline-shift="super" font-size="70%">ab</tspan> mod p</text>
  <line x1="705" y1="360" x2="1125" y2="360" stroke="#bbf7d0" stroke-width="1"/>
  <text x="705" y="382" font-size="12" font-weight="700" fill="#16a34a">Result: Identical Shared Secret S derived in Bob's RAM!</text>
  <text x="705" y="402" font-size="11" fill="#475569">Eavesdropper seeing A and B cannot compute S without discrete log</text>
</svg>
