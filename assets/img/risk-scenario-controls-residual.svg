<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>

  <defs>
    <marker id="risk-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="risk-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="50" y="53" font-size="29" font-weight="800" fill="#0f172a">From threat source to residual risk</text>
  <text x="50" y="85" font-size="16" fill="#475569">Assess the whole scenario, change it with a risk response, then reassess what remains.</text>

  <!-- Threat scenario -->
  <g>
    <rect x="35" y="120" width="1130" height="330" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="65" y="103" width="230" height="36" rx="18" fill="#e2e8f0"/>
    <text x="180" y="127" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="0.8" fill="#475569">MODEL ONE SCENARIO</text>

    <g>
      <rect x="55" y="170" width="235" height="210" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
      <rect x="55" y="170" width="235" height="52" rx="20" fill="#dc2626"/>
      <path d="M55 199 H290 V222 H55Z" fill="#dc2626"/>
      <text x="172" y="205" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">THREAT SOURCE</text>
      <circle cx="172" cy="266" r="27" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="172" cy="258" r="9" fill="#dc2626"/>
      <path d="M156 283 Q172 266 188 283" fill="#dc2626"/>
      <text x="172" y="318" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">actor · accident · condition</text>
      <text x="172" y="346" text-anchor="middle" font-size="13.5" fill="#475569">origin of possible harm</text>
    </g>

    <g>
      <rect x="340" y="170" width="235" height="210" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
      <rect x="340" y="170" width="235" height="52" rx="20" fill="#c2410c"/>
      <path d="M340 199 H575 V222 H340Z" fill="#c2410c"/>
      <text x="457" y="205" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">THREAT EVENT</text>
      <path d="M457 237 L496 305 H418Z" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
      <path d="M457 257 V282 M457 293 V295" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/>
      <text x="457" y="329" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">specific action or event</text>
      <text x="457" y="354" text-anchor="middle" font-size="13.5" fill="#475569">phishing · ransomware · outage</text>
    </g>

    <g>
      <rect x="625" y="170" width="235" height="210" rx="20" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
      <rect x="625" y="170" width="235" height="52" rx="20" fill="#d97706"/>
      <path d="M625 199 H860 V222 H625Z" fill="#d97706"/>
      <text x="742" y="205" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">VULNERABILITY</text>
      <path d="M742 239 L779 254 V286 Q779 317 742 332 Q705 317 705 286 V254Z" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
      <path d="M723 286 L761 260 M724 261 L760 287" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
      <text x="742" y="354" text-anchor="middle" font-size="13.5" fill="#475569">weakness or predisposing condition</text>
    </g>

    <g>
      <rect x="910" y="170" width="235" height="210" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <rect x="910" y="170" width="235" height="52" rx="20" fill="#0f766e"/>
      <path d="M910 199 H1145 V222 H910Z" fill="#0f766e"/>
      <text x="1027" y="205" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">ASSET + IMPACT</text>
      <path d="M1027 239 Q1064 267 1027 326 Q990 267 1027 239Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
      <path d="M1010 283 L1022 295 L1044 270" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1027" y="348" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">harm to something valuable</text>
      <text x="1027" y="370" text-anchor="middle" font-size="13.5" fill="#475569">people · data · service · trust</text>
    </g>

    <path d="M290 275 H328" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#risk-arrow)"/>
    <rect x="282" y="233" width="54" height="30" rx="15" fill="#ffffff"/>
    <text x="309" y="253" text-anchor="middle" font-size="11.5" font-weight="900" fill="#475569">INITIATES</text>

    <path d="M575 275 H613" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#risk-arrow)"/>
    <rect x="566" y="225" width="58" height="38" rx="15" fill="#ffffff"/>
    <text x="595" y="242" text-anchor="middle" font-size="10.5" font-weight="900" fill="#475569">EXPLOITS</text>
    <text x="595" y="257" text-anchor="middle" font-size="10.5" font-weight="900" fill="#475569">OR TRIGGERS</text>

    <path d="M860 275 H898" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#risk-arrow)"/>
    <rect x="852" y="233" width="54" height="30" rx="15" fill="#ffffff"/>
    <text x="879" y="253" text-anchor="middle" font-size="11.5" font-weight="900" fill="#475569">CAUSES</text>
  </g>

  <!-- Controls act across the scenario -->
  <path d="M172 415 V438 H1027 V415 M457 415 V438 M742 415 V438" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <rect x="435" y="422" width="330" height="34" rx="17" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="444" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1d4ed8">CONTROLS CAN ACT AT MULTIPLE POINTS</text>

  <!-- Assessment and response loop -->
  <g>
    <rect x="65" y="520" width="310" height="220" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="95" y="559" font-size="19" font-weight="900" fill="#1d4ed8">ASSESS THE SCENARIO</text>
    <text x="95" y="598" font-size="14.5" fill="#475569">How likely is the event and harm?</text>
    <text x="95" y="629" font-size="14.5" fill="#475569">How serious would the impact be?</text>
    <text x="95" y="660" font-size="14.5" fill="#475569">Which controls already operate?</text>
    <text x="95" y="691" font-size="14.5" fill="#475569">What evidence and uncertainty remain?</text>
    <rect x="95" y="706" width="250" height="1" fill="#93c5fd"/>
    <text x="220" y="729" text-anchor="middle" font-size="12.5" font-weight="900" fill="#1d4ed8">LIKELIHOOD · IMPACT · CONTEXT</text>
  </g>

  <g>
    <rect x="445" y="520" width="310" height="220" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="475" y="559" font-size="19" font-weight="900" fill="#15803d">RESPOND + CONTROL</text>
    <text x="475" y="598" font-size="14.5" fill="#475569">avoid or redesign the activity</text>
    <text x="475" y="629" font-size="14.5" fill="#475569">prevent or reduce likelihood</text>
    <text x="475" y="660" font-size="14.5" fill="#475569">detect, contain, and limit impact</text>
    <text x="475" y="691" font-size="14.5" fill="#475569">recover trustworthy operations</text>
    <rect x="475" y="706" width="250" height="1" fill="#86efac"/>
    <text x="600" y="729" text-anchor="middle" font-size="12.5" font-weight="900" fill="#15803d">CHANGE THE SCENARIO</text>
  </g>

  <g>
    <rect x="825" y="520" width="310" height="220" rx="22" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="855" y="559" font-size="19" font-weight="900" fill="#6d28d9">RESIDUAL RISK</text>
    <text x="855" y="598" font-size="14.5" fill="#475569">reassess likelihood and impact</text>
    <text x="855" y="629" font-size="14.5" fill="#475569">record what remains after response</text>
    <text x="855" y="660" font-size="14.5" fill="#475569">name the authorized decision owner</text>
    <text x="855" y="691" font-size="14.5" fill="#475569">set monitoring and review triggers</text>
    <rect x="855" y="706" width="250" height="1" fill="#c4b5fd"/>
    <text x="980" y="729" text-anchor="middle" font-size="12.5" font-weight="900" fill="#6d28d9">WHAT REMAINS AFTER RESPONSE</text>
  </g>

  <path d="M375 630 H433" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#risk-arrow)"/>
  <rect x="372" y="584" width="66" height="33" rx="16" fill="#ffffff"/>
  <text x="405" y="606" text-anchor="middle" font-size="11.5" font-weight="900" fill="#475569">SELECT</text>

  <path d="M755 630 H813" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#risk-arrow)"/>
  <rect x="750" y="584" width="70" height="33" rx="16" fill="#ffffff"/>
  <text x="785" y="606" text-anchor="middle" font-size="11.5" font-weight="900" fill="#475569">REASSESS</text>

  <path d="M600 500 V470" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#risk-blue-arrow)"/>

  <g>
    <rect x="65" y="785" width="1070" height="43" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="812" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">A vulnerability alone is not the risk. The scenario, evidence, controls, and uncertainty determine the decision.</text>
  </g>
</svg>
