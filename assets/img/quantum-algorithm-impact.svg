<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Quantum impact on current cryptography</title>
  <desc id="description">Shor and Grover affect different cryptographic assumptions.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Quantum impact on current cryptography</text>
  <text x="50" y="88" font-size="15" fill="#475569">Shor and Grover affect different cryptographic assumptions.</text>
  
    <g>
      <rect x="50" y="135" width="535" height="275" rx="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
      <text x="75" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#b91c1c">SHOR'S ALGORITHM</text>
      <text x="75" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Breaks public-key math</text>
      <text x="75" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">RSA factoring</text>
<text x="75" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">elliptic-curve discrete logs</text>
<text x="75" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">ECDH and ECDSA</text>
<text x="75" y="309" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Ed25519 signatures</text>
    </g>

    <g>
      <rect x="615" y="135" width="535" height="275" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="640" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">GROVER'S ALGORITHM</text>
      <text x="640" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Reduces brute-force margin</text>
      <text x="640" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">quadratic search speedup</text>
<text x="640" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">roughly halves key bits</text>
<text x="640" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">AES-256 retains about</text>
<text x="640" y="309" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">128-bit security margin</text>
    </g><rect x="50" y="430" width="1100" height="55" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Post-quantum migration replaces vulnerable public-key algorithms; strong symmetric key sizes remain useful.</text>
</svg>
