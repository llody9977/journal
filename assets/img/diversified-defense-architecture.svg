<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Multi-Dimensional Diversified Defense Architecture</title>
  <desc id="description">Architecture mapping Security Control Domains (Technical, Physical, Administrative), Mitigation Functions (Preventive, Detective, Corrective), and Failure Mode Isolation vs Duplicate Signature Anti-Patterns.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Multi-Dimensional Diversified Defense Architecture</text>
  <text x="50" y="88" font-size="16" fill="#475569">Architecture mapping Security Control Domains (Technical, Physical, Administrative), Mitigation Functions (Preventive, Detective, Corrective), and Failure Mode Isolation vs Duplicate Signature Anti-Patterns.</text>
  
    <!-- Top Stage: Control Domains (y=115, h=135) -->
    <!-- Card 1: Technical Domain (x=40, w=355) -->
    <rect x="40" y="115" width="355" height="135" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
    <text x="60" y="140" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">1. TECHNICAL (LOGICAL) CONTROLS</text>
    <text x="60" y="162" font-size="14" font-weight="800" fill="#0f172a">Automated Hardware &amp; Software Rules</text>
    <line x1="60" y1="174" x2="375" y2="174" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
    <text x="60" y="194" font-size="10.5" font-weight="500" fill="#475569">• mTLS Ingress, WAF Parameterization, FIDO2 Passkeys</text>
    <text x="60" y="212" font-size="10.5" font-weight="500" fill="#475569">• OPA/Rego Policy Engine &amp; AES-256 Envelope Encryption</text>

    <!-- Card 2: Physical Domain (x=422, w=355) -->
    <rect x="422" y="115" width="355" height="135" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
    <text x="442" y="140" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">2. PHYSICAL (ENVIRONMENTAL) CONTROLS</text>
    <text x="442" y="162" font-size="14" font-weight="800" fill="#0f172a">Facility &amp; Tangible Asset Protections</text>
    <line x1="442" y1="174" x2="757" y2="174" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
    <text x="442" y="194" font-size="10.5" font-weight="500" fill="#475569">• Biometric Data Center Locks, HSM Tamper Seals</text>
    <text x="442" y="212" font-size="10.5" font-weight="500" fill="#475569">• Faraday Enclosures, CCTV &amp; Mantrap Access Gates</text>

    <!-- Card 3: Administrative Domain (x=805, w=355) -->
    <rect x="805" y="115" width="355" height="135" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5" />
    <text x="825" y="140" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">3. ADMINISTRATIVE (GOVERNANCE) CONTROLS</text>
    <text x="825" y="162" font-size="14" font-weight="800" fill="#0f172a">Policies, Training &amp; Operations</text>
    <line x1="825" y1="174" x2="1140" y2="174" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
    <text x="825" y="194" font-size="10.5" font-weight="500" fill="#475569">• SCIM 2.0 Joiner-Mover-Leaver (JML) Workflows</text>
    <text x="825" y="212" font-size="10.5" font-weight="500" fill="#475569">• Separation of Duties (SoD) &amp; Incident Playbooks</text>

    <!-- Middle Stage: Mitigation Functions (y=265, h=145) -->
    <!-- Card 1: Preventive (x=40, w=355) -->
    <rect x="40" y="265" width="355" height="145" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" />
    <text x="60" y="290" font-size="11" font-weight="900" letter-spacing="1" fill="#7c3aed">4. PREVENTIVE MITIGATION GATES</text>
    <text x="60" y="312" font-size="14" font-weight="800" fill="#0f172a">Intercepts Threat Prior to Execution</text>
    <line x1="60" y1="324" x2="375" y2="324" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" />
    <text x="60" y="344" font-size="10.5" font-weight="500" fill="#475569">• Default-Deny Firewalls, Parameterized SQL Queries</text>
    <text x="60" y="362" font-size="10.5" font-weight="500" fill="#475569">• WebAuthn Origin Binding &amp; SAST Gate Checks</text>
    <text x="60" y="380" font-size="10.5" font-weight="500" fill="#475569">• Neutralizes attack vectors before state changes</text>

    <!-- Card 2: Detective (x=422, w=355) -->
    <rect x="422" y="265" width="355" height="145" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />
    <text x="442" y="290" font-size="11" font-weight="900" letter-spacing="1" fill="#0f172a">5. DETECTIVE MONITORING GATES</text>
    <text x="442" y="312" font-size="14" font-weight="800" fill="#0f172a">Identifies Anomaly &amp; Active Breach</text>
    <line x1="442" y1="324" x2="757" y2="324" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1" />
    <text x="442" y="344" font-size="10.5" font-weight="500" fill="#475569">• SIEM Structured Logging &amp; Immutable Audit Hashes</text>
    <text x="442" y="362" font-size="10.5" font-weight="500" fill="#475569">• eBPF Runtime Tracing &amp; Anomaly Detection</text>
    <text x="442" y="380" font-size="10.5" font-weight="500" fill="#475569">• Triggers immediate alert telemetry &amp; SOAR</text>

    <!-- Card 3: Corrective / Recovery (x=805, w=355) -->
    <rect x="805" y="265" width="355" height="145" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5" />
    <text x="825" y="290" font-size="11" font-weight="900" letter-spacing="1" fill="#15803d">6. CORRECTIVE &amp; RECOVERY GATES</text>
    <text x="825" y="312" font-size="14" font-weight="800" fill="#0f172a">Restores Integrity &amp; Limits Impact</text>
    <line x1="825" y1="324" x2="1140" y2="324" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="825" y="344" font-size="10.5" font-weight="500" fill="#475569">• Automated OAuth Token Revocation (RFC 7009)</text>
    <text x="825" y="362" font-size="10.5" font-weight="500" fill="#475569">• Immutable Backup Restores &amp; DR Cluster Failover</text>
    <text x="825" y="380" font-size="10.5" font-weight="500" fill="#475569">• Isolates compromised pods &amp; rotates keys</text>

    <!-- Bottom Stage: Defense-in-Depth vs Duplicate Controls (y=425, h=55) -->
    <!-- Left Box: True Defense-in-Depth (x=40, w=545) -->
    <rect x="40" y="425" width="545" height="55" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
    <text x="60" y="445" font-size="10.5" font-weight="900" letter-spacing="1" fill="#15803d">TRUE DEFENSE IN DEPTH (ORTHOGONAL CONTROLS)</text>
    <text x="60" y="463" font-size="10.5" font-weight="600" fill="#475569">• Independent failure modes (mTLS + WAF + SAST + Envelope Encryption)</text>

    <!-- Right Box: Duplicate Control Anti-Pattern (x=615, w=545) -->
    <rect x="615" y="425" width="545" height="55" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" />
    <text x="635" y="445" font-size="10.5" font-weight="900" letter-spacing="1" fill="#b91c1c">DUPLICATE CONTROL ANTI-PATTERN (COMMON FAILURE MODE)</text>
    <text x="635" y="463" font-size="10.5" font-weight="600" fill="#475569">• Redundant signatures over same hop (Edge IPS + Endpoint AV signature overlap)</text>
</svg>
