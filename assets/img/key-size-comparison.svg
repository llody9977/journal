<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="340" fill="#ffffff" />

  <text x="350" y="25" font-size="13" fill="#475569" text-anchor="middle" font-family="ui-monospace,monospace">KEY SIZE NEEDED FOR EQUIVALENT SECURITY STRENGTH</text>

  <!-- baseline -->
  <line x1="80" y1="290" x2="650" y2="290" stroke="#8491a3" stroke-width="1.5" />

  <!-- Group 1: ~112-bit security -->
  <text x="160" y="312" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">~112-bit security</text>
  <rect x="120" y="270" width="40" height="20" fill="#2457d6" />
  <text x="140" y="264" font-size="11" fill="#111827" text-anchor="middle">RSA-2048</text>
  <rect x="180" y="284" width="40" height="6" fill="#0f766e" />
  <text x="200" y="278" font-size="11" fill="#111827" text-anchor="middle">ECC-224</text>

  <!-- Group 2: ~128-bit security -->
  <text x="350" y="312" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">~128-bit security</text>
  <rect x="310" y="180" width="40" height="110" fill="#2457d6" />
  <text x="330" y="174" font-size="11" fill="#111827" text-anchor="middle">RSA-3072</text>
  <rect x="370" y="283" width="40" height="7" fill="#0f766e" />
  <text x="390" y="277" font-size="11" fill="#111827" text-anchor="middle">ECC-256</text>

  <!-- Group 3: ~192-bit security -->
  <text x="540" y="312" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">~192-bit security</text>
  <rect x="500" y="40" width="40" height="250" fill="#2457d6" />
  <text x="520" y="34" font-size="11" fill="#111827" text-anchor="middle">RSA-7680</text>
  <rect x="560" y="281" width="40" height="9" fill="#0f766e" />
  <text x="580" y="275" font-size="11" fill="#111827" text-anchor="middle">ECC-384</text>

  <!-- legend -->
  <rect x="220" y="325" width="14" height="10" fill="#2457d6" />
  <text x="238" y="334" font-size="11" fill="#111827" text-anchor="start">RSA</text>
  <rect x="280" y="325" width="14" height="10" fill="#0f766e" />
  <text x="298" y="334" font-size="11" fill="#111827" text-anchor="start">ECC (ECDSA/ECDH)</text>
</svg>
