<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="ksc-title ksc-desc">
  <title id="ksc-title">Asymmetric key size growth versus symmetric security strength</title>
  <desc id="ksc-desc">Required RSA and ECC key lengths at four NIST security strength levels. At 112-bit strength, RSA needs 2,048 bits against ECC's 224 bits. At 128-bit strength, RSA needs 3,072 bits against ECC's 256 bits. At 192-bit strength, RSA needs 7,680 bits against ECC's 384 bits. At 256-bit strength, RSA needs 15,360 bits against ECC's 521 bits. RSA key size grows sub-exponentially with the target strength while ECC scales compactly.</desc>
  <rect width="1200" height="440" fill="#ffffff"/>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Asymmetric Key Size Growth vs Symmetric Security Strength</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">NIST Security Strength levels: RSA key sizes scale sub-exponentially compared to ECC linear efficiency</text>

  <rect x="40" y="110" width="1120" height="310" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />

  <!-- Bar Chart Columns -->
  <!-- Header Row -->
  <text x="160" y="140" font-size="12" font-weight="900" fill="#475569" text-anchor="middle">Symmetric Security Strength</text>
  <text x="450" y="140" font-size="12" font-weight="900" fill="#dc2626" text-anchor="middle">RSA Key Length (Bits) -- Sub-Exponential Growth</text>
  <text x="900" y="140" font-size="12" font-weight="900" fill="#16a34a" text-anchor="middle">ECC Key Length (Bits) -- Linear Efficiency</text>

  <!-- Level 1: 112 Bits -->
  <rect x="80" y="155" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="180" font-size="12.5" font-weight="800" fill="#334155" text-anchor="middle">112 Bits (Legacy)</text>
  
  <rect x="280" y="155" width="340" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="450" y="180" font-size="12.5" font-weight="800" fill="#991b1b" text-anchor="middle">RSA 2048 Bits</text>

  <rect x="680" y="155" width="440" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="900" y="180" font-size="12.5" font-weight="800" fill="#166534" text-anchor="middle">ECC 224 Bits (P-224)</text>

  <!-- Level 2: 128 Bits -->
  <rect x="80" y="205" width="160" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="160" y="230" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">128 Bits (Standard)</text>

  <rect x="280" y="205" width="340" height="40" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="450" y="230" font-size="12.5" font-weight="800" fill="#991b1b" text-anchor="middle">RSA 3072 Bits</text>

  <rect x="680" y="205" width="440" height="40" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="900" y="230" font-size="12.5" font-weight="800" fill="#166534" text-anchor="middle">ECC 256 Bits (P-256 / Ed25519)</text>

  <!-- Level 3: 192 Bits -->
  <rect x="80" y="255" width="160" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="160" y="280" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">192 Bits (High)</text>

  <rect x="280" y="255" width="340" height="40" rx="6" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="280" font-size="12.5" font-weight="800" fill="#7f1d1d" text-anchor="middle">RSA 7680 Bits (Impractical)</text>

  <rect x="680" y="255" width="440" height="40" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="900" y="280" font-size="12.5" font-weight="800" fill="#14532d" text-anchor="middle">ECC 384 Bits (P-384)</text>

  <!-- Level 4: 256 Bits -->
  <rect x="80" y="305" width="160" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="160" y="330" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">256 Bits (Max)</text>

  <rect x="280" y="305" width="340" height="40" rx="6" fill="#f87171" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="330" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">RSA 15360 Bits (Extreme CPU Overhead)</text>

  <rect x="680" y="305" width="440" height="40" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="900" y="330" font-size="12.5" font-weight="800" fill="#14532d" text-anchor="middle">ECC 521 Bits (P-521)</text>

  <!-- Summary Footer -->
  <rect x="60" y="365" width="1080" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="391" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Summary: To match symmetric security levels, RSA key sizes grow sub-exponentially (up to 15,360 bits), whereas ECC scales compactly (up to 521 bits).</text>
</svg>
