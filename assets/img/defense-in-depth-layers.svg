<svg viewBox="0 0 1200 1145" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Defense in depth across one payment path</title>
  <desc id="description">Each layer limits a different failure so one bypass does not immediately become a fraudulent transfer.</desc>
  <rect width="1200" height="1145" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Defense in depth across one payment path</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Each layer limits a different failure so one bypass does not immediately become a</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">fraudulent transfer.</text>
  
    <g>
      <rect x="80" y="130" width="1040" height="125" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="105" y="161" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">LAYER 1</text>
      <text x="105" y="195" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Phishing-resistant MFA</text>
      <text x="105" y="235" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Blocks password-only account takeover.</text>
    </g>

    <g>
      <rect x="80" y="299" width="1040" height="125" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="105" y="330" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">LAYER 2</text>
      <text x="105" y="364" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Sender-constrained short-lived session</text>
      <text x="105" y="404" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Limits the replay value of a stolen token.</text>
    </g>

    <g>
      <rect x="80" y="468" width="1040" height="125" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="105" y="499" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">LAYER 3</text>
      <text x="105" y="533" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Least-privilege authorization</text>
      <text x="105" y="573" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Restricts which tenant and actions the identity can reach.</text>
    </g>

    <g>
      <rect x="80" y="637" width="1040" height="125" rx="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
      <text x="105" y="668" font-size="12" font-weight="900" letter-spacing="1" fill="#7c3aed">LAYER 4</text>
      <text x="105" y="702" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Dual approval</text>
      <text x="105" y="742" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Requires an independent approver for high-risk payments.</text>
    </g>

    <g>
      <rect x="80" y="806" width="1040" height="125" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
      <text x="105" y="837" font-size="12" font-weight="900" letter-spacing="1" fill="#15803d">LAYER 5</text>
      <text x="105" y="871" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Anomaly detection and response</text>
      <text x="105" y="911" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Detects unusual behavior and can contain the account.</text>
    </g>

    <g>
      <rect x="80" y="975" width="1040" height="125" rx="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
      <text x="105" y="1006" font-size="12" font-weight="900" letter-spacing="1" fill="#b91c1c">LAYER 6</text>
      <text x="105" y="1040" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Tamper-resistant audit evidence</text>
      <text x="105" y="1080" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Supports investigation, recovery, and accountability.</text>
    </g>
    <path d="M600 262 L600 292" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="245" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="262" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">IF BYPASSED</text>
    <path d="M600 431 L600 461" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="414" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="431" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">IF BYPASSED</text>
    <path d="M600 600 L600 630" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="583" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="600" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">IF BYPASSED</text>
    <path d="M600 769 L600 799" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="752" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="769" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">IF BYPASSED</text>
    <path d="M600 938 L600 968" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="921" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="938" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">IF BYPASSED</text>
</svg>
