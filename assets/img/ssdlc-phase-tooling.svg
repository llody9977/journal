<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="phase-title phase-desc">
  <title id="phase-title">Where each security control attaches in a delivery pipeline</title>
  <desc id="phase-desc">A five-stage pipeline running left to right — requirements, design, code and commit, build and test, and deploy and operate — with the security activity and tooling attached at each stage: security requirements and data classification; threat modeling against trust boundaries; IDE linters, secret scanning and pull-request static analysis; composition analysis, dynamic scanning, interactive analysis and fuzzing; then runtime protection, penetration testing and vulnerability disclosure. Each stage is tagged with the NIST SSDF practice group it serves, and a footer states that the phase view is a journal working model rather than the SSDF's own four-group structure.</desc>
  <rect width="1200" height="470" fill="#ffffff"/>

  <defs>
    <marker id="phaseArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="50" y="46" font-size="26" font-weight="850" fill="#0f172a">Where the control attaches, stage by stage</text>
  <text x="50" y="72" font-size="14" fill="#475569">Cost of remediation rises left to right. Each stage is tagged with the SSDF practice group it serves.</text>

  <rect x="40" y="98" width="216" height="252" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="122" font-size="11.5" font-weight="900" letter-spacing="1" fill="#2563eb">1 — REQUIREMENTS</text>
  <rect x="58" y="132" width="42" height="19" rx="5" fill="#2563eb"/>
  <text x="79" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">PO</text>
  <text x="58" y="176" font-size="12" fill="#475569">Security and privacy</text>
  <text x="58" y="195" font-size="12" fill="#475569">requirements written</text>
  <text x="58" y="214" font-size="12" fill="#475569">beside functional ones</text>
  <text x="58" y="240" font-size="12" fill="#475569">Data classification</text>
  <text x="58" y="259" font-size="12" fill="#475569">Regulatory obligations</text>
  <text x="58" y="278" font-size="12" fill="#475569">Abuse cases</text>
  <text x="58" y="320" font-size="12" font-weight="700" fill="#0f766e">Cheapest to change</text>

  <rect x="278" y="98" width="216" height="252" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="296" y="122" font-size="11.5" font-weight="900" letter-spacing="1" fill="#2563eb">2 — DESIGN</text>
  <rect x="296" y="132" width="42" height="19" rx="5" fill="#2563eb"/>
  <text x="317" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">PW</text>
  <text x="296" y="176" font-size="12" fill="#475569">Threat modeling against</text>
  <text x="296" y="195" font-size="12" fill="#475569">trust boundaries</text>
  <text x="296" y="214" font-size="12" fill="#475569">Architecture review</text>
  <text x="296" y="240" font-size="12" font-weight="700" fill="#9f1239">A design flaw is not</text>
  <text x="296" y="259" font-size="12" font-weight="700" fill="#9f1239">something a scanner</text>
  <text x="296" y="278" font-size="12" font-weight="700" fill="#9f1239">will ever find.</text>

  <rect x="516" y="98" width="216" height="252" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="534" y="122" font-size="11.5" font-weight="900" letter-spacing="1" fill="#0f766e">3 — CODE / COMMIT</text>
  <rect x="534" y="132" width="42" height="19" rx="5" fill="#0f766e"/>
  <text x="555" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">PW</text>
  <text x="534" y="176" font-size="12" fill="#475569">IDE security linters</text>
  <text x="534" y="195" font-size="12" fill="#475569">Pre-commit secret scan</text>
  <text x="534" y="214" font-size="12" fill="#475569">SAST on the pull request</text>
  <text x="534" y="233" font-size="12" fill="#475569">Human review on auth,</text>
  <text x="534" y="252" font-size="12" fill="#475569">crypto, and authz changes</text>
  <text x="534" y="292" font-size="12" font-weight="700" fill="#0f172a">Diff-aware gates keep</text>
  <text x="534" y="311" font-size="12" font-weight="700" fill="#0f172a">the signal usable</text>

  <rect x="754" y="98" width="216" height="252" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="772" y="122" font-size="11.5" font-weight="900" letter-spacing="1" fill="#0f766e">4 — BUILD / TEST</text>
  <rect x="772" y="132" width="70" height="19" rx="5" fill="#0f766e"/>
  <text x="807" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">PW + PS</text>
  <text x="772" y="176" font-size="12" fill="#475569">SCA and reachability</text>
  <text x="772" y="195" font-size="12" fill="#475569">DAST on staging</text>
  <text x="772" y="214" font-size="12" fill="#475569">IAST during functional</text>
  <text x="772" y="233" font-size="12" fill="#475569">tests</text>
  <text x="772" y="252" font-size="12" fill="#475569">Fuzzing for parsers</text>
  <text x="772" y="271" font-size="12" fill="#475569">Artifact signing and</text>
  <text x="772" y="290" font-size="12" fill="#475569">build provenance</text>

  <rect x="992" y="98" width="168" height="252" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1010" y="122" font-size="11.5" font-weight="900" letter-spacing="1" fill="#b45309">5 — OPERATE</text>
  <rect x="1010" y="132" width="42" height="19" rx="5" fill="#b45309"/>
  <text x="1031" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">RV</text>
  <text x="1010" y="176" font-size="12" fill="#475569">RASP where the</text>
  <text x="1010" y="195" font-size="12" fill="#475569">overhead is earned</text>
  <text x="1010" y="214" font-size="12" fill="#475569">Penetration testing</text>
  <text x="1010" y="233" font-size="12" fill="#475569">Disclosure policy</text>
  <text x="1010" y="252" font-size="12" fill="#475569">Triage into the</text>
  <text x="1010" y="271" font-size="12" fill="#475569">normal backlog</text>
  <text x="1010" y="311" font-size="12" font-weight="700" fill="#9f1239">Most expensive</text>

  <path d="M260 224 L274 224" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#phaseArrow)"/>
  <path d="M498 224 L512 224" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#phaseArrow)"/>
  <path d="M736 224 L750 224" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#phaseArrow)"/>
  <path d="M974 224 L988 224" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#phaseArrow)"/>

  <rect x="40" y="366" width="1120" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="390" font-size="12.5" font-weight="700" fill="#9f1239">This five-stage view is a journal working model, not the SSDF's structure. NIST SP 800-218 defines four practice groups precisely so it</text>
  <text x="62" y="410" font-size="12.5" font-weight="700" fill="#9f1239">applies to any development methodology, including ones with no phase sequence at all.</text>
  <text x="62" y="436" font-size="12.5" fill="#475569">Findings from stage 5 feed back into stages 1 and 2. Recurrence of the same class is a control gap (SSDF RV.3), not a run of bad luck.</text>
</svg>
