<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Digital Signature Execution Pipeline</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">RSA-PSS / ECDSA external-hash-then-sign pattern shown below; EdDSA (Ed25519/Ed448) hashes internally as one integrated step, not a separate pre-hash stage</text>

  <!-- Outer Panel Container (1120px wide, equal 50px margins inside) -->
  <rect x="40" y="110" width="1120" height="200" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />

  <!-- Stage 1 (300px wide, x=90 to 390) -->
  <rect x="90" y="130" width="300" height="160" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="152" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">STAGE 1: PAYLOAD HASHING</text>
  <text x="105" y="174" font-size="13" font-weight="800" fill="#0f172a">Message M --&gt; H(M)</text>
  <line x1="105" y1="184" x2="375" y2="184" stroke="#bfdbfe" stroke-width="1"/>
  <text x="105" y="202" font-size="11" fill="#475569">• Compute SHA-256 / SHA-512 digest</text>
  <text x="105" y="220" font-size="11" fill="#475569">• Ed25519 hash internally (RFC 8032)</text>
  <rect x="105" y="236" width="270" height="34" rx="6" fill="#eff6ff"/>
  <text x="240" y="258" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Fixed-Size Digest H(M)</text>

  <!-- Connector 1 -> 2 (60px gap, x=390 to 450) -->
  <path d="M 395 210 L 445 210" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Stage 2 (300px wide, x=450 to 750) -->
  <rect x="450" y="130" width="300" height="160" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="465" y="152" font-size="11" font-weight="900" letter-spacing="1" fill="#7c3aed">STAGE 2: PRIVATE KEY SIGNING</text>
  <text x="465" y="174" font-size="13" font-weight="800" fill="#0f172a">Sign H(M) with K<sub>priv</sub></text>
  <line x1="465" y1="184" x2="735" y2="184" stroke="#ddd6fe" stroke-width="1"/>
  <text x="465" y="202" font-size="10.5" fill="#475569">• ECDSA nonce: fresh random or RFC 6979 deterministic</text>
  <text x="465" y="220" font-size="11" fill="#475569">• EdDSA internal SHA-512/SHAKE256</text>
  <rect x="465" y="236" width="270" height="34" rx="6" fill="#f5f3ff"/>
  <text x="600" y="258" font-size="11.5" font-weight="800" fill="#5b21b6" text-anchor="middle">Signature S = Sign(K<sub>priv</sub>, H(M))</text>

  <!-- Connector 2 -> 3 (60px gap, x=750 to 810) -->
  <path d="M 755 210 L 805 210" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Stage 3 (300px wide, x=810 to 1110) -->
  <rect x="810" y="130" width="300" height="160" rx="10" fill="#15803d"/>
  <text x="960" y="152" font-size="11" font-weight="900" letter-spacing="1" fill="#bbf7d0" text-anchor="middle">STAGE 3: VERIFICATION</text>
  <text x="960" y="174" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">Verify(K<sub>pub</sub>, H(M'), S)</text>
  <line x1="830" y1="184" x2="1090" y2="184" stroke="#86efac" stroke-width="1"/>
  <text x="960" y="202" font-size="11" fill="#bbf7d0" text-anchor="middle">Verifier computes H(M')</text>
  <text x="960" y="220" font-size="11" fill="#bbf7d0" text-anchor="middle">Validates signature tag S</text>
  <rect x="830" y="236" width="260" height="36" rx="6" fill="#ffffff"/>
  <text x="960" y="252" font-size="11" font-weight="900" fill="#15803d" text-anchor="middle">VALID: PASS</text>
  <text x="960" y="264" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Key Control &amp; Integrity Proven</text>
  <text x="960" y="282" font-size="8.5" font-weight="600" fill="#bbf7d0" text-anchor="middle">Identity still requires a trusted key-to-signer binding (PKI)</text>
</svg>
