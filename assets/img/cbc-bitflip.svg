<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">CBC Bit-Flipping Malleability Attack Mechanics</title>
  <desc id="description">Modifying byte k in Ciphertext C₁ scrambles P₁ into noise, but flips target bit k in P₂ ('isadmin=0' → 'isadmin=1')</desc>
  <rect width="1200" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">CBC Bit-Flipping Malleability Attack Mechanics</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Modifying byte k in Ciphertext C₁ scrambles P₁ into noise, but flips target bit k in</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">P₂ ('isadmin=0' → 'isadmin=1')</text>
  
    <g>
      <!-- Top Section: Transmitted Ciphertext -->
      <!-- C1 Box -->
      <rect x="50" y="110" width="520" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
      <text x="70" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">ATTACKER MANIPULATES CIPHERTEXT</text>
      <text x="70" y="160" font-size="16" font-weight="800" fill="#0f172a">Ciphertext Block 1 (C₁)</text>
      <rect x="340" y="142" width="210" height="28" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
      <text x="445" y="161" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">Byte 13 Flipped (0x30 ⊕ 0x31)</text>

      <!-- C2 Box -->
      <rect x="630" y="110" width="520" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
      <text x="650" y="136" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">UNTOUCHED CIPHERTEXT</text>
      <text x="650" y="160" font-size="16" font-weight="800" fill="#0f172a">Ciphertext Block 2 (C₂)</text>
      <text x="650" y="184" font-size="13" font-weight="500" fill="#475569">Payload containing "user;isadmin=0;;"</text>

      <!-- Decryption Flow Arrows -->
      <path d="M310 205 L310 255" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="320" y="235" font-size="11" font-weight="700" fill="#475569">D_K(C₁)</text>

      <path d="M890 205 L890 255" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- CBC Chaining Arrow (C1 -> P2) -->
      <path d="M445 170 L445 230 L870 230 L870 255" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
      <text x="660" y="222" font-size="11" font-weight="800" fill="#b91c1c">CBC Chaining: C₁ XORs into P₂ Decryption</text>

      <!-- Bottom Section: Server Decrypted Plaintext -->
      <!-- Decrypted P1 Box (Garbled Noise) -->
      <rect x="50" y="260" width="520" height="110" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="70" y="286" font-size="11" font-weight="900" letter-spacing="1" fill="#b91c1c">SERVER DECRYPTED RESULT: BLOCK 1</text>
      <text x="70" y="310" font-size="16" font-weight="800" fill="#b91c1c">Unrecoverable Garbled Noise</text>
      <text x="70" y="334" font-size="13" font-weight="500" fill="#475569">AES block diffusion scrambles entire 16-byte block</text>
      <text x="70" y="352" font-size="12" fill="#475569">b'ú...' (Ignored by application header parser)</text>

      <!-- Decrypted P2 Box (Privilege Escalation Target) -->
      <rect x="630" y="260" width="520" height="110" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
      <text x="650" y="286" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">SERVER DECRYPTED RESULT: BLOCK 2</text>
      <text x="650" y="310" font-size="16" font-weight="800" fill="#0f172a">"user;isadmin=1;;"</text>
      <text x="650" y="334" font-size="13" font-weight="700" fill="#0f766e">Privilege Escalation Achieved!</text>
      <text x="650" y="352" font-size="12" font-weight="500" fill="#475569">Target byte 13 flipped from '0' to '1'; other 15 bytes intact</text>

      <!-- Bottom Summary Banner -->
      <rect x="50" y="390" width="1100" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="600" y="414" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">No Key Required — Unauthenticated CBC lacks AEAD integrity tags. Decryption succeeds without raising errors!</text>
    </g>
</svg>
