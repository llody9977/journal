<svg viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">X.509 Certificate Authority Trust Hierarchy</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Offline Root CA delegates signing authority to Intermediate CAs to issue short-lived End-Entity certificates</text>

  <!-- Root CA Level (x=340 to 860, w=520, y=105, h=100) -->
  <rect x="340" y="105" width="520" height="100" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="600" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#94a3b8" text-anchor="middle">TRUST ANCHOR (OFFLINE ROOT CA)</text>
  <text x="600" y="154" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Self-Signed Root Certificate</text>
  <text x="600" y="174" font-size="11.5" fill="#cbd5e1" text-anchor="middle">Pre-installed in OS &amp; Browser Trust Stores</text>
  <text x="600" y="191" font-size="11" fill="#94a3b8" text-anchor="middle">(Illustrative example: ~10-25yr validity, air-gapped HSM)</text>

  <!-- Connecting Lines Root -> Intermediates -->
  <path d="M 470 205 L 310 245" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <path d="M 730 205 L 890 245" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

  <!-- Intermediate CAs Level (y=250, h=90) -->
  <!-- Left: Intermediate CA 1 (x=80 to 540, w=460, center x=310) -->
  <rect x="80" y="250" width="460" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="275" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb" text-anchor="middle">ISSUING CA (INTERMEDIATE CA 1)</text>
  <text x="310" y="297" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">Signed by Root CA</text>
  <text x="310" y="318" font-size="11" fill="#475569" text-anchor="middle">Active online signing CA for web / TLS certificates</text>

  <!-- Right: Intermediate CA 2 (x=660 to 1120, w=460, center x=890) -->
  <rect x="660" y="250" width="460" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="890" y="275" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb" text-anchor="middle">ISSUING CA (INTERMEDIATE CA 2)</text>
  <text x="890" y="297" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">Signed by Root CA</text>
  <text x="890" y="318" font-size="11" fill="#475569" text-anchor="middle">Backup / specialized issuing CA branch</text>

  <!-- Connecting Lines Intermediates -> Leaf -->
  <path d="M 310 340 L 490 375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M 890 340 L 710 375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Leaf Level (x=370 to 830, w=460, y=380, h=48) -->
  <rect x="370" y="380" width="460" height="48" rx="8" fill="#15803d"/>
  <text x="600" y="409" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">Leaf / End-Entity Certificate (example.com)</text>
</svg>
