<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff" />

  <defs>
    <g id="icon-lock-sm">
      <rect x="25" y="45" width="50" height="38" rx="8" />
      <path d="M32 45V33a18 18 0 0 1 36 0v12" fill="none" stroke-width="7" stroke-linecap="round" />
      <circle cx="50" cy="61" r="5" fill="#193e9f" />
      <rect x="47" y="61" width="6" height="11" fill="#193e9f" />
    </g>
    <g id="icon-cert">
      <rect x="15" y="15" width="70" height="70" rx="8" fill="#ffffff" fill-opacity="0.22" />
      <line x1="28" y1="35" x2="72" y2="35" stroke="#ffffff" stroke-width="5" />
      <line x1="28" y1="48" x2="72" y2="48" stroke="#ffffff" stroke-width="5" />
      <path d="M40 62 l10 10 l20 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>

  <!-- connectors -->
  <g stroke="#8491a3" stroke-width="2.5" fill="none">
    <line x1="450" y1="90" x2="450" y2="150" />
    <line x1="450" y1="220" x2="450" y2="250" />
    <line x1="190" y1="250" x2="710" y2="250" />
    <line x1="190" y1="250" x2="190" y2="280" />
    <line x1="450" y1="250" x2="450" y2="280" />
    <line x1="710" y1="250" x2="710" y2="280" />
  </g>

  <!-- Root CA -->
  <rect x="290" y="20" width="320" height="70" rx="12" fill="#193e9f" />
  <use href="#icon-cert" transform="translate(305,32) scale(0.4)" />
  <g fill="#ffffff" text-anchor="start">
    <text x="355" y="52" font-size="17" font-weight="700">Example Root CA</text>
    <text x="355" y="72" font-size="11.5" fill="#c9d7fb">self-signed, kept offline, in every trust store</text>
  </g>

  <!-- Intermediate CA -->
  <rect x="290" y="150" width="320" height="70" rx="12" fill="#2457d6" />
  <use href="#icon-cert" transform="translate(305,162) scale(0.4)" />
  <g fill="#ffffff" text-anchor="start">
    <text x="355" y="182" font-size="17" font-weight="700">Example TLS Intermediate CA1</text>
    <text x="355" y="202" font-size="11.5" fill="#dbe7ff">signed by root — serves many unrelated customers</text>
  </g>

  <!-- Leaf certificates: unrelated domains, showing one intermediate serves many customers -->
  <rect x="80" y="280" width="220" height="75" rx="12" fill="#ffffff" stroke="#d7dee7" stroke-width="1.5" />
  <use href="#icon-lock-sm" fill="#e9efff" transform="translate(93,292) scale(0.38)" />
  <g fill="#111827" text-anchor="start">
    <text x="140" y="313" font-size="16" font-weight="700">a.com</text>
    <text x="140" y="332" font-size="11" fill="#475569">leaf / end-entity cert</text>
    <text x="140" y="346" font-size="11" fill="#475569">(unrelated business)</text>
  </g>

  <rect x="340" y="280" width="220" height="75" rx="12" fill="#ffffff" stroke="#d7dee7" stroke-width="1.5" />
  <use href="#icon-lock-sm" fill="#e9efff" transform="translate(353,292) scale(0.38)" />
  <g fill="#111827" text-anchor="start">
    <text x="400" y="313" font-size="16" font-weight="700">example.com</text>
    <text x="400" y="332" font-size="11" fill="#475569">leaf / end-entity cert</text>
    <text x="400" y="346" font-size="11" fill="#475569">(unrelated business)</text>
  </g>

  <rect x="600" y="280" width="220" height="75" rx="12" fill="#ffffff" stroke="#d7dee7" stroke-width="1.5" />
  <use href="#icon-lock-sm" fill="#e9efff" transform="translate(613,292) scale(0.38)" />
  <g fill="#111827" text-anchor="start">
    <text x="660" y="313" font-size="16" font-weight="700">shop.net</text>
    <text x="660" y="332" font-size="11" fill="#475569">leaf / end-entity cert</text>
    <text x="660" y="346" font-size="11" fill="#475569">(unrelated business)</text>
  </g>
</svg>
