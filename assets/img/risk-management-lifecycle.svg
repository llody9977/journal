<svg viewBox="0 0 1200 570" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">The Continuous Risk Management Lifecycle</title>
  <desc id="description">Inputs including threat modeling, vulnerability findings scored for severity with CVSS, and threat intelligence lead to Risk Assessment, five Risk Response Strategies (Avoid, Mitigate, Share, Transfer, Accept), Security Control Execution, and a Continuous Risk Monitoring feedback loop.</desc>
  <rect width="1200" height="570" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">The Continuous Risk Management Lifecycle</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Inputs (Threat Modeling, Vulnerability Findings, Intel) lead to Risk Assessment, 5 Risk Response Strategies (Avoid, Mitigate, Share, Transfer, Accept),</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">Security Control Execution, and Continuous Risk Monitoring feedback loop.</text>
  
    <!-- Stage 1: Problem Inputs (x=40, w=210) -->
    <rect x="40" y="125" width="210" height="340" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="55" y="152" font-size="10.5" font-weight="900" letter-spacing="1" fill="#2563eb">STAGE 1: INPUTS</text>
    <text x="55" y="174" font-size="15" font-weight="800" fill="#0f172a">Problem Domain</text>
    <line x1="55" y1="188" x2="235" y2="188" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
    <text x="55" y="210" font-size="11" font-weight="800" fill="#2563eb">OPERATIONAL INPUTS:</text>
    <text x="55" y="228" font-size="11.5" font-weight="500" fill="#475569">• Threat Modeling</text>
    <text x="55" y="246" font-size="11.5" font-weight="500" fill="#475569">• Vulnerability Findings</text>
    <text x="55" y="264" font-size="11.5" font-weight="500" fill="#475569">  scored for severity with CVSS</text>
    <text x="55" y="282" font-size="11.5" font-weight="500" fill="#475569">• Threat Intel Feeds</text>
    <text x="55" y="300" font-size="11.5" font-weight="500" fill="#475569">• Asset Inventories</text>
    <text x="55" y="318" font-size="11.5" font-weight="500" fill="#475569">• Gap Assessments</text>
    <line x1="55" y1="332" x2="235" y2="332" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
    <text x="55" y="352" font-size="11" font-weight="800" fill="#2563eb">COMPONENTS:</text>
    <text x="55" y="370" font-size="11" font-weight="600" fill="#0f172a">• Asset</text>
    <text x="55" y="388" font-size="11" font-weight="600" fill="#0f172a">• Threat Source/Event</text>
    <text x="55" y="406" font-size="11" font-weight="600" fill="#0f172a">• Vulnerability</text>
    <text x="55" y="424" font-size="11" font-weight="600" fill="#0f172a">• Predisposing Condition</text>
    <text x="55" y="442" font-size="11" font-weight="600" fill="#0f172a">• Consequential Impact</text>

    <!-- Arrow 1 -> 2 -->
    
    <path d="M250 295 L270 295" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    

    <!-- Stage 2: Risk Assessment (x=270, w=210) -->
    <rect x="270" y="125" width="210" height="340" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
    <text x="285" y="152" font-size="10.5" font-weight="900" letter-spacing="1" fill="#b45309">STAGE 2: EVALUATION</text>
    <text x="285" y="174" font-size="15" font-weight="800" fill="#0f172a">Risk Assessment</text>
    <text x="285" y="194" font-size="10.5" font-weight="600" fill="#475569">(NIST SP 800-30 Rev. 1)</text>
    <line x1="285" y1="206" x2="465" y2="206" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
    <text x="285" y="228" font-size="11.5" font-weight="700" fill="#0f172a">Calculate Exposure:</text>
    <text x="285" y="250" font-size="12" font-weight="800" fill="#b45309">Risk ≈ Likelihood × Impact</text>
    <text x="285" y="262" font-size="10.5" font-weight="600" fill="#475569">(journal working model)</text>
    <line x1="285" y1="264" x2="465" y2="264" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
    <text x="285" y="286" font-size="11.5" font-weight="500" fill="#475569">• Threat Plausibility</text>
    <text x="285" y="304" font-size="11.5" font-weight="500" fill="#475569">• Impact Harm Severity</text>
    <text x="285" y="322" font-size="11.5" font-weight="500" fill="#475569">• Evaluated Severity:</text>
    <text x="285" y="342" font-size="11" font-weight="700" fill="#0f172a">  (Low/Med/High/Critical)</text>

    <!-- Arrow 2 -> 3 -->
    
    <path d="M480 295 L500 295" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    

    <!-- Stage 3: Risk Response Strategies (x=500, w=220) -->
    <rect x="500" y="125" width="220" height="340" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <text x="515" y="152" font-size="10.5" font-weight="900" letter-spacing="1" fill="#7c3aed">STAGE 3: STRATEGY</text>
    <text x="515" y="174" font-size="15" font-weight="800" fill="#0f172a">Risk Responses</text>
    <text x="515" y="194" font-size="10.5" font-weight="600" fill="#475569">(NIST SP 800-39 / ISO 27005)</text>
    <line x1="515" y1="206" x2="705" y2="206" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" />

    <!-- 5 Strategy Cards -->
    <rect x="510" y="214" width="200" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="518" y="230" font-size="10.5" font-weight="800" fill="#0f172a">1. Avoid</text>
    <text x="575" y="230" font-size="10" font-weight="500" fill="#475569">End the activity</text>

    <rect x="510" y="256" width="200" height="44" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" />
    <text x="518" y="273" font-size="10.5" font-weight="800" fill="#0f766e">2. Mitigate ──&gt;</text>
    <text x="518" y="290" font-size="10" font-weight="700" fill="#0f172a">Triggers Stage 4 Controls</text>

    <rect x="510" y="306" width="200" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="518" y="322" font-size="10.5" font-weight="800" fill="#0f172a">3. Share</text>
    <text x="575" y="322" font-size="10" font-weight="500" fill="#475569">Distribute exposure</text>

    <rect x="510" y="348" width="200" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="518" y="364" font-size="10.5" font-weight="800" fill="#0f172a">4. Transfer</text>
    <text x="587" y="364" font-size="10" font-weight="500" fill="#475569">Shift defined loss</text>

    <rect x="510" y="390" width="200" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="518" y="406" font-size="10.5" font-weight="800" fill="#0f172a">5. Accept</text>
    <text x="580" y="406" font-size="10" font-weight="500" fill="#475569">Authorize residual risk</text>

    <!-- Arrow 3 -> 4 -->
    
    <path d="M720 291 L740 291" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    

    <!-- Stage 4: Security Controls Execution (x=740, w=220) -->
    <rect x="740" y="125" width="220" height="340" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" />
    <text x="755" y="152" font-size="10.5" font-weight="900" letter-spacing="1" fill="#0f766e">STAGE 4: EXECUTION</text>
    <text x="755" y="174" font-size="15" font-weight="800" fill="#0f172a">Security Controls</text>
    <text x="755" y="194" font-size="10.5" font-weight="600" fill="#475569">(NIST SP 800-53 Rev. 5)</text>
    <line x1="755" y1="206" x2="945" y2="206" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
    <text x="755" y="226" font-size="11" font-weight="800" fill="#0f172a">• Preventive Safeguards:</text>
    <text x="755" y="244" font-size="10.5" font-weight="500" fill="#475569">  IAM policies, WAF, mTLS, IPS</text>
    <text x="755" y="264" font-size="11" font-weight="800" fill="#0f172a">• Detective Safeguards:</text>
    <text x="755" y="282" font-size="10.5" font-weight="500" fill="#475569">  SIEM correlation, IDS alerts</text>
    <text x="755" y="302" font-size="11" font-weight="800" fill="#0f172a">• Corrective / Recovery:</text>
    <text x="755" y="320" font-size="10.5" font-weight="500" fill="#475569">  Containment, backups, DR</text>
    <text x="755" y="340" font-size="10.5" font-weight="800" fill="#0f172a">• Compensating:</text>
    <text x="765" y="358" font-size="10.5" font-weight="500" fill="#475569">Comparable substitute</text>
    <text x="755" y="378" font-size="10.5" font-weight="700" fill="#0f172a">• Deterrent: discouragement</text>
    <line x1="755" y1="392" x2="945" y2="392" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
    <text x="755" y="410" font-size="11" font-weight="800" fill="#0f766e">LEAVES OUTCOME:</text>
    <text x="755" y="430" font-size="11.5" font-weight="700" fill="#0f172a">Residual Risk Requiring a</text>
    <text x="755" y="446" font-size="11.5" font-weight="700" fill="#0f172a">Recorded Response</text>

    <!-- Arrow 4 -> 5 -->
    
    <path d="M960 295 L980 295" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    

    <!-- Stage 5: Outcome & Monitoring (x=980, w=180) -->
    <rect x="980" y="125" width="180" height="340" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
    <text x="995" y="152" font-size="10.5" font-weight="900" letter-spacing="1" fill="#15803d">STAGE 5: MONITORING</text>
    <text x="995" y="174" font-size="14" font-weight="800" fill="#0f172a">Residual Risk &amp; Loop</text>
    <text x="995" y="194" font-size="10.5" font-weight="600" fill="#475569">(NIST SP 800-137)</text>
    <line x1="995" y1="206" x2="1145" y2="206" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="995" y="228" font-size="11" font-weight="700" fill="#0f172a">Continuous Action:</text>
    <text x="995" y="248" font-size="11" font-weight="500" fill="#475569">• Monitor Control Efficacy</text>
    <text x="995" y="268" font-size="11" font-weight="500" fill="#475569">• Track New Threat Intel</text>
    <text x="995" y="288" font-size="11" font-weight="500" fill="#475569">• Audit Env Changes</text>
    <text x="995" y="308" font-size="11" font-weight="500" fill="#475569">• Re-evaluate Risk</text>
    <line x1="995" y1="324" x2="1145" y2="324" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="995" y="348" font-size="11" font-weight="800" fill="#15803d">FEEDBACK LOOP ↺</text>
    <text x="995" y="368" font-size="10.5" font-weight="500" fill="#475569">Feeds back into Stage 1</text>
    <text x="995" y="386" font-size="10.5" font-weight="500" fill="#475569">Inputs continuously</text>

    <!-- Bottom Bar: Universal Return Loop (y=485, w=1120) -->
    <rect x="40" y="485" width="1120" height="65" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
    <text x="600" y="512" text-anchor="middle" font-size="12" font-weight="900" letter-spacing="1" fill="#15803d">CONTINUOUS RISK MANAGEMENT FEEDBACK LOOP (NIST SP 800-37 / SP 800-137)</text>
    <text x="600" y="534" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Risk management is NOT a static one-time event ↺ Findings from Stage 5 feed right back into Stage 1 Inputs for continuous reassessment.</text>

    <!-- Clean Vertical Return Loop Arrows -->
    
    <path d="M1070 465 L1070 485" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    
    <path d="M145 485 L145 465" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
</svg>
