<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Defense in Depth vs Duplicate Control Architecture</title>
  <desc id="description">Architecture mapping True Defense-in-Depth (Diverse Complementary Gates), Valid Ingestion Point Layering across boundaries, versus Single-Boundary Duplicate Anti-Patterns.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Defense in Depth vs Duplicate Control Architecture</text>
  <text x="50" y="88" font-size="16" fill="#475569">Architecture mapping True Defense-in-Depth (Diverse Complementary Gates), Valid Ingestion Point Layering across boundaries, versus Single-Boundary Duplicate Anti-Patterns.</text>
  
    <!-- PANEL 1: TRUE DEFENSE IN DEPTH (y=110, h=185) -->
    <rect x="40" y="110" width="1120" height="185" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5" />
    <text x="60" y="135" font-size="11" font-weight="900" letter-spacing="1" fill="#15803d">TRUE DEFENSE IN DEPTH: DIVERSE COMPLEMENTARY SAFEGUARDS</text>
    <text x="60" y="155" font-size="13" font-weight="800" fill="#0f172a">Independent Failure Modes Across 4 Distinct Boundaries (NIST SP 800-160)</text>

    <!-- Box 1: Network Gate (x=60, y=172, w=245, h=105) -->
    <rect x="60" y="172" width="245" height="105" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="75" y="195" font-size="10.5" font-weight="900" fill="#15803d">1. NETWORK GATE (mTLS)</text>
    <text x="75" y="213" font-size="12" font-weight="800" fill="#0f172a">Identity Verification</text>
    <line x1="75" y1="222" x2="290" y2="222" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="75" y="240" font-size="10" font-weight="500" fill="#475569">• Client Certificate Auth</text>
    <text x="75" y="256" font-size="10" font-weight="500" fill="#475569">• Transport Layer Isolation</text>

    <!-- Arrow 1->2 -->
    <path d="M 305 224 L 330 224" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

    <!-- Box 2: Ingress Gate (x=330, y=172, w=245, h=105) -->
    <rect x="330" y="172" width="245" height="105" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="345" y="195" font-size="10.5" font-weight="900" fill="#15803d">2. INGRESS GATE (WAF)</text>
    <text x="345" y="213" font-size="12" font-weight="800" fill="#0f172a">Payload Filtering</text>
    <line x1="345" y1="222" x2="560" y2="222" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="345" y="240" font-size="10" font-weight="500" fill="#475569">• Parameter Validation</text>
    <text x="345" y="256" font-size="10" font-weight="500" fill="#475569">• OWASP Rule Checks</text>

    <!-- Arrow 2->3 -->
    <path d="M 575 224 L 600 224" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

    <!-- Box 3: Application Gate (x=600, y=172, w=245, h=105) -->
    <rect x="600" y="172" width="245" height="105" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="615" y="195" font-size="10.5" font-weight="900" fill="#15803d">3. CODE GATE (SAST / OPA)</text>
    <text x="615" y="213" font-size="12" font-weight="800" fill="#0f172a">Input Sanitization</text>
    <line x1="615" y1="222" x2="830" y2="222" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="615" y="240" font-size="10" font-weight="500" fill="#475569">• Parameterized SQL Queries</text>
    <text x="615" y="256" font-size="10" font-weight="500" fill="#475569">• Rego Policy Enforcement</text>

    <!-- Arrow 3->4 -->
    <path d="M 845 224 L 870 224" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

    <!-- Box 4: Data Gate (x=870, y=172, w=270, h=105) -->
    <rect x="870" y="172" width="270" height="105" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="885" y="195" font-size="10.5" font-weight="900" fill="#15803d">4. DATA GATE (ENCRYPTION)</text>
    <text x="885" y="213" font-size="12" font-weight="800" fill="#0f172a">Exfiltration Protection</text>
    <line x1="885" y1="222" x2="1125" y2="222" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="885" y="240" font-size="10" font-weight="500" fill="#475569">• AES-256 Envelope Keys</text>
    <text x="885" y="256" font-size="10" font-weight="500" fill="#475569">• HSM Key Isolation</text>

    <!-- PANEL 2: INGESTION POINT LAYERING VS DUPLICATE ANTI-PATTERN (y=310, h=175) -->
    <rect x="40" y="310" width="1120" height="175" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />
    <text x="60" y="335" font-size="11" font-weight="900" letter-spacing="1" fill="#0f172a">INGESTION POINT LAYERING VS SINGLE-BOUNDARY DUPLICATE ANTI-PATTERN</text>
    <text x="60" y="355" font-size="12.5" font-weight="600" fill="#475569">Distinguishing Multi-Boundary Ingress Safeguards from Redundant Single-Point Inspection Stacks (NIST SP 800-160)</text>

    <!-- Box 1: Single Boundary Duplicate Anti-Pattern (x=60, y=372, w=520, h=95) -->
    <rect x="60" y="372" width="520" height="95" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" />
    <text x="75" y="395" font-size="10.5" font-weight="900" fill="#b91c1c">SINGLE-BOUNDARY DUPLICATE ANTI-PATTERN</text>
    <text x="75" y="413" font-size="12" font-weight="800" fill="#0f172a">Dual Stacked WAF Regex Engines at Same API Gateway Ingress</text>
    <line x1="75" y1="422" x2="565" y2="422" stroke="#b91c1c" stroke-opacity="0.3" stroke-width="1" />
    <text x="75" y="440" font-size="10" font-weight="500" fill="#475569">• Stacked Vendor A + Vendor B WAFs on same proxy checking identical HTTP headers</text>
    <text x="75" y="454" font-size="10" font-weight="600" fill="#b91c1c">• Failure Mode: HTTP request smuggling evades BOTH WAFs simultaneously</text>

    <!-- Box 2: Valid Ingestion Point Layering (x=600, y=372, w=540, h=95) -->
    <rect x="600" y="372" width="540" height="95" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" />
    <text x="615" y="395" font-size="10.5" font-weight="900" fill="#15803d">VALID INGESTION POINT LAYERING (MULTI-BOUNDARY)</text>
    <text x="615" y="413" font-size="12" font-weight="800" fill="#0f172a">API Gateway WAF (Web) + Kafka Consumer Sidecar (Internal Queue)</text>
    <line x1="615" y1="422" x2="1125" y2="422" stroke="#15803d" stroke-opacity="0.3" stroke-width="1" />
    <text x="615" y="440" font-size="10" font-weight="500" fill="#475569">• Gateway WAF checks public web API payloads; Kafka Sidecar checks internal event streams</text>
    <text x="615" y="454" font-size="10" font-weight="600" fill="#15803d">• Architectural Merit: Protects public HTTP ingress AND internal queue lateral vectors</text>
</svg>
