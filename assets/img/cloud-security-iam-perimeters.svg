<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Cloud Security Architecture &amp; IAM Perimeters Diagram</title>
  <desc id="description">Cloud Security Architecture diagram showing Shared Responsibility Model across IaaS/PaaS/SaaS, CSPM, CIEM, and CWPP.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Cloud Security Architecture &amp; IAM Perimeters</text>
  <text x="50" y="75" font-size="14" fill="#475569">Shared Responsibility Model, CSPM posture management, CIEM entitlement analysis, and CWPP workload protection.</text>
  
  <!-- Shared Responsibility (x=40, w=540, y=105, h=160) -->
  <rect x="40" y="105" width="540" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">SHARED RESPONSIBILITY MODEL (IAAS / PAAS / SAAS)</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">Customer vs Cloud Provider Boundaries</text>
  <line x1="60" y1="166" x2="560" y2="166" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">• Cloud Provider: Physical datacenter, hypervisor, hardware &amp; core network</text>
  <text x="60" y="206" font-size="11.5" font-weight="500" fill="#475569">• Customer (IaaS): OS patching, network firewall rules, IAM roles, data encryption</text>
  <text x="60" y="226" font-size="11.5" font-weight="500" fill="#475569">• Customer (SaaS): Data classification, user access management, &amp; endpoint security</text>

  <!-- CSPM / CIEM / CWPP Trio (x=620, w=540, y=105, h=160) -->
  <rect x="620" y="105" width="540" height="160" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="640" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">CLOUD SECURITY TOOLING TRIO (CSPM / CIEM / CWPP)</text>
  <text x="640" y="155" font-size="14" font-weight="800" fill="#0f172a">Continuous Cloud Risk &amp; Posture Management</text>
  <line x1="640" y1="166" x2="1140" y2="166" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="640" y="186" font-size="11.5" font-weight="500" fill="#475569">• CSPM: Continuously audits cloud configurations against CIS Benchmarks (e.g. S3 buckets)</text>
  <text x="640" y="206" font-size="11.5" font-weight="500" fill="#475569">• CIEM: Analyzes IAM permissions to eliminate over-privileged roles &amp; unused keys</text>
  <text x="640" y="226" font-size="11.5" font-weight="500" fill="#475569">• CWPP: Runtime protection &amp; vulnerability scanning for VMs, containers, &amp; serverless</text>

  <!-- IAM Identity Perimeter (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">IAM IDENTITY PERIMETER &amp; BOUNDARY POLICIES</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Service Control Policies &amp; Principal Constraints</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="366" font-size="11.5" font-weight="500" fill="#475569">• Service Control Policies (SCPs): Guardrail organization boundaries restricting root/admin capabilities</text>
  <text x="60" y="384" font-size="11.5" font-weight="500" fill="#475569">• Permissions Boundaries: Maximum entitlement ceiling capping permissions assigned to IAM roles</text>
  <text x="60" y="402" font-size="11.5" font-weight="500" fill="#475569">• Attribute-Based Access Control (ABAC): Dynamic access decisions based on resource &amp; environment tags</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">CLOUD PERIMETER: ORGANIZATIONAL SCP GUARDRAILS → IAM BOUNDARY CHECKS → CSPM CONFIG AUDITING → CWPP RUNTIME DEFENSE</text>
</svg>
