<svg viewBox="0 0 1200 355" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Public TLS certificate lifetime reduction</title>
  <desc id="description">Shorter lifetimes reduce the exposure window of a compromised or misissued certificate.</desc>
  <rect width="1200" height="355" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Public TLS certificate lifetime reduction</text>
  <text x="50" y="88" font-size="16" fill="#475569">Shorter lifetimes reduce the exposure window of a compromised or misissued certificate.</text>
  
    <g>
      <rect x="50" y="135" width="176" height="175" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">BEFORE 2020</text>
      <text x="75" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">825 days</text>
      <text x="75" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">former maximum</text>
    </g>

    <g>
      <rect x="281" y="135" width="176" height="175" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="306" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">SEPTEMBER 2020</text>
      <text x="306" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">398 days</text>
      <text x="306" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">industry maximum</text>
    </g>

    <g>
      <rect x="512" y="135" width="176" height="175" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="537" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">MARCH 2026</text>
      <text x="537" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">200 days</text>
      <text x="537" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">current phase</text>
    </g>

    <g>
      <rect x="743" y="135" width="176" height="175" rx="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
      <text x="768" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#7c3aed">MARCH 2027</text>
      <text x="768" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">100 days</text>
      <text x="768" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">next phase</text>
    </g>

    <g>
      <rect x="974" y="135" width="176" height="175" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
      <text x="999" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#15803d">MARCH 2029</text>
      <text x="999" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">47 days</text>
      <text x="999" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">planned final phase</text>
    </g>
    <path d="M234 222.5 L273 222.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="253.5" y="125" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">REDUCED</text>
    <path d="M465 222.5 L504 222.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="484.5" y="125" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">REDUCED</text>
    <path d="M696 222.5 L735 222.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="715.5" y="125" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">REDUCED</text>
    <path d="M927 222.5 L966 222.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="946.5" y="125" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">REDUCES AGAIN</text>
</svg>
