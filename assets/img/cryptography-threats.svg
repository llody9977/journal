<svg viewBox="0 0 1200 355" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Threats to data crossing an untrusted network</title>
  <desc id="description">Cryptographic controls protect different properties of the same communication.</desc>
  <rect width="1200" height="355" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Threats to data crossing an untrusted network</text>
  <text x="50" y="88" font-size="15" fill="#475569">Cryptographic controls protect different properties of the same communication.</text>
  
    <g>
      <rect x="50" y="135" width="330" height="215" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">CONFIDENTIALITY</text>
      <text x="75" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Eavesdropping</text>
      <text x="75" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Attacker reads</text>
<text x="75" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">data in transit</text>
    </g>

    <g>
      <rect x="435" y="135" width="330" height="215" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="460" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">INTEGRITY</text>
      <text x="460" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Tampering</text>
      <text x="460" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Attacker modifies</text>
<text x="460" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">the payload</text>
    </g>

    <g>
      <rect x="820" y="135" width="330" height="215" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="845" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">AUTHENTICITY</text>
      <text x="845" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Impersonation</text>
      <text x="845" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Attacker pretends</text>
<text x="845" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">to be a peer</text>
    </g>
    <path d="M388 242.5 L427 242.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <path d="M773 242.5 L812 242.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
</svg>
