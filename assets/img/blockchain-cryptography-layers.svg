<svg viewBox="0 0 1200 608" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Cryptographic layers in a blockchain</title>
  <desc id="description">Each primitive solves a different problem; none of them creates trust on its own.</desc>
  <rect width="1200" height="608" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Cryptographic layers in a blockchain</text>
  <text x="50" y="88" font-size="16" fill="#475569">Each primitive solves a different problem; none of them creates trust on its own.</text>
  
    <g>
      <rect x="80" y="130" width="1040" height="115" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="105" y="161" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">1 · TAMPER EVIDENCE</text>
      <text x="105" y="195" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Hash-linked blocks</text>
      <text x="105" y="235" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Each block commits to the previous block hash, so changing history breaks every later link.</text>
    </g>

    <g>
      <rect x="80" y="289" width="1040" height="115" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="105" y="320" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">2 · EFFICIENT INCLUSION</text>
      <text x="105" y="354" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Merkle tree</text>
      <text x="105" y="394" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">A root digest commits to many transactions and supports logarithmic-size inclusion proofs.</text>
    </g>

    <g>
      <rect x="80" y="448" width="1040" height="115" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="105" y="479" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">3 · AUTHORIZATION</text>
      <text x="105" y="513" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Digital signatures</text>
      <text x="105" y="553" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Owners authorize transactions with private keys; nodes verify them with public keys.</text>
    </g>
    <path d="M600 252 L600 282" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="528" y="235" width="144" height="24" rx="12" fill="#ffffff"/><text x="600" y="252" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">COMMITS TRANSACTIONS</text>
    <path d="M600 411 L600 441" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="535.2" y="394" width="129.6" height="24" rx="12" fill="#ffffff"/><text x="600" y="411" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">AUTHORIZES CHANGES</text>
</svg>
