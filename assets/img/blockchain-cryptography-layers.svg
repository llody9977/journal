<svg viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Cryptographic Primitives Layering in Blockchains</text>
  <text x="50" y="80" font-size="14.5" fill="#475569">Distinct cryptographic primitives compose to provide tamper-evidence, inclusion proofs, and transaction authorization</text>
  <text x="50" y="99" font-size="13" fill="#64748b">Ordering and finality are decided separately, by the consensus layer</text>

  <!-- Outer Container Panel -->
  <rect x="40" y="110" width="1120" height="450" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />

  <!-- Layer 1: Tamper Evidence (y=130, h=100) -->
  <rect x="70" y="130" width="1060" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="155" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">1 · TAMPER EVIDENCE (NOT FINALITY &#8212; THAT'S CONSENSUS)</text>
  <text x="95" y="180" font-size="16" font-weight="800" fill="#0f172a">Hash-Linked Block Header Chain</text>
  <text x="95" y="205" font-size="11.5" fill="#475569">• Each block header embeds the cryptographic hash of the previous block; altering history breaks all subsequent links.</text>

  <!-- Connector 1 -> 2 (y=230 to 270) -->
  <path d="M 600 233 L 600 267" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <rect x="480" y="238" width="240" height="24" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="600" y="254" font-size="10.5" font-weight="800" fill="#1e40af" text-anchor="middle">COMMITS BLOCK HISTORY</text>

  <!-- Layer 2: Efficient Inclusion (y=270, h=100) -->
  <rect x="70" y="270" width="1060" height="100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="95" y="295" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">2 · EFFICIENT INCLUSION (DATA AUDITING)</text>
  <text x="95" y="320" font-size="16" font-weight="800" fill="#0f172a">Merkle Tree Transaction Root Digest</text>
  <text x="95" y="345" font-size="11.5" fill="#475569">• Binary hash tree commits thousands of transactions into a 32-byte root with O(log N) inclusion proofs.</text>

  <!-- Connector 2 -> 3 (y=370 to 410) -->
  <path d="M 600 373 L 600 407" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
  <rect x="480" y="378" width="240" height="24" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
  <text x="600" y="394" font-size="10.5" font-weight="800" fill="#0f766e" text-anchor="middle">AUTHORIZES STATE CHANGES</text>

  <!-- Layer 3: Authorization (y=410, h=100) -->
  <rect x="70" y="410" width="1060" height="100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="95" y="435" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">3 · AUTHORIZATION &amp; STATE TRANSITIONS</text>
  <text x="95" y="460" font-size="16" font-weight="800" fill="#0f172a">Asymmetric Digital Signatures (ECDSA / Ed25519)</text>
  <text x="95" y="485" font-size="11.5" fill="#475569">• Private keys sign transaction transfers; validating nodes verify authenticity prior to state execution.</text>

  <!-- Summary Footer -->
  <rect x="70" y="522" width="1060" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="541" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Summary: Each primitive solves a distinct problem; chaining, inclusion proof, and signature authorization compose the protocol trust model.</text>
</svg>
