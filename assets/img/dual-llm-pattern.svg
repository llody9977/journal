<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="dual-title dual-desc">
  <title id="dual-title">The dual LLM pattern: quarantined LLM, controller, privileged LLM</title>
  <desc id="dual-desc">Untrusted content flows into a quarantined LLM that has no tools and no network access. Its output never reaches the privileged LLM directly: a non-LLM controller stores each extracted value and passes only an opaque handle such as dollar VAR2. The privileged LLM holds the tools and sees only the user request and those handles, so attacker-controlled text never enters the model that can act. A footer notes that the controller, not the schema, is the security boundary.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>

  <defs>
    <marker id="dualArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="dualStop" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L8 8 M8 2 L2 8" stroke="#b91c1c" stroke-width="2.2" fill="none"/>
    </marker>
  </defs>

  <text x="50" y="46" font-size="26" font-weight="850" fill="#0f172a">The dual LLM pattern</text>
  <text x="50" y="72" font-size="14" fill="#475569">The model that reads untrusted content holds no tools. The model that holds tools never reads untrusted content.</text>

  <!-- untrusted source -->
  <rect x="40" y="104" width="250" height="76" rx="12" fill="#9f1239"/>
  <text x="165" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Untrusted content</text>
  <text x="165" y="153" text-anchor="middle" font-size="12" fill="#fbd9df">web pages, emails, retrieved</text>
  <text x="165" y="170" text-anchor="middle" font-size="12" fill="#fbd9df">documents, tool output</text>

  <!-- quarantined LLM -->
  <rect x="330" y="96" width="290" height="188" rx="14" fill="#fde8ea" stroke="#9f1239" stroke-width="2.5"/>
  <text x="352" y="124" font-size="12" font-weight="900" letter-spacing="1" fill="#9f1239">QUARANTINED LLM</text>
  <text x="352" y="148" font-size="14" font-weight="800" fill="#0f172a">Assume it is compromised</text>
  <line x1="352" y1="160" x2="598" y2="160" stroke="#9f1239" stroke-opacity="0.3" stroke-width="1"/>
  <text x="352" y="182" font-size="12.5" fill="#475569">No tool access</text>
  <text x="352" y="202" font-size="12.5" fill="#475569">No outbound network calls</text>
  <text x="352" y="222" font-size="12.5" fill="#475569">No access to user secrets</text>
  <text x="352" y="248" font-size="12.5" fill="#475569">Emits extracted values only,</text>
  <text x="352" y="268" font-size="12.5" fill="#475569">against a fixed schema</text>

  <!-- controller -->
  <rect x="660" y="96" width="270" height="188" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="682" y="124" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">CONTROLLER (NOT AN LLM)</text>
  <text x="682" y="148" font-size="14" font-weight="800" fill="#0f172a">The security boundary</text>
  <line x1="682" y1="160" x2="908" y2="160" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
  <text x="682" y="182" font-size="12.5" fill="#475569">Stores each extracted value</text>
  <text x="682" y="202" font-size="12.5" fill="#475569">and mints an opaque handle</text>
  <text x="682" y="228" font-size="12.5" font-family="ui-monospace,monospace" fill="#1d4ed8">$VAR2 &#8594; &#8220;...&#8221;</text>
  <text x="682" y="254" font-size="12.5" fill="#475569">Passes the handle onward;</text>
  <text x="682" y="274" font-size="12.5" fill="#475569">never the underlying text</text>

  <!-- privileged LLM -->
  <rect x="970" y="96" width="190" height="188" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="2.5"/>
  <text x="992" y="124" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">PRIVILEGED LLM</text>
  <text x="992" y="148" font-size="14" font-weight="800" fill="#0f172a">Holds the tools</text>
  <line x1="992" y1="160" x2="1138" y2="160" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1"/>
  <text x="992" y="182" font-size="12.5" fill="#475569">Sees the user request</text>
  <text x="992" y="202" font-size="12.5" fill="#475569">and opaque handles</text>
  <text x="992" y="228" font-size="12.5" fill="#475569">Sends mail, writes</text>
  <text x="992" y="248" font-size="12.5" fill="#475569">records, calls APIs</text>
  <text x="992" y="274" font-size="12.5" font-weight="700" fill="#0f766e">Never reads raw text</text>

  <path d="M290 142 L326 142" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#dualArrow)"/>
  <path d="M620 190 L656 190" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#dualArrow)"/>
  <path d="M930 190 L966 190" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#dualArrow)"/>

  <!-- blocked direct path -->
  <path d="M480 296 L480 330 L1065 330 L1065 296" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
  <path d="M760 330 L780 330" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#dualStop)"/>
  <text x="772" y="356" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">This path must not exist &#8212; raw quarantined output never reaches the privileged model</text>

  <!-- footer -->
  <rect x="40" y="382" width="1120" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="406" font-size="13" font-weight="800" fill="#0f172a">Why the controller matters</text>
  <text x="62" y="428" font-size="12.5" fill="#475569">A schema constrains the shape of the quarantined output, not the contents of its string fields. Passing a schema-valid JSON</text>
  <text x="62" y="448" font-size="12.5" fill="#475569">object straight into the privileged model reopens the exact channel the pattern exists to close.</text>
</svg>
