<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="560" fill="#ffffff" />

  <defs>
    <g id="icon-cert">
      <rect x="15" y="15" width="70" height="70" rx="8" fill="#ffffff" fill-opacity="0.22" />
      <line x1="28" y1="35" x2="72" y2="35" stroke="#ffffff" stroke-width="5" />
      <line x1="28" y1="48" x2="72" y2="48" stroke="#ffffff" stroke-width="5" />
      <path d="M40 62 l10 10 l20 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g id="check-badge">
      <circle r="18" fill="#0f766e" />
      <path d="M-8 0 l6 6 l10 -12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>

  <!-- Root CA, already in trust store -->
  <rect x="190" y="20" width="320" height="70" rx="12" fill="#193e9f" />
  <use href="#icon-cert" transform="translate(205,32) scale(0.4)" />
  <text x="255" y="52" font-size="17" font-weight="700" fill="#ffffff">Root CA</text>
  <text x="255" y="72" font-size="11.5" fill="#c9d7fb">already trusted — shipped with the OS/browser</text>

  <!-- link 1 -->
  <line x1="350" y1="90" x2="350" y2="170" stroke="#8491a3" stroke-width="2.5" />
  <use href="#check-badge" transform="translate(350,130)" />
  <text x="385" y="123" font-size="13" fill="#111827" text-anchor="start" font-weight="600">① Root's signature verifies</text>
  <text x="385" y="139" font-size="13" fill="#111827" text-anchor="start" font-weight="600">the Intermediate</text>

  <!-- Intermediate CA -->
  <rect x="190" y="170" width="320" height="70" rx="12" fill="#2457d6" />
  <use href="#icon-cert" transform="translate(205,182) scale(0.4)" />
  <text x="255" y="202" font-size="17" font-weight="700" fill="#ffffff">Intermediate CA</text>
  <text x="255" y="222" font-size="11.5" fill="#dbe7ff">signed by the root</text>

  <!-- link 2 -->
  <line x1="350" y1="240" x2="350" y2="320" stroke="#8491a3" stroke-width="2.5" />
  <use href="#check-badge" transform="translate(350,280)" />
  <text x="385" y="273" font-size="13" fill="#111827" text-anchor="start" font-weight="600">② Intermediate's signature</text>
  <text x="385" y="289" font-size="13" fill="#111827" text-anchor="start" font-weight="600">verifies the leaf</text>

  <!-- Leaf cert -->
  <rect x="190" y="320" width="320" height="70" rx="12" fill="#ffffff" stroke="#d7dee7" stroke-width="1.5" />
  <g fill="#e9efff">
    <rect x="205" y="332" width="50" height="38" rx="8" transform="translate(0,3)" />
  </g>
  <path d="M212 337V325a18 18 0 0 1 36 0v12" fill="none" stroke="#193e9f" stroke-width="6" stroke-linecap="round" transform="translate(0,3)" />
  <circle cx="230" cy="353" r="4.5" fill="#193e9f" />
  <text x="270" y="352" font-size="17" font-weight="700" fill="#111827">example.com</text>
  <text x="270" y="372" font-size="11.5" fill="#475569">the leaf certificate — this is who you're actually talking to</text>

  <!-- outcome -->
  <line x1="350" y1="390" x2="350" y2="420" stroke="#8491a3" stroke-width="2.5" />
  <rect x="150" y="420" width="400" height="60" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5" />
  <use href="#check-badge" transform="translate(190,450) scale(0.9)" />
  <text x="220" y="446" font-size="15" font-weight="700" fill="#0f766e">Chain verified — connection trusted</text>
  <text x="220" y="463" font-size="11.5" fill="#0f766e">(also requires: hostname match, not expired, not revoked)</text>
</svg>
