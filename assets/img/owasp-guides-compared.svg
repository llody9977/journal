<svg viewBox="0 0 1200 415" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Choosing among OWASP Top 10, ASVS, and SAMM</title>
  <desc id="description">Use the artifact that matches the question I am trying to answer.</desc>
  <rect width="1200" height="415" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Choosing among OWASP Top 10, ASVS, and SAMM</text>
  <text x="50" y="88" font-size="15" fill="#475569">Use the artifact that matches the question I am trying to answer.</text>
  
    <g>
      <rect x="50" y="135" width="330" height="235" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">AWARENESS</text>
      <text x="75" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">OWASP Top 10</text>
      <text x="75" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Which common web</text>
<text x="75" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">application risks</text>
<text x="75" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">should I recognize?</text>
    </g>

    <g>
      <rect x="435" y="135" width="330" height="235" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="460" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">VERIFICATION</text>
      <text x="460" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">OWASP ASVS</text>
      <text x="460" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Which security</text>
<text x="460" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">requirements can I</text>
<text x="460" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">design and test?</text>
    </g>

    <g>
      <rect x="820" y="135" width="330" height="235" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="845" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">PROGRAM MATURITY</text>
      <text x="845" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">OWASP SAMM</text>
      <text x="845" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">How do I improve</text>
<text x="845" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">software assurance</text>
<text x="845" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">practices over time?</text>
    </g>
    <text x="407" y="258" text-anchor="middle" font-size="26" font-weight="700" fill="#94a3b8">/</text>
    <text x="792" y="258" text-anchor="middle" font-size="26" font-weight="700" fill="#94a3b8">/</text>

</svg>
