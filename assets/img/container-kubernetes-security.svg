<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Container &amp; Kubernetes Security Architecture</title>
  <desc id="description">Container &amp; Kubernetes Security diagram showing Linux Namespaces, cgroups, Pod Security Standards (PSS), K8s RBAC, and Network Policies.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Container &amp; Kubernetes Security</text>
  <text x="50" y="75" font-size="14" fill="#475569">Linux kernel isolation primitives, Pod Security Standards (PSS), K8s RBAC, and Network Policies.</text>
  
  <!-- Linux Kernel Primitives (x=40, w=540, y=105, h=160) -->
  <rect x="40" y="105" width="540" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">LINUX KERNEL ISOLATION PRIMITIVES</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">Process, Mount, &amp; System Calls</text>
  <line x1="60" y1="166" x2="560" y2="166" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">• Namespaces (PID, net, mnt, ipc, uts, user): Process &amp; resource isolation</text>
  <text x="60" y="206" font-size="11.5" font-weight="500" fill="#475569">• Control Groups (cgroups v2): CPU, memory, &amp; I/O resource consumption limits</text>
  <text x="60" y="226" font-size="11.5" font-weight="500" fill="#475569">• Seccomp &amp; AppArmor / SELinux: System call filtering &amp; mandatory access control</text>

  <!-- Kubernetes Security (x=620, w=540, y=105, h=160) -->
  <rect x="620" y="105" width="540" height="160" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="640" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">KUBERNETES WORKLOAD &amp; RBAC HARDENING</text>
  <text x="640" y="155" font-size="14" font-weight="800" fill="#0f172a">Pod Security Standards &amp; Network Policies</text>
  <line x1="640" y1="166" x2="1140" y2="166" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="640" y="186" font-size="11.5" font-weight="500" fill="#475569">• Pod Security Standards (PSS): Privileged, Baseline, &amp; Restricted profile admission</text>
  <text x="640" y="206" font-size="11.5" font-weight="500" fill="#475569">• K8s RBAC: Least-privilege ServiceAccount roles &amp; cluster-role bindings</text>
  <text x="640" y="226" font-size="11.5" font-weight="500" fill="#475569">• Network Policies: Default-deny pod-to-pod ingress &amp; egress microsegmentation</text>

  <!-- Image Scanning & Service Mesh (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">IMAGE SCANNING &amp; SERVICE MESH MTLS</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Container Image Pipeline &amp; In-Cluster Encryption</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="366" font-size="11.5" font-weight="500" fill="#475569">• Image Vulnerability Scanning: Scanning container layers in CI/CD &amp; registry (Trivy / Clair / Grype)</text>
  <text x="60" y="384" font-size="11.5" font-weight="500" fill="#475569">• Minimal Base Images: Distroless &amp; Alpine base images eliminating shell utilities &amp; attack surface</text>
  <text x="60" y="402" font-size="11.5" font-weight="500" fill="#475569">• Service Mesh mTLS: Istio / Linkerd sidecar proxies enforcing mutual TLS &amp; SPIFFE identity verification</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">CONTAINER SECURITY: DISTROLESS BUILD → IMAGE CONTAINER SCANNING → POD SECURITY ADMISSION → SERVICE MESH MTLS</text>
</svg>
