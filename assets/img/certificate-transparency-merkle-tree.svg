<svg viewBox="0 0 1200 745" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Certificate Transparency Merkle tree</title>
  <desc id="description">The signed root commits to every ordered log entry without placing every certificate in the checkpoint.</desc>
  <rect width="1200" height="745" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Certificate Transparency Merkle tree</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">The signed root commits to every ordered log entry without placing every certificate</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">in the checkpoint.</text>
  
    
    <g>
      <rect x="430" y="125" width="340" height="110" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="455" y="156" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">SIGNED CHECKPOINT</text>
      <text x="455" y="190" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Signed Tree Head</text>
      <text x="455" y="230" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">root hash + tree size + timestamp</text>
    </g>
    
    <g>
      <rect x="140" y="330" width="350" height="105" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      
      <text x="165" y="380" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Hash of leaves 0–1</text>
      <text x="165" y="420" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">commits to the left subtree</text>
    </g>
    
    <g>
      <rect x="710" y="330" width="350" height="105" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      
      <text x="735" y="380" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Hash of leaves 2–3</text>
      <text x="735" y="420" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">commits to the right subtree</text>
    </g>
    
    <g>
      <rect x="45" y="535" width="235" height="100" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      
      <text x="70" y="585" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Leaf 0</text>
      <text x="70" y="625" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">precertificate A</text>
    </g>
    
    <g>
      <rect x="320" y="535" width="235" height="100" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      
      <text x="345" y="585" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Leaf 1</text>
      <text x="345" y="625" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">precertificate B</text>
    </g>
    
    <g>
      <rect x="645" y="535" width="235" height="100" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      
      <text x="670" y="585" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Leaf 2</text>
      <text x="670" y="625" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">precertificate C</text>
    </g>
    
    <g>
      <rect x="920" y="535" width="235" height="100" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      
      <text x="945" y="585" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Leaf 3</text>
      <text x="945" y="625" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">precertificate D</text>
    </g>
    
    <path d="M500 320 L560 240" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <path d="M700 240 L770 320" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    
    <path d="M200 525 L270 445" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <path d="M435 525 L370 445" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    
    <path d="M760 525 L820 445" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <path d="M1035 525 L950 445" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <rect x="120" y="690" width="960" height="54" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="723" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">An inclusion proof supplies the neighboring hashes needed to recompute the signed root.</text>
</svg>
