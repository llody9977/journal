<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Certificate Transparency Merkle Hash Tree</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Append-only binary tree hashing leaf certificates pairwise up to a cryptographic Signed Tree Head (STH)</text>

  <!-- Outer Container Panel -->
  <rect x="40" y="110" width="1120" height="490" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />

  <!-- Level 1: Signed Tree Head / Root Hash (x=380, w=440, y=130, h=105) -->
  <rect x="380" y="130" width="440" height="105" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="600" y="155" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb" text-anchor="middle">MERKLE ROOT HASH (RFC 6962 / RFC 9162)</text>
  <text x="600" y="180" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Signed Tree Head (STH)</text>
  <line x1="400" y1="190" x2="800" y2="190" stroke="#bfdbfe" stroke-width="1"/>
  <text x="600" y="210" font-size="11.5" fill="#475569" text-anchor="middle">Root Hash = SHA-256(0x01 || LeftSubtree || RightSubtree)</text>

  <!-- Level 1 Upward Arrows (Intermediate Nodes -> Root) -->
  <path d="M 310 280 L 520 240" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <path d="M 890 280 L 680 240" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>

  <!-- Level 2: Intermediate Subtree Nodes (y=280, h=95) -->
  <!-- Left Subtree Node (x=80 to 540, w=460, center x=310) -->
  <rect x="80" y="280" width="460" height="95" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="310" y="305" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e" text-anchor="middle">INTERMEDIATE NODE (LEFT SUBTREE 0-1)</text>
  <text x="310" y="330" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">N<sub>0-1</sub> = SHA-256(0x01 || N<sub>0</sub> || N<sub>1</sub>)</text>
  <text x="310" y="354" font-size="11.5" fill="#475569" text-anchor="middle">Commits to ordered leaf entries 0 and 1</text>

  <!-- Right Subtree Node (x=660 to 1120, w=460, center x=890) -->
  <rect x="660" y="280" width="460" height="95" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="890" y="305" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e" text-anchor="middle">INTERMEDIATE NODE (RIGHT SUBTREE 2-3)</text>
  <text x="890" y="330" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">N<sub>2-3</sub> = SHA-256(0x01 || N<sub>2</sub> || N<sub>3</sub>)</text>
  <text x="890" y="354" font-size="11.5" fill="#475569" text-anchor="middle">Commits to ordered leaf entries 2 and 3</text>

  <!-- Level 2 Upward Arrows (Leaves -> Intermediate Nodes) -->
  <path d="M 175 425 L 260 380" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M 445 425 L 360 380" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M 755 425 L 840 380" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M 1025 425 L 940 380" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Level 3: Leaf Nodes (4 equal 250px boxes at y=425, h=105) -->
  <!-- Leaf 0 (x=50) -->
  <rect x="50" y="425" width="250" height="105" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="175" y="448" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309" text-anchor="middle">LEAF 0 (ENTRY #0)</text>
  <text x="175" y="472" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Precertificate A</text>
  <text x="175" y="492" font-size="11" fill="#475569" text-anchor="middle">N<sub>0</sub> = SHA-256(0x00 || Leaf0)</text>
  <rect x="75" y="504" width="200" height="20" rx="4" fill="#fde68a"/>
  <text x="175" y="518" font-size="10" font-weight="800" fill="#78350f" text-anchor="middle">Timestamped Log Entry 0</text>

  <!-- Leaf 1 (x=320) -->
  <rect x="320" y="425" width="250" height="105" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="445" y="448" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309" text-anchor="middle">LEAF 1 (ENTRY #1)</text>
  <text x="445" y="472" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Precertificate B</text>
  <text x="445" y="492" font-size="11" fill="#475569" text-anchor="middle">N<sub>1</sub> = SHA-256(0x00 || Leaf1)</text>
  <rect x="345" y="504" width="200" height="20" rx="4" fill="#fde68a"/>
  <text x="445" y="518" font-size="10" font-weight="800" fill="#78350f" text-anchor="middle">Timestamped Log Entry 1</text>

  <!-- Leaf 2 (x=630) -->
  <rect x="630" y="425" width="250" height="105" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="755" y="448" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309" text-anchor="middle">LEAF 2 (ENTRY #2)</text>
  <text x="755" y="472" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Precertificate C</text>
  <text x="755" y="492" font-size="11" fill="#475569" text-anchor="middle">N<sub>2</sub> = SHA-256(0x00 || Leaf2)</text>
  <rect x="655" y="504" width="200" height="20" rx="4" fill="#fde68a"/>
  <text x="755" y="518" font-size="10" font-weight="800" fill="#78350f" text-anchor="middle">Timestamped Log Entry 2</text>

  <!-- Leaf 3 (x=900) -->
  <rect x="900" y="425" width="250" height="105" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1025" y="448" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309" text-anchor="middle">LEAF 3 (ENTRY #3)</text>
  <text x="1025" y="472" font-size="13.5" font-weight="800" fill="#0f172a" text-anchor="middle">Precertificate D</text>
  <text x="1025" y="492" font-size="11" fill="#475569" text-anchor="middle">N<sub>3</sub> = SHA-256(0x00 || Leaf3)</text>
  <rect x="925" y="504" width="200" height="20" rx="4" fill="#fde68a"/>
  <text x="1025" y="518" font-size="10" font-weight="800" fill="#78350f" text-anchor="middle">Timestamped Log Entry 3</text>

  <!-- Summary Footer -->
  <rect x="50" y="545" width="1100" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600" y="571" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Summary: Inclusion proof (O(log N)) supplies audit path neighbor hashes to recompute the Signed Tree Head.</text>
</svg>
