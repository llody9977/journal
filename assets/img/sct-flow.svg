<svg viewBox="0 0 1200 415" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Signed Certificate Timestamps (SCT) Workflow &amp; CT Log Auditing</title>
  <desc id="description">Submitting pre-certificates to independent CT logs, receiving SCTs, and verifying inclusion via browser policies</desc>
  <rect width="1200" height="415" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Signed Certificate Timestamps (SCT) Workflow &amp; CT Log Auditing</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Common Embedded-SCT Workflow (RFC 6962 / RFC 9162): submitting pre-certificates to CT logs and verifying via browser CT policies</text>
  
  <g>
    <!-- Top Row: 4 Sequential Workflow Steps (245px wide boxes, 40px gaps) -->
    <!-- Step 1: Pre-Cert Submission (x=50 to 295, w=245) -->
    <rect x="50" y="110" width="245" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="65" y="136" font-size="10.5" font-weight="900" letter-spacing="0.5" fill="#2563eb">STEP 1: CERTIFICATE AUTHORITY</text>
    <text x="65" y="158" font-size="13.5" font-weight="800" fill="#0f172a">Submit Pre-Certificate</text>
    <text x="65" y="180" font-size="11.5" font-weight="500" fill="#475569">CA sends pre-cert payload to</text>
    <text x="65" y="196" font-size="11.5" font-weight="600" fill="#2563eb">≥ 2 Independent CT Logs</text>

    <!-- Connector 1 -> 2 (x=295 to 335) -->
    <path d="M 300 160 L 330 160" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <!-- Step 2: CT Log SCT Return (x=335 to 580, w=245) -->
    <rect x="335" y="110" width="245" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="350" y="136" font-size="10.5" font-weight="900" letter-spacing="0.5" fill="#b45309">STEP 2: CT LOG SERVERS</text>
    <text x="350" y="158" font-size="13.5" font-weight="800" fill="#0f172a">Generate &amp; Return SCT</text>
    <text x="350" y="180" font-size="11.5" font-weight="500" fill="#475569">Log signs a promise to include —</text>
    <text x="350" y="196" font-size="11.5" font-weight="600" fill="#b45309">actual Merkle append follows within MMD</text>

    <!-- Connector 2 -> 3 (x=580 to 620) -->
    <path d="M 585 160 L 615 160" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-amber)"/>

    <!-- Step 3: SCT Embedding (x=620 to 865, w=245) -->
    <rect x="620" y="110" width="245" height="100" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="635" y="136" font-size="10.5" font-weight="900" letter-spacing="0.5" fill="#0f766e">STEP 3: ISSUANCE &amp; EMBEDDING</text>
    <text x="635" y="158" font-size="13.5" font-weight="800" fill="#0f172a">Embed SCT Extension</text>
    <text x="635" y="180" font-size="11.5" font-weight="500" fill="#475569">CA embeds SCTs directly into</text>
    <text x="635" y="196" font-size="11.5" font-weight="600" fill="#0f766e">Final X.509 Certificate</text>

    <!-- Connector 3 -> 4 (x=865 to 905) -->
    <path d="M 870 160 L 900 160" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <!-- Step 4: Browser Verification (x=905 to 1150, w=245) -->
    <rect x="905" y="110" width="245" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="920" y="136" font-size="10.5" font-weight="900" letter-spacing="0.5" fill="#2563eb">STEP 4: CLIENT BROWSER</text>
    <text x="920" y="158" font-size="13.5" font-weight="800" fill="#0f172a">Enforce CT Policy</text>
    <text x="920" y="180" font-size="11.5" font-weight="500" fill="#475569">Verifies SCT Count &amp; Diversity</text>
    <text x="920" y="196" font-size="11.5" font-weight="700" fill="#2563eb">Per Chrome/Apple CT Policy</text>

    <!-- Bottom Card: Delivery Methods & Protection -->
    <rect x="50" y="240" width="1100" height="170" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
    <text x="70" y="268" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">SCT DELIVERY METHODS &amp; BROWSER ENFORCEMENT</text>
    <text x="70" y="294" font-size="15" font-weight="800" fill="#0f172a">3 Approved SCT Delivery Methods in TLS Connections:</text>
    <text x="70" y="320" font-size="12.5" font-weight="600" fill="#0f172a">1. X.509 Extension (Most Common): CA bakes SCTs directly into certificate extensions during issuance.</text>
    <text x="70" y="342" font-size="12.5" font-weight="600" fill="#0f172a">2. TLS Extension (signed_certificate_timestamp): Transmitted in TLS handshake (TLS 1.3 Certificate extension / TLS 1.2 ServerHello).</text>
    <text x="70" y="364" font-size="12.5" font-weight="600" fill="#0f172a">3. OCSP Stapling: Web server includes SCTs wrapped inside the signed OCSP response stapling payload.</text>
    <text x="70" y="392" font-size="12" font-weight="700" fill="#0f766e">Browser Enforcement: Publicly trusted TLS server certificates lacking valid SCTs are rejected by Chrome/Apple root program CT policies.</text>
  </g>
</svg>
