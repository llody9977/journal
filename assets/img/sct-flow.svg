<svg viewBox="0 0 740 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="740" height="340" fill="#ffffff" />

  <defs>
    <marker id="ah9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491a3" />
    </marker>
  </defs>

  <!-- CA -->
  <rect x="20" y="40" width="140" height="46" rx="8" fill="#193e9f" />
  <text x="90" y="68" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CA</text>

  <path d="M160 63 L280 63" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah9)" />
  <text x="220" y="53" font-size="11" fill="#475569" text-anchor="middle">submits pre-cert</text>

  <!-- CT Logs -->
  <rect x="285" y="40" width="170" height="46" rx="8" fill="#0f766e" />
  <text x="370" y="60" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Independent CT logs</text>
  <text x="370" y="76" font-size="10" fill="#d3ece7" text-anchor="middle">append-only Merkle tree</text>

  <path d="M370 86 L370 115" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah9)" />

  <rect x="270" y="120" width="200" height="46" rx="8" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="370" y="142" font-size="11.5" font-weight="700" fill="#a14c00" text-anchor="middle">returns a signed SCT</text>
  <text x="370" y="157" font-size="10" fill="#a14c00" text-anchor="middle">"promise to log within max merge delay"</text>

  <path d="M280 143 L160 108" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah9)" />
  <text x="180" y="100" font-size="10.5" fill="#475569" text-anchor="middle">back to CA</text>

  <!-- CA embeds -->
  <rect x="20" y="115" width="140" height="46" rx="8" fill="#193e9f" />
  <text x="90" y="135" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">CA embeds SCT(s)</text>
  <text x="90" y="150" font-size="10" fill="#c9d7fb" text-anchor="middle">into final certificate</text>

  <path d="M90 161 L90 220" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah9)" />

  <!-- Certificate delivered -->
  <rect x="20" y="225" width="180" height="46" rx="8" fill="#9f1239" />
  <text x="110" y="245" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Certificate + SCT(s)</text>
  <text x="110" y="260" font-size="10" fill="#fbd9df" text-anchor="middle">sent to the connecting browser</text>

  <path d="M200 248 L500 248" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah9)" />

  <rect x="505" y="225" width="215" height="80" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5" />
  <text x="612" y="248" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">Browser applies its CT policy:</text>
  <text x="612" y="266" font-size="10.5" fill="#0f766e" text-anchor="middle">required SCT count, log operators,</text>
  <text x="612" y="280" font-size="10.5" fill="#0f766e" text-anchor="middle">and accepted delivery methods depend</text>
  <text x="612" y="296" font-size="10.5" fill="#0f766e" text-anchor="middle">on browser policy and cert lifetime</text>

  <text x="370" y="325" font-size="11" fill="#8491a3" text-anchor="middle">An SCT is a promise of inclusion; monitors and consistency checks are still needed to detect omissions or split views</text>
</svg>
