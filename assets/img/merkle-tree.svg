<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="320" fill="#ffffff" />

  <!-- connectors drawn first -->
  <g stroke="#8491a3" stroke-width="2" fill="none">
    <path d="M100 260 L175 200" />
    <path d="M250 260 L175 200" />
    <path d="M400 260 L475 200" />
    <path d="M550 260 L475 200" />
    <path d="M175 180 L325 110" />
    <path d="M475 180 L325 110" />
  </g>

  <!-- Root -->
  <rect x="255" y="30" width="140" height="50" rx="8" fill="#193e9f" />
  <text x="325" y="52" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Merkle Root</text>
  <text x="325" y="68" font-size="9.5" fill="#c9d7fb" text-anchor="middle">hash(H12 + H34)</text>
  <text x="325" y="20" font-size="11" fill="#475569" text-anchor="middle">stored in the block header</text>

  <!-- level 2 -->
  <rect x="105" y="150" width="140" height="42" rx="8" fill="#2457d6" />
  <text x="175" y="171" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">H12 = hash(H1+H2)</text>

  <rect x="405" y="150" width="140" height="42" rx="8" fill="#2457d6" />
  <text x="475" y="171" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">H34 = hash(H3+H4)</text>

  <!-- level 1: leaf hashes -->
  <rect x="35" y="220" width="130" height="42" rx="8" fill="#0f766e" />
  <text x="100" y="246" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">H1 = hash(Tx1)</text>

  <rect x="185" y="220" width="130" height="42" rx="8" fill="#0f766e" />
  <text x="250" y="246" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">H2 = hash(Tx2)</text>

  <rect x="335" y="220" width="130" height="42" rx="8" fill="#0f766e" />
  <text x="400" y="246" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">H3 = hash(Tx3)</text>

  <rect x="485" y="220" width="130" height="42" rx="8" fill="#0f766e" />
  <text x="550" y="246" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">H4 = hash(Tx4)</text>

  <!-- transactions -->
  <text x="100" y="292" font-size="11.5" fill="#111827" text-anchor="middle">Tx1</text>
  <text x="250" y="292" font-size="11.5" fill="#111827" text-anchor="middle">Tx2</text>
  <text x="400" y="292" font-size="11.5" fill="#111827" text-anchor="middle">Tx3</text>
  <text x="550" y="292" font-size="11.5" fill="#111827" text-anchor="middle">Tx4</text>

  <text x="350" y="312" font-size="11" fill="#8491a3" text-anchor="middle">Change one bit of Tx3 → H3 changes → H34 changes → the Root changes</text>
</svg>
