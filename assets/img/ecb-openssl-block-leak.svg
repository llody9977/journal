<svg viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">AES-128-ECB Block Pattern Leakage Breakdown</title>
  <desc id="description">Identical 16-byte plaintext blocks produce identical 16-byte hex ciphertext outputs (ecb_leak.py)</desc>
  <rect width="1200" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">AES-128-ECB Block Pattern Leakage Breakdown</text>
  <text x="50" y="88" font-size="16" fill="#475569">Identical 16-byte plaintext blocks produce identical 16-byte hex ciphertext outputs (ecb_leak.py)</text>
  
    <g>
      <!-- Row 1: Block 1 -->
      <rect x="50" y="110" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="65" y="136" font-size="13" font-weight="700" fill="#0f172a">Block 1: "ATTACKATDAWN1234"</text>

      <path d="M350 132 L440 132" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
      <text x="395" y="125" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">AES-ECB(K)</text>

      <rect x="445" y="110" width="705" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="460" y="136" font-size="13" font-family="monospace" font-weight="800" fill="#b91c1c">f443 167b d98b 197e 88e7 a6fd c7c0 1f50  [HEX BLOCK 1]</text>

      <!-- Row 2: Block 2 -->
      <rect x="50" y="165" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="65" y="191" font-size="13" font-weight="700" fill="#0f172a">Block 2: "ATTACKATDAWN1234"</text>

      <path d="M350 187 L440 187" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
      <text x="395" y="180" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">AES-ECB(K)</text>

      <rect x="445" y="165" width="705" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="460" y="191" font-size="13" font-family="monospace" font-weight="800" fill="#b91c1c">f443 167b d98b 197e 88e7 a6fd c7c0 1f50  [DUPLICATE MATCH]</text>

      <!-- Row 3: Block 3 -->
      <rect x="50" y="220" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="65" y="246" font-size="13" font-weight="700" fill="#0f172a">Block 3: "ATTACKATDAWN1234"</text>

      <path d="M350 242 L440 242" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
      <text x="395" y="235" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">AES-ECB(K)</text>

      <rect x="445" y="220" width="705" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="460" y="246" font-size="13" font-family="monospace" font-weight="800" fill="#b91c1c">f443 167b d98b 197e 88e7 a6fd c7c0 1f50  [DUPLICATE MATCH]</text>

      <!-- Row 4: Block 4 -->
      <rect x="50" y="275" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="65" y="301" font-size="13" font-weight="700" fill="#0f172a">Block 4: "ATTACKATDAWN1234"</text>

      <path d="M350 297 L440 297" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
      <text x="395" y="290" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">AES-ECB(K)</text>

      <rect x="445" y="275" width="705" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="460" y="301" font-size="13" font-family="monospace" font-weight="800" fill="#b91c1c">f443 167b d98b 197e 88e7 a6fd c7c0 1f50  [DUPLICATE MATCH]</text>
    </g>
</svg>
