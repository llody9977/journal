<svg viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Conceptual DNSSEC validation chain</title>
  <desc id="description">The validating resolver begins with a configured root trust anchor, verifies the root DNSKEY and the DS record for dot gov, verifies the dot gov DNSKEY and the DS record for nist.gov, then uses the authenticated nist.gov DNSKEY to verify the RRSIG covering the requested RRset.</desc>
  <rect width="1000" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
    <g id="key-dark">
      <circle cx="18" cy="18" r="11" fill="none" stroke="#0f766e" stroke-width="5"/>
      <path d="M29 18 H56 M45 18 V28 M53 18 V25" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <text x="45" y="52" font-size="28" font-weight="850" fill="#0f172a">DNSSEC validation chain</text>
  <text x="45" y="80" font-size="14.5" fill="#475569">A validator authenticates parent-to-child delegation data before verifying the answer RRset.</text>

  <rect x="45" y="125" width="250" height="285" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="70" y="158" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">VALIDATING RESOLVER</text>
  <use href="#key-dark" transform="translate(72 187)"/>
  <text x="70" y="255" font-size="19" font-weight="800" fill="#0f172a">Configured trust anchor</text>
  <text x="70" y="286" font-size="14" fill="#475569">Starts with trusted root</text>
  <text x="70" y="309" font-size="14" fill="#475569">DNSKEY information</text>
  <text x="70" y="344" font-size="14" fill="#475569">Classifies the result as</text>
  <text x="70" y="367" font-size="14" fill="#475569">secure, insecure, bogus,</text>
  <text x="70" y="390" font-size="14" fill="#475569">or indeterminate</text>

  <rect x="370" y="110" width="260" height="105" rx="16" fill="#193e9f"/>
  <text x="395" y="143" font-size="12" font-weight="900" letter-spacing="1" fill="#c9d7fb">ROOT ZONE (.)</text>
  <text x="395" y="177" font-size="18" font-weight="800" fill="#ffffff">DNSKEY authenticates DS</text>
  <text x="395" y="200" font-size="13" fill="#dbe7ff">Parent publishes DS for .gov</text>

  <rect x="370" y="250" width="260" height="105" rx="16" fill="#2457d6"/>
  <text x="395" y="283" font-size="12" font-weight="900" letter-spacing="1" fill="#dbe7ff">.GOV ZONE</text>
  <text x="395" y="317" font-size="18" font-weight="800" fill="#ffffff">DNSKEY authenticates DS</text>
  <text x="395" y="340" font-size="13" fill="#dbe7ff">Parent publishes DS for nist.gov</text>

  <rect x="705" y="180" width="250" height="205" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="730" y="213" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">NIST.GOV ZONE</text>
  <use href="#key-dark" transform="translate(732 232)"/>
  <text x="730" y="300" font-size="18" font-weight="800" fill="#0f172a">Authenticated DNSKEY</text>
  <text x="730" y="332" font-size="13.5" fill="#475569">Verifies the RRSIG that</text>
  <text x="730" y="354" font-size="13.5" fill="#475569">covers the requested RRset</text>

  <path d="M303 220 C330 220 335 162 362 162" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M500 223 L500 242" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M638 302 C666 302 674 282 697 282" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="500" y="470" text-anchor="middle" font-size="13" fill="#64748b">Conceptual protocol relationship—not a certificate-authority hierarchy. Operational key-role splits may vary by zone.</text>
</svg>
