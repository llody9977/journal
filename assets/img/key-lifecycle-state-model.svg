<svg viewBox="0 0 390 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Key Lifecycle State Model</title>
  <desc id="description">A journal working model showing generation or import, pre-active, active, disabled, deactivated, compromised, controlled recovery, and destroyed states, including reversible and irreversible transitions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="390" height="900" fill="#ffffff"/>
  <text x="22" y="36" font-size="21" font-weight="850" fill="#0f172a">Key Lifecycle State Model</text>
  <text x="22" y="60" font-size="12.5" fill="#475569">Journal working model — provider terminology varies</text>

  <rect x="46" y="88" width="298" height="72" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="195" y="117" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Generate or Import</text>
  <text x="195" y="140" text-anchor="middle" font-size="12.5" fill="#475569">Provenance, purpose, owner, attributes</text>
  <path d="M195 160 L195 194" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="46" y="205" width="298" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="234" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Pre-Active</text>
  <text x="195" y="258" text-anchor="middle" font-size="12.5" fill="#475569">No normal cryptographic operations</text>
  <path d="M195 281 L195 315" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="46" y="326" width="298" height="82" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/>
  <text x="195" y="356" text-anchor="middle" font-size="17" font-weight="850" fill="#0f766e">Active</text>
  <text x="195" y="381" text-anchor="middle" font-size="12.5" fill="#475569">Apply and/or process protection as authorized</text>

  <path d="M105 408 L105 448" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M285 408 L285 448" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <path d="M46 368 C8 368 8 647 20 647" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="11" y="593" font-size="11" fill="#475569" transform="rotate(-90 11 593)">normal deactivation</text>

  <rect x="20" y="459" width="170" height="90" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="105" y="487" text-anchor="middle" font-size="16" font-weight="800" fill="#92400e">Disabled / Suspended</text>
  <text x="105" y="511" text-anchor="middle" font-size="12" fill="#475569">Reversible investigation</text>
  <text x="105" y="530" text-anchor="middle" font-size="12" fill="#475569">or impact test</text>

  <rect x="200" y="459" width="170" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="285" y="487" text-anchor="middle" font-size="16" font-weight="800" fill="#991b1b">Compromised</text>
  <text x="285" y="511" text-anchor="middle" font-size="12" fill="#475569">No new protective use</text>
  <text x="285" y="530" text-anchor="middle" font-size="12" fill="#475569">Incident controls apply</text>

  <path d="M72 459 C36 435 36 370 46 370" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="28" y="419" font-size="11" fill="#0f766e" transform="rotate(-90 28 419)">approved restore</text>
  <path d="M105 549 L105 593" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M285 549 L285 593" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <rect x="20" y="604" width="170" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="105" y="634" text-anchor="middle" font-size="16" font-weight="800" fill="#334155">Deactivated</text>
  <text x="105" y="658" text-anchor="middle" font-size="12" fill="#475569">Historical processing only</text>
  <text x="105" y="676" text-anchor="middle" font-size="12" fill="#475569">where policy permits</text>

  <rect x="200" y="604" width="170" height="86" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="285" y="634" text-anchor="middle" font-size="16" font-weight="800" fill="#92400e">Controlled Recovery</text>
  <text x="285" y="658" text-anchor="middle" font-size="12" fill="#475569">Minimum exceptional use</text>
  <text x="285" y="676" text-anchor="middle" font-size="12" fill="#475569">under incident decision</text>

  <path d="M105 690 L105 744 L195 744 L195 771" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M285 690 L285 744 L195 744" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="195" y="732" text-anchor="middle" font-size="11.5" fill="#475569">dependencies cleared or loss accepted</text>

  <rect x="46" y="782" width="298" height="76" rx="10" fill="#0f172a" stroke="#020617" stroke-width="2"/>
  <text x="195" y="812" text-anchor="middle" font-size="17" font-weight="850" fill="#ffffff">Destroyed</text>
  <text x="195" y="836" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Usable key material irreversibly gone</text>
  <text x="195" y="882" text-anchor="middle" font-size="12" fill="#475569">Metadata and evidence may remain after destruction.</text>
</svg>
