<svg viewBox="0 0 1200 315" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="hmf-title hmf-desc">
  <title id="hmf-title">HMAC dual-nested key hashing pipeline</title>
  <desc id="hmf-desc">HMAC builds a message authentication code from a cryptographic hash function such as SHA-256 using two key-padding passes. The inner pass hashes the normalized key XORed with the inner pad 0x36, concatenated with the message. The outer pass hashes the normalized key XORed with the outer pad 0x5c, concatenated with the inner hash result. The final tag provides integrity and shared-key authentication: a valid tag establishes that some holder of the shared key produced it, not which holder.</desc>
  <rect width="1200" height="315" fill="#ffffff"/>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">HMAC Dual-Nested Key Hashing Pipeline</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Constructs a secure MAC from a suitable cryptographic hash function (e.g., SHA-256) via inner (ipad) and outer (opad) key-padding passes</text>

  <!-- Outer Panel Container (1120px wide, equal 50px margins inside) -->
  <rect x="40" y="110" width="1120" height="170" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />

  <!-- Stage 1 (300px wide, x=90 to 390) -->
  <rect x="90" y="130" width="300" height="130" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="105" y="152" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">1. INNER HASH PASS</text>
  <text x="105" y="174" font-size="13" font-weight="800" fill="#0f172a">Key K₀ ⊕ ipad (0x36)</text>
  <text x="105" y="192" font-size="11.5" fill="#475569">• Prepend padded key share</text>
  <rect x="105" y="208" width="270" height="36" rx="6" fill="#ccfbf1"/>
  <text x="240" y="231" font-size="11.5" font-weight="800" fill="#0f766e" text-anchor="middle">H((K₀ ⊕ ipad) || M)</text>

  <!-- Connector 1 -> 2 (60px gap, x=390 to 450) -->
  <path d="M 395 195 L 445 195" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Stage 2 (300px wide, x=450 to 750) -->
  <rect x="450" y="130" width="300" height="130" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="465" y="152" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">2. OUTER HASH PASS</text>
  <text x="465" y="174" font-size="13" font-weight="800" fill="#0f172a">Key K₀ ⊕ opad (0x5c)</text>
  <text x="465" y="192" font-size="11.5" fill="#475569">• Prepend outer key share</text>
  <rect x="465" y="208" width="270" height="36" rx="6" fill="#ccfbf1"/>
  <text x="600" y="231" font-size="11.5" font-weight="800" fill="#0f766e" text-anchor="middle">H((K₀ ⊕ opad) || InnerHash)</text>

  <!-- Connector 2 -> 3 (60px gap, x=750 to 810) -->
  <path d="M 755 195 L 805 195" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Stage 3 (300px wide, x=810 to 1110) -->
  <rect x="810" y="130" width="300" height="130" rx="10" fill="#0f766e"/>
  <text x="960" y="152" font-size="11" font-weight="900" letter-spacing="1" fill="#ccfbf1" text-anchor="middle">3. FINAL RESULT</text>
  <text x="960" y="176" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">HMAC-SHA256 Tag</text>
  <line x1="830" y1="188" x2="1090" y2="188" stroke="#5eead4" stroke-width="1"/>
  <text x="960" y="208" font-size="11" fill="#ccfbf1" text-anchor="middle">Integrity + Shared-Key Authentication</text>
  <text x="960" y="226" font-size="11" fill="#ccfbf1" text-anchor="middle">Valid Tag: Some Holder of K</text>
</svg>
