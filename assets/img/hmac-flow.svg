<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="720" height="280" fill="#ffffff" />

  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491a3" />
    </marker>
  </defs>

  <!-- Sender side -->
  <text x="130" y="25" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Sender (has key K)</text>
  <rect x="30" y="40" width="200" height="36" rx="6" fill="#e9efff" stroke="#2457d6" stroke-width="1.5" />
  <text x="130" y="63" font-size="12" fill="#193e9f" text-anchor="middle" font-family="ui-monospace,monospace">message + key K</text>

  <path d="M130 76 L130 105" stroke="#8491a3" stroke-width="2.5" fill="none" marker-end="url(#ah3)" />

  <rect x="55" y="110" width="150" height="40" rx="8" fill="#193e9f" />
  <text x="130" y="135" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">HMAC-SHA256</text>

  <path d="M130 150 L130 175" stroke="#8491a3" stroke-width="2.5" fill="none" marker-end="url(#ah3)" />

  <rect x="45" y="180" width="170" height="34" rx="6" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="130" y="202" font-size="12" font-weight="700" fill="#a14c00" text-anchor="middle">tag = 8f3a...c21</text>

  <!-- transmitted over the wire -->
  <path d="M235 130 L470 130" stroke="#8491a3" stroke-width="2.5" fill="none" marker-end="url(#ah3)" />
  <text x="350" y="115" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">sends: message + tag</text>
  <text x="350" y="150" font-size="10.5" fill="#475569" text-anchor="middle">(over an untrusted network)</text>

  <!-- Receiver side -->
  <text x="600" y="25" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Receiver (also has key K)</text>
  <rect x="500" y="40" width="200" height="36" rx="6" fill="#e9efff" stroke="#2457d6" stroke-width="1.5" />
  <text x="600" y="63" font-size="12" fill="#193e9f" text-anchor="middle" font-family="ui-monospace,monospace">message + key K</text>

  <path d="M600 76 L600 105" stroke="#8491a3" stroke-width="2.5" fill="none" marker-end="url(#ah3)" />

  <rect x="525" y="110" width="150" height="40" rx="8" fill="#193e9f" />
  <text x="600" y="135" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">HMAC-SHA256</text>

  <path d="M600 150 L600 175" stroke="#8491a3" stroke-width="2.5" fill="none" marker-end="url(#ah3)" />

  <rect x="515" y="180" width="170" height="34" rx="6" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="600" y="202" font-size="12" font-weight="700" fill="#a14c00" text-anchor="middle">recomputed tag</text>

  <!-- compare -->
  <path d="M215 197 L510 197" stroke="#8491a3" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="290" y="230" width="150" height="36" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5" />
  <text x="365" y="253" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">tags match? ✓ trusted</text>
</svg>
