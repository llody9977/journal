<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Threat Hunting &amp; Behavioral Analytics Architecture</title>
  <desc id="description">Threat Hunting diagram showing PEAK hunting framework, UEBA behavioral baselining, hypothesis generation, and post-hunt rule operationalization.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Threat Hunting &amp; Behavioral Analytics</text>
  <text x="50" y="75" font-size="14" fill="#475569">Proactive hypothesis-driven hunting, PEAK methodology, UEBA anomaly detection, and post-hunt rule operationalization.</text>
  
  <!-- PEAK Hunting Framework (x=40, w=540, y=105, h=160) -->
  <rect x="40" y="105" width="540" height="160" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#7c3aed">PEAK THREAT HUNTING FRAMEWORK</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">3 Primary Threat Hunting Core Types</text>
  <line x1="60" y1="166" x2="560" y2="166" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">1. Hypothesis-Driven Hunting: Formulates testable adversary behavior</text>
  <text x="60" y="206" font-size="11.5" font-weight="500" fill="#475569">2. Baseline / EDR-Driven Hunting: Queries telemetry for rare outliers</text>
  <text x="60" y="226" font-size="11.5" font-weight="500" fill="#475569">3. Model-Assisted Threat Hunting (MASH): ML clustering &amp; analytics</text>

  <!-- UEBA & Behavioral Baselining (x=620, w=540, y=105, h=160) -->
  <rect x="620" y="105" width="540" height="160" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="640" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">USER &amp; ENTITY BEHAVIOR ANALYTICS (UEBA)</text>
  <text x="640" y="155" font-size="14" font-weight="800" fill="#0f172a">Statistical Profiling &amp; Anomaly Detection</text>
  <line x1="640" y1="166" x2="1140" y2="166" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="640" y="186" font-size="11.5" font-weight="500" fill="#475569">• Peer Group Analysis: Comparing user activity against role baseline</text>
  <text x="640" y="206" font-size="11.5" font-weight="500" fill="#475569">• Time-Series Anomaly: Off-hours authentication &amp; unusual volume</text>
  <text x="640" y="226" font-size="11.5" font-weight="500" fill="#475569">• Rare Process Execution: First-seen binary in enterprise environment</text>

  <!-- Post-Hunt Transition (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">POST-HUNT OPERATIONALIZATION &amp; LIFECYCLE</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Converting Hunt Findings to Automated Detections</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="366" font-size="11.5" font-weight="500" fill="#475569">1. Formulate Hypothesis → 2. Query Telemetry &amp; EDR → 3. Validate Finding &amp; Identify Root Cause</text>
  <text x="60" y="384" font-size="11.5" font-weight="500" fill="#475569">4. Document Hunt Playbook → 5. Write Durable Sigma Rule → 6. Deploy to SIEM Production Engine</text>
  <text x="60" y="402" font-size="11.5" font-weight="500" fill="#475569">Outcome: Proactive discovery of un-alerted adversary activity directly feeds automated detection engineering.</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">HUNTING LIFECYCLE: CTI TRIGGER → PEAK HYPOTHESIS → BEHAVIORAL TELEMETRY QUERY → ANOMALY VALIDATION → DAC RULE CREATION</text>
</svg>
