<svg viewBox="0 0 1200 610" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Security Objectives, Domain Scopes, Risk Decisions, and Control Execution</title>
  <desc id="description">Journal working model showing a directional relationship rather than nested containment: core security objectives inform overlapping information security, cybersecurity, and system security engineering scopes; risk management selects responses; security controls implement them; and monitoring evidence and residual risk feed reassessment.</desc>
  <rect width="1200" height="610" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Security Objectives, Domain Scopes, Risk Decisions &amp; Controls</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Journal working model: related engineering concerns, not progressively nested scopes.</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">Objectives define outcomes; domains establish context; risk decisions select responses; controls implement and produce evidence.</text>

  <!-- Stage 1: Core objectives -->
  <rect x="40" y="140" width="230" height="300" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="60" y="170" font-size="11" font-weight="900" letter-spacing="1.2" fill="#7c3aed">1. CORE OUTCOMES</text>
  <text x="60" y="198" font-size="17" font-weight="800" fill="#0f172a">Security Objectives</text>
  <line x1="60" y1="212" x2="250" y2="212" stroke="#7c3aed" stroke-opacity="0.35"/>
  <text x="60" y="242" font-size="13" font-weight="800" fill="#0f172a">Confidentiality</text>
  <text x="60" y="263" font-size="11.5" fill="#475569">Authorized disclosure boundaries</text>
  <text x="60" y="297" font-size="13" font-weight="800" fill="#0f172a">Integrity</text>
  <text x="60" y="318" font-size="11.5" fill="#475569">Protection from improper change</text>
  <text x="60" y="352" font-size="13" font-weight="800" fill="#0f172a">Availability</text>
  <text x="60" y="373" font-size="11.5" fill="#475569">Timely, reliable authorized use</text>
  <text x="60" y="407" font-size="9.6" font-weight="700" fill="#7c3aed">Plus applicable extended properties</text>

  <!-- Stage 2: Overlapping domain scopes -->
  <rect x="320" y="140" width="280" height="300" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="340" y="170" font-size="11" font-weight="900" letter-spacing="1.2" fill="#2563eb">2. APPLICABLE CONTEXT</text>
  <text x="340" y="198" font-size="15.5" font-weight="800" fill="#0f172a">Overlapping Domain Scopes</text>
  <line x1="340" y1="212" x2="580" y2="212" stroke="#2563eb" stroke-opacity="0.35"/>
  <rect x="340" y="232" width="240" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.55"/>
  <text x="355" y="254" font-size="12.5" font-weight="800" fill="#0f172a">Information Security</text>
  <text x="355" y="272" font-size="10.8" fill="#475569">Information in any relevant form</text>
  <rect x="340" y="298" width="240" height="52" rx="10" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.65"/>
  <text x="355" y="320" font-size="12.5" font-weight="800" fill="#0f172a">Cybersecurity</text>
  <text x="355" y="338" font-size="10.8" fill="#475569">Digital systems and cyberspace threats</text>
  <rect x="340" y="364" width="240" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.65"/>
  <text x="355" y="386" font-size="12.5" font-weight="800" fill="#0f172a">System Security Engineering</text>
  <text x="355" y="404" font-size="10.8" fill="#475569">Lifecycle architecture and assurance</text>

  <!-- Stage 3: Risk decisions -->
  <rect x="650" y="140" width="230" height="300" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="670" y="170" font-size="11" font-weight="900" letter-spacing="1.2" fill="#b45309">3. DECISION ENGINE</text>
  <text x="670" y="198" font-size="17" font-weight="800" fill="#0f172a">Risk Management</text>
  <line x1="670" y1="212" x2="860" y2="212" stroke="#b45309" stroke-opacity="0.35"/>
  <text x="670" y="242" font-size="12.5" font-weight="800" fill="#0f172a">Frame the context</text>
  <text x="670" y="267" font-size="12.5" font-weight="800" fill="#0f172a">Assess exposure and harm</text>
  <text x="670" y="292" font-size="12.5" font-weight="800" fill="#0f172a">Select a response</text>
  <text x="686" y="316" font-size="11.2" fill="#475569">• Accept or Avoid</text>
  <text x="686" y="338" font-size="11.2" fill="#475569">• Mitigate</text>
  <text x="686" y="360" font-size="11.2" fill="#475569">• Share or Transfer</text>
  <text x="670" y="397" font-size="12.5" font-weight="800" fill="#0f172a">Authorize residual risk</text>

  <!-- Stage 4: Control execution -->
  <rect x="930" y="140" width="230" height="300" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="950" y="170" font-size="11" font-weight="900" letter-spacing="1.2" fill="#0f766e">4. IMPLEMENTATION</text>
  <text x="950" y="198" font-size="17" font-weight="800" fill="#0f172a">Control Execution</text>
  <line x1="950" y1="212" x2="1140" y2="212" stroke="#0f766e" stroke-opacity="0.35"/>
  <text x="950" y="242" font-size="12.5" font-weight="800" fill="#0f172a">Administrative</text>
  <text x="950" y="264" font-size="11.2" fill="#475569">Policy, ownership, governance</text>
  <text x="950" y="298" font-size="12.5" font-weight="800" fill="#0f172a">Physical</text>
  <text x="950" y="320" font-size="11.2" fill="#475569">Facilities, media, equipment</text>
  <text x="950" y="354" font-size="12.5" font-weight="800" fill="#0f172a">Technical</text>
  <text x="950" y="376" font-size="11.2" fill="#475569">Identity, crypto, app, network</text>
  <text x="950" y="410" font-size="10.5" font-weight="700" fill="#0f766e">Operate, test, collect evidence</text>

  <!-- Directional relationships -->
  <path d="M270 290 L320 290" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="295" y="278" text-anchor="middle" font-size="8.8" font-weight="900" fill="#2563eb">INFORMS</text>
  <path d="M600 290 L650 290" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="625" y="278" text-anchor="middle" font-size="8.8" font-weight="900" fill="#b45309">FRAMES</text>
  <path d="M880 290 L930 290" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="905" y="278" text-anchor="middle" font-size="8.8" font-weight="900" fill="#0f766e">DIRECTS</text>

  <!-- Monitoring feedback to risk management -->
  <path d="M1045 440 L1045 495 L765 495 L765 442" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="905" y="483" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0f766e">MONITORING EVIDENCE &amp; RESIDUAL-RISK FEEDBACK</text>

  <rect x="40" y="530" width="1120" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="553" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">Relationship, not containment: the applicable domains can overlap for the same asset and threat scenario.</text>
  <text x="600" y="573" text-anchor="middle" font-size="11" fill="#475569">Risk decisions govern response selection; controls implement treatment and generate evidence for reassessment.</text>
</svg>
