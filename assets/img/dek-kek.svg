<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff" />

  <defs>
    <marker id="ah8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491a3" />
    </marker>
  </defs>

  <!-- Data -->
  <rect x="270" y="20" width="180" height="44" rx="8" fill="#9f1239" />
  <text x="360" y="47" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Your data (whole disk)</text>

  <path d="M360 64 L360 90" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah8)" />
  <text x="400" y="82" font-size="11" fill="#475569">encrypted by</text>

  <!-- DEK -->
  <rect x="260" y="95" width="200" height="44" rx="8" fill="#193e9f" />
  <text x="360" y="118" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DEK</text>
  <text x="360" y="133" font-size="10" fill="#c9d7fb" text-anchor="middle">fixed for the life of the volume</text>

  <path d="M360 139 L360 165" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah8)" />
  <text x="410" y="157" font-size="11" fill="#475569">wrapped (encrypted) by</text>

  <!-- KEK -->
  <rect x="270" y="170" width="180" height="44" rx="8" fill="#2457d6" />
  <text x="360" y="193" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">KEK</text>
  <text x="360" y="208" font-size="10" fill="#dbe7ff" text-anchor="middle">this is what actually changes</text>

  <!-- three sources -->
  <path d="M150 260 L300 220" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah8)" />
  <path d="M360 300 L360 220" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah8)" />
  <path d="M570 260 L420 220" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah8)" />

  <rect x="40" y="260" width="180" height="46" rx="8" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="130" y="280" font-size="11.5" font-weight="700" fill="#a14c00" text-anchor="middle">Password / PIN</text>
  <text x="130" y="296" font-size="10" fill="#a14c00" text-anchor="middle">via PBKDF2/Argon2</text>

  <rect x="270" y="305" width="180" height="46" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5" />
  <text x="360" y="325" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">TPM / Secure Enclave</text>
  <text x="360" y="341" font-size="10" fill="#0f766e" text-anchor="middle">releases only if boot is untampered</text>

  <rect x="500" y="260" width="180" height="46" rx="8" fill="#fde8ea" stroke="#9f1239" stroke-width="1.5" />
  <text x="590" y="280" font-size="11.5" font-weight="700" fill="#9f1239" text-anchor="middle">Recovery key</text>
  <text x="590" y="296" font-size="10" fill="#9f1239" text-anchor="middle">the 48-digit escape hatch</text>
</svg>
