<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%" role="img" aria-labelledby="peak-title peak-desc">
  <title id="peak-title">The PEAK hunting framework and its three hunt types</title>
  <desc id="peak-desc">PEAK — Prepare, Execute, and Act with Knowledge — branches into three hunt types: hypothesis-driven hunting, baseline hunting using exploratory data analysis, and model-assisted threat hunts abbreviated M-ATH.</desc>
  <rect width="900" height="270" fill="#ffffff"/>
  <style>
    .box { fill: #f0f4c3; stroke: #334155; stroke-width: 2; }
    .box-sub { fill: #e3f2fd; stroke: #334155; stroke-width: 2; }
    .text-main { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .text-exp { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #475569; text-anchor: middle; }
    .text-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .text-desc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #475569; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; }
    .arrow { fill: #334155; }
  </style>

  <rect x="278" y="18" width="344" height="64" rx="6" class="box"/>
  <text x="450" y="45" class="text-main">PEAK HUNTING FRAMEWORK</text>
  <text x="450" y="66" class="text-exp">Prepare &#183; Execute &#183; Act with Knowledge</text>

  <line x1="450" y1="82" x2="450" y2="106" class="line"/>
  <line x1="150" y1="106" x2="750" y2="106" class="line"/>
  <line x1="150" y1="106" x2="150" y2="140" class="line"/>
  <line x1="450" y1="106" x2="450" y2="140" class="line"/>
  <line x1="750" y1="106" x2="750" y2="140" class="line"/>

  <polygon points="145,140 155,140 150,150" class="arrow"/>
  <polygon points="445,140 455,140 450,150" class="arrow"/>
  <polygon points="745,140 755,140 750,150" class="arrow"/>

  <rect x="20" y="158" width="260" height="42" rx="6" class="box-sub"/>
  <text x="150" y="185" class="text-sub">1. Hypothesis-Driven</text>
  <text x="150" y="222" class="text-desc">Formulates testable</text>
  <text x="150" y="240" class="text-desc">adversary hypotheses</text>

  <rect x="320" y="158" width="260" height="42" rx="6" class="box-sub"/>
  <text x="450" y="185" class="text-sub">2. Baseline (EDA)</text>
  <text x="450" y="222" class="text-desc">Queries telemetry for</text>
  <text x="450" y="240" class="text-desc">rare process outliers</text>

  <rect x="620" y="158" width="260" height="42" rx="6" class="box-sub"/>
  <text x="750" y="185" class="text-sub">3. Model-Assisted (M-ATH)</text>
  <text x="750" y="222" class="text-desc">Leverages ML clustering</text>
  <text x="750" y="240" class="text-desc">&amp; anomaly algorithms</text>
</svg>
