<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <style>
    .box { fill: #f0f4c3; stroke: #333; stroke-width: 2; rx: 5; }
    .box-sub { fill: #e3f2fd; stroke: #333; stroke-width: 2; rx: 5; }
    .text-main { font-family: monospace; font-size: 16px; font-weight: bold; text-anchor: middle; alignment-baseline: middle; }
    .text-sub { font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .text-desc { font-family: monospace; font-size: 12px; fill: #444; text-anchor: middle; }
    .line { stroke: #333; stroke-width: 2; }
    .arrow { fill: #333; }
  </style>
  
  <rect x="300" y="20" width="300" height="50" class="box" />
  <text x="450" y="45" class="text-main">PEAK HUNTING FRAMEWORK</text>
  
  <line x1="450" y1="70" x2="450" y2="100" class="line" />
  <line x1="150" y1="100" x2="750" y2="100" class="line" />
  
  <line x1="150" y1="100" x2="150" y2="130" class="line" />
  <line x1="450" y1="100" x2="450" y2="130" class="line" />
  <line x1="750" y1="100" x2="750" y2="130" class="line" />
  
  <polygon points="145,130 155,130 150,140" class="arrow" />
  <polygon points="445,130 455,130 450,140" class="arrow" />
  <polygon points="745,130 755,130 750,140" class="arrow" />
  
  <rect x="20" y="150" width="260" height="40" class="box-sub" />
  <text x="150" y="175" class="text-sub">[1. Hypothesis-Driven]</text>
  <text x="150" y="210" class="text-desc">Formulates testable</text>
  <text x="150" y="230" class="text-desc">adversary hypotheses</text>
  
  <rect x="320" y="150" width="260" height="40" class="box-sub" />
  <text x="450" y="175" class="text-sub">[2. Baseline / EDR]</text>
  <text x="450" y="210" class="text-desc">Queries telemetry for</text>
  <text x="450" y="230" class="text-desc">rare process outliers</text>
  
  <rect x="620" y="150" width="260" height="40" class="box-sub" />
  <text x="750" y="175" class="text-sub">[3. Model-Assisted (MASH)]</text>
  <text x="750" y="210" class="text-desc">Leverages ML clustering</text>
  <text x="750" y="230" class="text-desc">&amp; anomaly algorithms</text>
</svg>