<svg viewBox="0 0 1200 608" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">How TLS combines cryptographic primitives</title>
  <desc id="description">TLS uses separate mechanisms for peer authentication, shared-secret establishment, and protected data transport.</desc>
  <rect width="1200" height="608" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">How TLS combines cryptographic primitives</text>
  <text x="50" y="88" font-size="16" fill="#475569">TLS uses separate mechanisms for peer authentication, shared-secret establishment, and protected data transport.</text>
  
    <g>
      <rect x="80" y="130" width="1040" height="115" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="105" y="161" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">AUTHENTICATION</text>
      <text x="105" y="195" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Validate the server certificate and signature</text>
      <text x="105" y="235" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">The client validates the X.509 chain and proof of the certificate private key.</text>
    </g>

    <g>
      <rect x="80" y="289" width="1040" height="115" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="105" y="320" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">KEY ESTABLISHMENT</text>
      <text x="105" y="354" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Derive fresh traffic secrets</text>
      <text x="105" y="394" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Ephemeral Diffie-Hellman and HKDF establish keys without sending them directly.</text>
    </g>

    <g>
      <rect x="80" y="448" width="1040" height="115" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="105" y="479" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">RECORD PROTECTION</text>
      <text x="105" y="513" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Encrypt and authenticate application data</text>
      <text x="105" y="553" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">AEAD such as AES-GCM or ChaCha20-Poly1305 protects each record.</text>
    </g>
    <path d="M600 252 L600 282" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="235" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="252" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">ESTABLISH TRUST</text>
    <path d="M600 411 L600 441" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="394" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="411" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">PROTECT TRAFFIC</text>
</svg>
