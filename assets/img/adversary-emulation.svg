<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 120" width="100%" height="100%" role="img" aria-labelledby="ae-title ae-desc">
  <title id="ae-title">Continuous security validation sequence</title>
  <desc id="ae-desc">Five steps in order: select the target ATT&amp;CK technique, execute the atomic payload, verify telemetry ingestion, check that the detection rule generated an alert, then score coverage and remediate any gap.</desc>
  <rect width="1060" height="120" fill="#ffffff"/>
  <style>
    .stage { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
    .st { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #0f172a; text-anchor: middle; font-weight: 600; }
    .arrow { stroke: #0369a1; stroke-width: 2; }
    .arrowhead { fill: #0369a1; }
  </style>

  <rect x="20" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="110" y="53" class="st">1. Select</text>
  <text x="110" y="69" class="st">Target TTP</text>

  <rect x="230" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="320" y="53" class="st">2. Execute</text>
  <text x="320" y="69" class="st">Atomic Payload</text>

  <rect x="440" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="530" y="53" class="st">3. Verify</text>
  <text x="530" y="69" class="st">Telemetry Ingestion</text>

  <rect x="650" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="740" y="53" class="st">4. Check</text>
  <text x="740" y="69" class="st">Alert Generation</text>

  <rect x="860" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="950" y="53" class="st">5. Score</text>
  <text x="950" y="69" class="st">&amp; Remediate</text>

  <line x1="204" y1="56" x2="222" y2="56" class="arrow"/><polygon points="222,52 230,56 222,60" class="arrowhead"/>
  <line x1="414" y1="56" x2="432" y2="56" class="arrow"/><polygon points="432,52 440,56 432,60" class="arrowhead"/>
  <line x1="624" y1="56" x2="642" y2="56" class="arrow"/><polygon points="642,52 650,56 642,60" class="arrowhead"/>
  <line x1="834" y1="56" x2="852" y2="56" class="arrow"/><polygon points="852,52 860,56 852,60" class="arrowhead"/>
</svg>
