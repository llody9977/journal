<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="850" fill="#ffffff"/>

  <defs>
    <marker id="failure-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="50" y="53" font-size="29" font-weight="800" fill="#0f172a">Same exposed record, two different broken boundaries</text>
  <text x="50" y="85" font-size="16" fill="#475569">Strong authentication cannot repair a bad authorization rule. Correct authorization cannot repair a stolen session.</text>

  <!-- Scenario A -->
  <g>
    <rect x="40" y="120" width="1120" height="315" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <rect x="40" y="120" width="1120" height="58" rx="24" fill="#c2410c"/>
    <path d="M40 150 H1160 V178 H40Z" fill="#c2410c"/>
    <circle cx="78" cy="149" r="19" fill="#ffffff" opacity="0.95"/>
    <text x="78" y="155" text-anchor="middle" font-size="16" font-weight="900" fill="#c2410c">A</text>
    <text x="112" y="157" font-size="20" font-weight="900" fill="#ffffff">BROKEN AUTHORIZATION</text>
    <text x="1118" y="157" text-anchor="end" font-size="14" font-weight="800" fill="#ffedd5">LEGITIMATE USER · EXCESSIVE ACCESS</text>

    <g>
      <rect x="70" y="215" width="210" height="125" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <circle cx="105" cy="257" r="21" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
      <circle cx="105" cy="251" r="7" fill="#0f766e"/>
      <path d="M92 270 Q105 256 118 270" fill="#0f766e"/>
      <text x="137" y="250" font-size="15" font-weight="900" fill="#0f172a">MEI</text>
      <text x="137" y="274" font-size="13" fill="#475569">employee</text>
      <text x="175" y="317" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">LEGITIMATE CALLER</text>
    </g>

    <g>
      <rect x="330" y="215" width="210" height="125" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
      <circle cx="365" cy="257" r="21" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
      <circle cx="359" cy="257" r="7" fill="none" stroke="#16a34a" stroke-width="4"/>
      <path d="M367 257 H385 M379 257 V267 M372 257 V264" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
      <text x="397" y="250" font-size="15" font-weight="900" fill="#0f172a">PASSKEY</text>
      <text x="397" y="274" font-size="13" fill="#475569">verified</text>
      <text x="435" y="317" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">AUTHENTICATION PASSES</text>
    </g>

    <g>
      <rect x="590" y="205" width="280" height="145" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
      <circle cx="625" cy="242" r="20" fill="#dc2626"/>
      <path d="M625 229 V246 M625 257 V259" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <text x="658" y="240" font-size="15" font-weight="900" fill="#b91c1c">FLAWED POLICY</text>
      <text x="618" y="279" font-size="13.5" fill="#475569">employee → any salary record</text>
      <text x="618" y="308" font-size="13.5" fill="#475569">object ownership is not checked</text>
      <text x="730" y="335" text-anchor="middle" font-size="12.5" font-weight="900" fill="#b91c1c">BOLA / IDOR</text>
    </g>

    <g>
      <rect x="920" y="215" width="210" height="125" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <rect x="950" y="241" width="58" height="70" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
      <path d="M962 260 H996 M962 276 H996 M962 292 H986" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
      <text x="1023" y="250" font-size="14" font-weight="900" fill="#0f172a">CHEN'S</text>
      <text x="1023" y="273" font-size="14" font-weight="900" fill="#0f172a">SALARY</text>
      <text x="1023" y="300" font-size="13" fill="#475569">disclosed</text>
      <text x="1025" y="328" text-anchor="middle" font-size="12.5" font-weight="900" fill="#7c3aed">ACCESS ALLOWED</text>
    </g>

    <path d="M280 277 H318" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#failure-arrow)"/>
    <path d="M540 277 H578" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#failure-arrow)"/>
    <path d="M870 277 H908" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#failure-arrow)"/>

    <rect x="70" y="375" width="1060" height="40" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="600" y="401" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Authentication proved Mei controlled her passkey; it did not grant permission to read Chen's record.</text>
  </g>

  <!-- Scenario B -->
  <g>
    <rect x="40" y="465" width="1120" height="315" rx="24" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <rect x="40" y="465" width="1120" height="58" rx="24" fill="#dc2626"/>
    <path d="M40 495 H1160 V523 H40Z" fill="#dc2626"/>
    <circle cx="78" cy="494" r="19" fill="#ffffff" opacity="0.95"/>
    <text x="78" y="500" text-anchor="middle" font-size="16" font-weight="900" fill="#dc2626">B</text>
    <text x="112" y="502" font-size="20" font-weight="900" fill="#ffffff">BROKEN SESSION SECURITY</text>
    <text x="1118" y="502" text-anchor="end" font-size="14" font-weight="800" fill="#fee2e2">IMPOSTOR · STOLEN AUTHENTICATED STATE</text>

    <g>
      <rect x="70" y="560" width="210" height="125" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
      <circle cx="105" cy="602" r="21" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="105" cy="596" r="7" fill="#dc2626"/>
      <path d="M92 615 Q105 601 118 615" fill="#dc2626"/>
      <text x="137" y="595" font-size="15" font-weight="900" fill="#0f172a">ATTACKER</text>
      <text x="137" y="619" font-size="13" fill="#475569">no passkey</text>
      <text x="175" y="662" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">IMPOSTOR</text>
    </g>

    <g>
      <rect x="330" y="550" width="210" height="145" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
      <path d="M360 579 H408 L422 593 V635 H360Z" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
      <path d="M408 579 V593 H422" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <text x="435" y="579" font-size="13.5" font-weight="900" fill="#b91c1c">STOLEN</text>
      <text x="435" y="601" font-size="13.5" font-weight="900" fill="#b91c1c">ADMIN</text>
      <text x="435" y="621" font-size="13.5" font-weight="900" fill="#b91c1c">SESSION</text>
      <text x="358" y="652" font-size="13" fill="#475569">server accepts token</text>
      <text x="435" y="684" text-anchor="middle" font-size="12.5" font-weight="900" fill="#b91c1c">SESSION FAILURE</text>
    </g>

    <g>
      <rect x="590" y="560" width="280" height="125" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
      <circle cx="625" cy="601" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
      <path d="M615 601 L623 609 L637 591" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="658" y="595" font-size="15" font-weight="900" fill="#0f172a">CORRECT POLICY</text>
      <text x="618" y="630" font-size="13.5" fill="#475569">administrator → salary records</text>
      <text x="730" y="671" text-anchor="middle" font-size="12.5" font-weight="900" fill="#15803d">AUTHORIZATION PASSES</text>
    </g>

    <g>
      <rect x="920" y="560" width="210" height="125" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <rect x="950" y="586" width="58" height="70" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
      <path d="M962 605 H996 M962 621 H996 M962 637 H986" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
      <text x="1023" y="595" font-size="14" font-weight="900" fill="#0f172a">SALARY</text>
      <text x="1023" y="618" font-size="14" font-weight="900" fill="#0f172a">DATA</text>
      <text x="1023" y="645" font-size="13" fill="#475569">disclosed</text>
      <text x="1025" y="673" text-anchor="middle" font-size="12.5" font-weight="900" fill="#7c3aed">ACCESS ALLOWED</text>
    </g>

    <path d="M280 622 H318" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#failure-arrow)"/>
    <path d="M540 622 H578" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#failure-arrow)"/>
    <path d="M870 622 H908" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#failure-arrow)"/>

    <rect x="70" y="720" width="1060" height="40" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="600" y="746" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">The policy was correct for an admin session; the attacker stole and reused that authenticated state.</text>
  </g>

  <text x="600" y="822" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">Secure both boundaries: authorize the requested action and protect the session carrying authenticated state.</text>
</svg>
