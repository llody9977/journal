<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="mcpflow-title mcpflow-desc">
  <title id="mcpflow-title">MCP tool discovery and invocation sequence</title>
  <desc id="mcpflow-desc">A sequence between the model, the MCP client, and the MCP server over JSON-RPC 2.0. The client sends a tools slash list request; the server returns tool definitions carrying name, title, description, input schema, output schema, and annotations. The client places those descriptions into the model context, the model selects a tool, and the client sends tools slash call. A highlighted note marks the discovery step as the point where server-controlled text first enters the model context, before any tool has been invoked.</desc>
  <rect width="1200" height="470" fill="#ffffff"/>

  <defs>
    <marker id="mcpfA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="50" y="46" font-size="26" font-weight="850" fill="#0f172a">MCP tool discovery and invocation</text>
  <text x="50" y="72" font-size="14" fill="#475569">JSON-RPC 2.0 over the stdio or Streamable HTTP transport. Discovery happens before the model chooses anything.</text>

  <!-- lanes -->
  <rect x="60" y="100" width="200" height="46" rx="10" fill="#193e9f"/>
  <text x="160" y="129" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Model</text>
  <rect x="480" y="100" width="200" height="46" rx="10" fill="#2457d6"/>
  <text x="580" y="129" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">MCP client</text>
  <rect x="900" y="100" width="200" height="46" rx="10" fill="#0f766e"/>
  <text x="1000" y="129" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">MCP server</text>

  <line x1="160" y1="146" x2="160" y2="396" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="580" y1="146" x2="580" y2="396" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1000" y1="146" x2="1000" y2="396" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 1 tools/list -->
  <path d="M580 180 L996 180" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#mcpfA)"/>
  <text x="788" y="172" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace,monospace" fill="#0f172a">tools/list</text>

  <!-- 2 response -->
  <path d="M1000 218 L584 218" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#mcpfA)"/>
  <text x="788" y="210" text-anchor="middle" font-size="12.5" fill="#475569">name, title, description, inputSchema, outputSchema, annotations</text>

  <!-- 3 context ingestion -->
  <path d="M576 256 L164 256" stroke="#9f1239" stroke-width="2.5" fill="none" marker-end="url(#mcpfA)"/>
  <text x="370" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">tool descriptions placed into the model context</text>

  <!-- 4 selection -->
  <path d="M160 300 L576 300" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#mcpfA)"/>
  <text x="368" y="292" text-anchor="middle" font-size="12.5" fill="#475569">model selects a tool and proposes arguments</text>

  <!-- 5 tools/call -->
  <path d="M580 344 L996 344" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#mcpfA)"/>
  <text x="788" y="336" text-anchor="middle" font-size="12.5" font-weight="700" font-family="ui-monospace,monospace" fill="#0f172a">tools/call</text>

  <!-- 6 result -->
  <path d="M1000 382 L584 382" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#mcpfA)"/>
  <text x="788" y="374" text-anchor="middle" font-size="12.5" fill="#475569">content and structuredContent, or an error result</text>

  <!-- highlight -->
  <rect x="40" y="408" width="1120" height="48" rx="10" fill="#fde8ea" stroke="#9f1239" stroke-width="2"/>
  <text x="60" y="430" font-size="12.5" font-weight="800" fill="#9f1239">Server-controlled text first enters the model context at step 3 &#8212; before any tool has been called and without the user asking.</text>
  <text x="60" y="449" font-size="12.5" fill="#475569">Every field returned by discovery is attacker-influenceable if the server is malicious or compromised.</text>
</svg>
