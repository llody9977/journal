<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">SSH host trust and public-key user authentication</title>
  <desc id="description">The client first validates the server host key against configured trust, then signs session-bound authentication data with its user private key and the server checks the corresponding authorized public key or certificate.</desc>
  <rect width="1200" height="500" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker></defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">SSH host trust and public-key user authentication</text>
  <text x="50" y="85" font-size="14.5" fill="#475569">Conceptual flow: two separate trust decisions, with signatures bound into the SSH exchange.</text>
  <rect x="50" y="120" width="1100" height="145" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="75" y="153" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">1 — SERVER HOST AUTHENTICATION</text>
  <rect x="90" y="175" width="220" height="58" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="200" y="209" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Server host key</text>
  <path d="M320 204L550 204" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="435" y="191" text-anchor="middle" font-size="12.5" fill="#475569">signature binds host key to exchange hash</text>
  <rect x="565" y="175" width="530" height="58" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="830" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Client validates configured trust</text>
  <text x="830" y="219" text-anchor="middle" font-size="12.5" fill="#475569">known_hosts / verified fingerprint / SSHFP policy / provisioned host CA</text>
  <rect x="50" y="290" width="1100" height="160" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <text x="75" y="323" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">2 — USER PUBLIC-KEY AUTHENTICATION</text>
  <rect x="90" y="345" width="300" height="68" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="371" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Client user private key</text>
  <text x="240" y="394" text-anchor="middle" font-size="12.5" fill="#475569">signs session identifier + userauth request</text>
  <path d="M400 379L615 379" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="507" y="366" text-anchor="middle" font-size="12.5" fill="#475569">session-bound signature</text>
  <rect x="630" y="345" width="465" height="68" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="862" y="371" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Server validates authorized identity</text>
  <text x="862" y="394" text-anchor="middle" font-size="12.5" fill="#475569">authorized_keys or trusted user CA + principals/options/revocation</text>
  <text x="600" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">First-use acceptance displays a key; independent verification or provisioned CA trust establishes identity.</text>
</svg>
