<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="740" height="300" fill="#ffffff" />

  <defs>
    <marker id="ah7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491a3" />
    </marker>
  </defs>

  <!-- Row 1: server -> client trust -->
  <text x="20" y="25" font-size="13" font-weight="700" fill="#111827">1. Client must trust the server's host key</text>

  <rect x="20" y="40" width="110" height="36" rx="6" fill="#193e9f" />
  <text x="75" y="63" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Server</text>

  <path d="M135 58 L270 58" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah7)" />
  <text x="200" y="48" font-size="11" fill="#475569" text-anchor="middle">presents host key</text>

  <rect x="285" y="40" width="170" height="36" rx="6" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="370" y="63" font-size="11.5" font-weight="700" fill="#a14c00" text-anchor="middle">checked against ~/.ssh/known_hosts</text>

  <path d="M460 58 L555 58" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah7)" />

  <rect x="560" y="40" width="160" height="36" rx="6" fill="#e9efff" stroke="#2457d6" stroke-width="1.5" />
  <text x="640" y="58" font-size="11" font-weight="700" fill="#193e9f" text-anchor="middle">first time: TOFU prompt</text>
  <text x="640" y="71" font-size="11" font-weight="700" fill="#193e9f" text-anchor="middle">known: silent match</text>

  <line x1="0" y1="105" x2="740" y2="105" stroke="#d7dee7" stroke-width="1.5" />

  <!-- Row 2: client -> server trust -->
  <text x="20" y="130" font-size="13" font-weight="700" fill="#111827">2. Server must trust the client's identity</text>

  <rect x="20" y="145" width="110" height="36" rx="6" fill="#193e9f" />
  <text x="75" y="168" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Client</text>

  <path d="M135 163 L280 163" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah7)" />
  <text x="207" y="153" font-size="11" fill="#475569" text-anchor="middle">signs a challenge with</text>
  <text x="207" y="187" font-size="10.5" fill="#475569" text-anchor="middle">private key never leaves client</text>

  <rect x="285" y="145" width="170" height="36" rx="6" fill="#fdf1e0" stroke="#a14c00" stroke-width="1.5" />
  <text x="370" y="168" font-size="11.5" font-weight="700" fill="#a14c00" text-anchor="middle">its private key</text>

  <path d="M460 163 L555 163" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ah7)" />

  <rect x="560" y="145" width="160" height="36" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5" />
  <text x="640" y="163" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">verified against</text>
  <text x="640" y="176" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">~/.ssh/authorized_keys</text>

  <text x="370" y="230" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Two separate trust decisions — neither is a CA-backed certificate by default</text>
  <text x="370" y="252" font-size="11.5" fill="#475569" text-anchor="middle">which is exactly why checking a host key fingerprint on first connect actually matters</text>
</svg>
