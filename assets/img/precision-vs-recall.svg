<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" role="img" aria-labelledby="pvr-title pvr-desc">
  <title id="pvr-title">Detection outcome matrix: precision versus recall</title>
  <desc id="pvr-desc">A two-by-two matrix. Columns are the ground truth — adversary activity present or absent. Rows are detection status — triggered or quiet. The four cells are true positive, false positive, false negative, and true negative. Precision is measured across the triggered row; recall is measured down the activity-present column.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <style>
    .cell { fill: none; stroke: #334155; stroke-width: 2; }
    .cell-good { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
    .axis-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; text-anchor: middle; letter-spacing: .3px; }
    .axis-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #334155; text-anchor: middle; font-weight: 700; }
    .cell-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; fill: #0f172a; text-anchor: middle; font-weight: 700; }
    .cell-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #64748b; text-anchor: middle; }
    .formula { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; fill: #b91c1c; font-weight: 700; text-anchor: middle; }
    .formula-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #64748b; text-anchor: middle; }
  </style>

  <!-- Axis titles -->
  <text x="450" y="42" class="axis-title">Adversary activity (ground truth)</text>
  <text x="150" y="42" class="axis-title">Detection status</text>

  <!-- Column values -->
  <text x="350" y="78" class="axis-val">Present</text>
  <text x="550" y="78" class="axis-val">Absent</text>

  <!-- Row values -->
  <text x="150" y="136" class="axis-val">Triggered</text>
  <text x="150" y="216" class="axis-val">Quiet</text>

  <!-- Matrix -->
  <rect x="250" y="94" width="200" height="80" class="cell-good"/>
  <rect x="450" y="94" width="200" height="80" class="cell"/>
  <rect x="250" y="174" width="200" height="80" class="cell"/>
  <rect x="450" y="174" width="200" height="80" class="cell-good"/>

  <text x="350" y="128" class="cell-name">True Positive</text>
  <text x="350" y="148" class="cell-sub">(detection worked)</text>

  <text x="550" y="128" class="cell-name">False Positive</text>
  <text x="550" y="148" class="cell-sub">(alert fatigue)</text>

  <text x="350" y="208" class="cell-name">False Negative</text>
  <text x="350" y="228" class="cell-sub">(missed intrusion)</text>

  <text x="550" y="208" class="cell-name">True Negative</text>
  <text x="550" y="228" class="cell-sub">(normal operations)</text>

  <!-- Formulas, fully inside the canvas -->
  <text x="290" y="300" class="formula">Precision = TP / (TP + FP)</text>
  <text x="290" y="322" class="formula-sub">of the alerts raised, how many were real?</text>

  <text x="628" y="300" class="formula">Recall = TP / (TP + FN)</text>
  <text x="628" y="322" class="formula-sub">of the real activity, how much did we catch?</text>
</svg>
