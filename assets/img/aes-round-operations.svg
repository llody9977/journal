<svg viewBox="0 0 1200 370" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="aes-title aes-desc">
  <title id="aes-title">AES encryption round sequence</title>
  <desc id="aes-desc">AES begins with AddRoundKey, executes N minus one main rounds containing SubBytes, ShiftRows, MixColumns, and AddRoundKey, then executes a final round containing SubBytes, ShiftRows, and AddRoundKey without MixColumns.</desc>
  <rect width="1200" height="370" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">AES Encryption Round Sequence</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Nr = 10, 12, or 14 rounds for 128-, 192-, or 256-bit keys; the initial and final stages are structurally different</text>

  <rect x="50" y="120" width="245" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="70" y="148" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">INITIAL TRANSFORMATION</text>
  <text x="70" y="180" font-size="17" font-weight="800" fill="#0f172a">AddRoundKey</text>
  <text x="70" y="207" font-size="12" fill="#475569">State ⊕ round key K₀</text>
  <text x="70" y="232" font-size="12" fill="#475569">Occurs before round 1</text>
  <rect x="70" y="252" width="205" height="30" rx="6" fill="#dbeafe"/>
  <text x="172" y="272" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">No SubBytes or MixColumns</text>

  <path d="M305 210 L345 210" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="355" y="105" width="490" height="210" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="375" y="133" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">MAIN ROUNDS 1 THROUGH Nr−1</text>
  <text x="375" y="164" font-size="16" font-weight="800" fill="#0f172a">Repeat all four transformations</text>
  <rect x="375" y="186" width="100" height="74" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="425" y="216" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">SubBytes</text>
  <text x="425" y="238" font-size="10.5" fill="#475569" text-anchor="middle">S-box</text>
  <rect x="490" y="186" width="100" height="74" rx="8" fill="#ffffff" stroke="#5eead4"/>
  <text x="540" y="216" font-size="12" font-weight="800" fill="#0f766e" text-anchor="middle">ShiftRows</text>
  <text x="540" y="238" font-size="10.5" fill="#475569" text-anchor="middle">Permute</text>
  <rect x="605" y="186" width="100" height="74" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="655" y="216" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">MixColumns</text>
  <text x="655" y="238" font-size="10.5" fill="#475569" text-anchor="middle">Mix</text>
  <rect x="720" y="186" width="105" height="74" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="772" y="216" font-size="12" font-weight="800" fill="#5b21b6" text-anchor="middle">AddRoundKey</text>
  <text x="772" y="238" font-size="10.5" fill="#475569" text-anchor="middle">State ⊕ Kᵢ</text>
  <text x="600" y="291" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">MixColumns is present in every main round</text>

  <path d="M855 210 L895 210" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="905" y="120" width="245" height="180" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="925" y="148" font-size="11" font-weight="900" letter-spacing="1" fill="#7c3aed">FINAL ROUND Nr</text>
  <text x="925" y="178" font-size="13" font-weight="800" fill="#0f172a">1. SubBytes</text>
  <text x="925" y="203" font-size="13" font-weight="800" fill="#0f172a">2. ShiftRows</text>
  <text x="925" y="228" font-size="13" font-weight="800" fill="#0f172a">3. AddRoundKey</text>
  <rect x="925" y="250" width="205" height="32" rx="6" fill="#ede9fe"/>
  <text x="1027" y="271" font-size="11.5" font-weight="900" fill="#6d28d9" text-anchor="middle">MixColumns omitted</text>

  <text x="600" y="345" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">FIPS 197 sequencing: initial key addition → Nr−1 complete rounds → final round without MixColumns</text>
</svg>
