<svg viewBox="0 0 1200 415" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Authentication assurance levels</title>
  <desc id="description">AAL1 permits single-factor or multifactor authentication, AAL2 proves two distinct factors and offers a phishing-resistant option, and AAL3 adds a phishing-resistant public-key authenticator with a non-exportable key, activation, verifier compromise resistance, and approved cryptography.</desc>
  <rect width="1200" height="415" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Authentication assurance levels</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">AAL is achieved by a complete authenticator and verifier deployment—not by a product</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">label alone.</text>
  
    <g>
      <rect x="50" y="135" width="330" height="235" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">AAL1</text>
      <text x="75" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">One or more factors</text>
      <text x="75" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">single-factor or multifactor</text>
<text x="75" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">replay-resistant event</text>
<text x="75" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">phishing resistance not required</text>
    </g>

    <g>
      <rect x="435" y="135" width="330" height="235" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="460" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">AAL2</text>
      <text x="460" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Two distinct factors</text>
      <text x="460" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">one multifactor authenticator</text>
<text x="460" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">or two single-factor authenticators</text>
<text x="460" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">phishing-resistant option offered</text>
    </g>

    <g>
      <rect x="820" y="135" width="330" height="235" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="845" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">AAL3</text>
      <text x="845" y="200" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Public-key assurance</text>
      <text x="845" y="240" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">phishing-resistant</text>
<text x="845" y="263" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">non-exportable key</text>
<text x="845" y="286" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">activation + verifier resistance</text>
<text x="845" y="309" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">approved cryptography</text>
    </g>
    <path d="M388 252.5 L427 252.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="407.5" y="125" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">MORE REQUIREMENTS</text>
    <path d="M773 252.5 L812 252.5" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="792.5" y="125" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">MORE REQUIREMENTS</text>
</svg>
