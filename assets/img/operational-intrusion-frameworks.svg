<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Operational Intrusion Frameworks Architecture</title>
  <desc id="description">Operational Intrusion Frameworks architecture showing Lockheed Martin Cyber Kill Chain, Diamond Model of Intrusion Analysis, MITRE ATT&amp;CK Enterprise Matrix, D3FEND, and ATLAS.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Operational Intrusion Frameworks &amp; Intrusion Analysis</text>
  <text x="50" y="75" font-size="14" fill="#475569">Runtime adversary models, attack lifecycles, campaign attribution graph structures, and defensive countermeasure mapping.</text>
  
  <!-- Section 1: Cyber Kill Chain (x=40, w=355, y=105, h=160) -->
  <rect x="40" y="105" width="355" height="160" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#7c3aed">CYBER KILL CHAIN (7 STAGES)</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">Linear Intrusion Progression</text>
  <line x1="60" y1="166" x2="375" y2="166" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">1. Reconnaissance → 2. Weaponization</text>
  <text x="60" y="204" font-size="11.5" font-weight="500" fill="#475569">→ 3. Delivery → 4. Exploitation</text>
  <text x="60" y="222" font-size="11.5" font-weight="500" fill="#475569">→ 5. Installation → 6. Command &amp; Control</text>
  <text x="60" y="240" font-size="11.5" font-weight="500" fill="#475569">→ 7. Actions on Objectives</text>

  <!-- Section 2: Diamond Model (x=422, w=355, y=105, h=160) -->
  <rect x="422" y="105" width="355" height="160" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5" />
  <text x="442" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#b45309">DIAMOND MODEL OF INTRUSION ANALYSIS</text>
  <text x="442" y="155" font-size="14" font-weight="800" fill="#0f172a">Adversary Attribution &amp; Pivoting Graph</text>
  <line x1="442" y1="166" x2="757" y2="166" stroke="#b45309" stroke-opacity="0.3" stroke-width="1" />
  <text x="442" y="186" font-size="11.5" font-weight="500" fill="#475569">• 4 Vertices: Adversary, Capability, Infrastructure, Victim</text>
  <text x="442" y="204" font-size="11.5" font-weight="500" fill="#475569">• Tech Axis: Capability ↔ Infrastructure</text>
  <text x="442" y="222" font-size="11.5" font-weight="500" fill="#475569">• Socio-Pol Axis: Adversary ↔ Victim</text>
  <text x="442" y="240" font-size="11.5" font-weight="500" fill="#475569">• Activity Threads &amp; Campaign Event Pivoting</text>

  <!-- Section 3: MITRE ATT&CK Enterprise (x=805, w=355, y=105, h=160) -->
  <rect x="805" y="105" width="355" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="825" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">MITRE ATT&amp;CK ENTERPRISE MATRIX</text>
  <text x="825" y="155" font-size="14" font-weight="800" fill="#0f172a">Adversary TTP Knowledge Base</text>
  <line x1="825" y1="166" x2="1140" y2="166" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="825" y="186" font-size="11.5" font-weight="500" fill="#475569">• 14 Tactics (Reconnaissance → Impact)</text>
  <text x="825" y="204" font-size="11.5" font-weight="500" fill="#475569">• Techniques &amp; Sub-techniques (Methods)</text>
  <text x="825" y="222" font-size="11.5" font-weight="500" fill="#475569">• Procedures (Actor Execution / Payloads)</text>
  <text x="825" y="240" font-size="11.5" font-weight="500" fill="#475569">• Platforms: Enterprise, Mobile, ICS</text>

  <!-- Section 4: MITRE D3FEND & ATLAS (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">DEFENSIVE COUNTERMEASURE MAPPING: D3FEND &amp; ATLAS</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Countermeasure Engineering &amp; AI System Threat Model</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="366" font-size="11.5" font-weight="500" fill="#475569">• MITRE D3FEND: 7 Defensive Functions (Model → Harden → Detect → Isolate → Deceive → Evict → Restore) mapped to ATT&amp;CK TTPs</text>
  <text x="60" y="384" font-size="11.5" font-weight="500" fill="#475569">• MITRE ATLAS: Standalone matrix for AI/ML threats (Data Poisoning, Model Inversion, Prompt Injection, Evasion)</text>
  <text x="60" y="402" font-size="11.5" font-weight="500" fill="#475569">• Integration: ATT&amp;CK TTP Ingestion → D3FEND Countermeasure Selection → Measured Empirical Coverage Validation</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">OPERATIONAL FRAMEWORK LIFECYCLE: INTRUSION OBSERVATION → DIAMOND MODEL PIVOTING → ATT&amp;CK TTP TAXONOMY → D3FEND CONTROL MAPPING</text>
</svg>
