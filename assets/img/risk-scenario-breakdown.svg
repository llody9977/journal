<svg viewBox="0 0 1200 953" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">One risk scenario, six connected parts</title>
  <desc id="description">A useful risk statement links what matters, what may happen, why it can happen, and what changes it.</desc>
  <rect width="1200" height="953" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">One risk scenario, six connected parts</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">A useful risk statement links what matters, what may happen, why it can happen, and</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">what changes it.</text>
  <rect x="55" y="130" width="1090" height="115" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="85" y="172" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Asset</text><text x="400" y="167" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Treasury funds and supplier payout data</text><rect x="55" y="263" width="1090" height="115" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><text x="85" y="305" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Threat source</text><text x="400" y="300" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">A phishing attacker targets a finance manager</text><rect x="55" y="396" width="1090" height="115" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="85" y="438" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Threat event</text><text x="400" y="433" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">The attacker changes supplier routing details</text><rect x="55" y="529" width="1090" height="115" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/><text x="85" y="571" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Vulnerability</text><text x="400" y="566" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Single-factor login and one-person payment approval</text><rect x="55" y="662" width="1090" height="115" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="85" y="704" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Impact</text><text x="400" y="699" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Financial loss and delayed supplier operations</text><rect x="55" y="795" width="1090" height="115" rx="18" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/><text x="85" y="837" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Controls</text><text x="400" y="832" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Phishing-resistant MFA, dual approval, and audit logging</text>
</svg>
