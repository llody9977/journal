<svg viewBox="0 0 1200 890" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="890" fill="#ffffff"/>

  <defs>
    <marker id="iam-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="iam-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="50" y="53" font-size="29" font-weight="800" fill="#0f172a">Identity and access: two connected lifecycles</text>
  <text x="50" y="85" font-size="16" fill="#475569">Setup establishes identity, authenticators, and access policy. Runtime checks decide what each request may do.</text>

  <!-- Setup lane -->
  <g>
    <rect x="40" y="120" width="1120" height="225" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="68" y="103" width="285" height="36" rx="18" fill="#e2e8f0"/>
    <text x="210" y="127" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="0.8" fill="#475569">SETUP + IDENTITY LIFECYCLE</text>

    <g>
      <rect x="70" y="165" width="300" height="140" rx="20" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <circle cx="112" cy="208" r="23" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
      <circle cx="112" cy="201" r="8" fill="#0f766e"/>
      <path d="M98 223 Q112 208 126 223" fill="#0f766e"/>
      <text x="148" y="202" font-size="18" font-weight="900" fill="#0f172a">PROOF + ENROLL</text>
      <text x="148" y="228" font-size="14" fill="#475569">connect a subject to an identity</text>
      <text x="98" y="267" font-size="14" fill="#475569">verify the required evidence</text>
      <text x="98" y="289" font-size="14" fill="#475569">create the identity record</text>
    </g>

    <g>
      <rect x="450" y="165" width="300" height="140" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
      <circle cx="492" cy="208" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
      <circle cx="486" cy="208" r="8" fill="none" stroke="#2563eb" stroke-width="4"/>
      <path d="M494 208 H514 M506 208 V219 M498 208 V216" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      <text x="528" y="202" font-size="18" font-weight="900" fill="#0f172a">BIND AUTHENTICATOR</text>
      <text x="528" y="228" font-size="14" fill="#475569">associate proof of control</text>
      <text x="478" y="267" font-size="14" fill="#475569">passkey · certificate · password</text>
      <text x="478" y="289" font-size="14" fill="#475569">hardware token · recovery method</text>
    </g>

    <g>
      <rect x="830" y="165" width="300" height="140" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="872" cy="208" r="23" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
      <path d="M858 209 H886 M872 195 V223" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
      <text x="908" y="202" font-size="18" font-weight="900" fill="#0f172a">DEFINE ACCESS</text>
      <text x="908" y="228" font-size="14" fill="#475569">assign policy inputs</text>
      <text x="858" y="267" font-size="14" fill="#475569">roles · attributes · relationships</text>
      <text x="858" y="289" font-size="14" fill="#475569">resource scope · time limits</text>
    </g>

    <path d="M370 235 H438" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#iam-arrow)"/>
    <path d="M750 235 H818" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#iam-arrow)"/>
  </g>

  <!-- Runtime lane -->
  <g>
    <rect x="40" y="405" width="1120" height="225" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="68" y="388" width="250" height="36" rx="18" fill="#dbeafe"/>
    <text x="193" y="412" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="0.8" fill="#1d4ed8">RUNTIME ACCESS PATH</text>

    <g>
      <rect x="65" y="455" width="245" height="135" rx="20" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <text x="187" y="492" text-anchor="middle" font-size="18" font-weight="900" fill="#0f766e">AUTHENTICATE</text>
      <text x="187" y="528" text-anchor="middle" font-size="14" fill="#475569">verify current control of</text>
      <text x="187" y="551" text-anchor="middle" font-size="14" fill="#475569">the bound authenticator</text>
      <text x="187" y="577" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">ALLOW OR REJECT SIGN-IN</text>
    </g>

    <g>
      <rect x="340" y="455" width="245" height="135" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
      <text x="462" y="492" text-anchor="middle" font-size="18" font-weight="900" fill="#2563eb">PROTECTED SESSION</text>
      <text x="462" y="528" text-anchor="middle" font-size="14" fill="#475569">preserve authenticated state</text>
      <text x="462" y="551" text-anchor="middle" font-size="14" fill="#475569">with expiry and renewal rules</text>
      <text x="462" y="577" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">SESSION ≠ PERMISSION</text>
    </g>

    <g>
      <rect x="615" y="455" width="245" height="135" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <text x="737" y="492" text-anchor="middle" font-size="18" font-weight="900" fill="#7c3aed">AUTHORIZE ACTION</text>
      <text x="737" y="528" text-anchor="middle" font-size="14" fill="#475569">evaluate subject, action,</text>
      <text x="737" y="551" text-anchor="middle" font-size="14" fill="#475569">resource, and current context</text>
      <text x="737" y="577" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">CHECK EACH REQUEST</text>
    </g>

    <g>
      <rect x="890" y="455" width="245" height="135" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
      <text x="1012" y="492" text-anchor="middle" font-size="18" font-weight="900" fill="#b45309">ENFORCE RESULT</text>
      <text x="1012" y="528" text-anchor="middle" font-size="14" fill="#475569">allow or deny the operation</text>
      <text x="1012" y="551" text-anchor="middle" font-size="14" fill="#475569">and return the safe outcome</text>
      <text x="1012" y="577" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">RESOURCE DECISION</text>
    </g>

    <path d="M310 522 H328" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#iam-arrow)"/>
    <path d="M585 522 H603" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#iam-arrow)"/>
    <path d="M860 522 H878" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#iam-arrow)"/>
  </g>

  <!-- Setup inputs into runtime -->
  <path d="M600 305 V365 H187 V443" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#iam-blue-arrow)"/>
  <rect x="300" y="345" width="230" height="38" rx="19" fill="#ffffff" stroke="#93c5fd"/>
  <text x="415" y="369" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1d4ed8">BOUND AUTHENTICATOR</text>

  <path d="M980 305 V365 H737 V443" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#iam-blue-arrow)"/>
  <rect x="790" y="345" width="220" height="38" rx="19" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="900" y="369" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d28d9">POLICY + ENTITLEMENTS</text>

  <!-- Cross-cutting lifecycle controls -->
  <g>
    <rect x="60" y="690" width="520" height="145" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <text x="90" y="728" font-size="18" font-weight="900" fill="#334155">ACCOUNTABILITY LOGGING</text>
    <text x="90" y="762" font-size="14" fill="#475569">record proofing and administrative changes</text>
    <text x="90" y="788" font-size="14" fill="#475569">record authentication and authorization outcomes</text>
    <text x="90" y="814" font-size="14" fill="#475569">protect evidence from unauthorized alteration</text>
  </g>

  <g>
    <rect x="620" y="690" width="520" height="145" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="650" y="728" font-size="18" font-weight="900" fill="#b91c1c">CHANGE OR REVOKE ACCESS</text>
    <text x="650" y="762" font-size="14" fill="#475569">disable compromised or retired authenticators</text>
    <text x="650" y="788" font-size="14" fill="#475569">terminate active sessions and tokens</text>
    <text x="650" y="814" font-size="14" fill="#475569">remove or update roles, attributes, and relationships</text>
  </g>

  <!-- Runtime events feed accountability -->
  <path d="M187 590 V652 H1012 V590 M462 590 V652 M737 590 V652" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M320 652 V678" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#iam-arrow)"/>

  <text x="600" y="868" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Authentication establishes the caller; authorization still evaluates every requested action.</text>
</svg>
