<svg viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="700" height="310" fill="#ffffff" />

  <defs>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8491a3" />
    </marker>
    <g id="icon-cert-sm">
      <rect x="15" y="15" width="70" height="70" rx="8" />
      <line x1="28" y1="35" x2="72" y2="35" stroke="#ffffff" stroke-width="5" />
      <line x1="28" y1="48" x2="72" y2="48" stroke="#ffffff" stroke-width="5" />
      <path d="M40 62 l10 10 l20 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>

  <rect x="30" y="110" width="150" height="60" rx="8" fill="#193e9f" />
  <text x="105" y="145" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Client</text>

  <rect x="520" y="110" width="150" height="60" rx="8" fill="#193e9f" />
  <text x="595" y="145" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Server</text>

  <!-- server -> client: server cert -->
  <g fill="#2457d6"><use href="#icon-cert-sm" transform="translate(330,55) scale(0.4)" /></g>
  <path d="M520 130 L185 130" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ahm)" />
  <text x="350" y="112" font-size="11" fill="#111827" text-anchor="middle">1. server presents its certificate</text>
  <text x="350" y="124" font-size="10" fill="#475569" text-anchor="middle">(the normal TLS handshake)</text>

  <!-- client -> server: client cert -->
  <path d="M185 155 L515 155" stroke="#8491a3" stroke-width="2" fill="none" marker-end="url(#ahm)" />
  <g fill="#0f766e"><use href="#icon-cert-sm" transform="translate(330,175) scale(0.4)" /></g>
  <text x="350" y="228" font-size="11" fill="#111827" text-anchor="middle">2. client ALSO presents its own certificate</text>
  <text x="350" y="241" font-size="10" fill="#475569" text-anchor="middle">server validates it the same way a browser validates a server's</text>

  <text x="350" y="270" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Both directions authenticated — common in service mesh / zero-trust networks</text>
  <text x="350" y="290" font-size="11.5" fill="#475569" text-anchor="middle">each service gets its own short-lived cert, often from an internal private CA</text>
</svg>
