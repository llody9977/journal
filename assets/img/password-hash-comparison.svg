<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff" />

  <text x="360" y="25" font-size="11.5" fill="#475569" text-anchor="middle" font-family="ui-monospace,monospace">GUESS RATE AGAINST A STOLEN HASH (SINGLE GPU, ORDER OF MAGNITUDE)</text>

  <line x1="60" y1="250" x2="680" y2="250" stroke="#8491a3" stroke-width="1.5" />

  <!-- SHA-256 bar (huge) -->
  <rect x="90" y="60" width="80" height="190" fill="#9f1239" />
  <text x="130" y="50" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">SHA-256</text>
  <text x="130" y="270" font-size="11" fill="#9f1239" text-anchor="middle" font-weight="700">~10 billion/sec</text>
  <text x="130" y="286" font-size="10" fill="#475569" text-anchor="middle">wrong tool for this job</text>

  <!-- bcrypt bar (small) -->
  <rect x="250" y="236" width="80" height="14" fill="#a14c00" />
  <text x="290" y="226" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">bcrypt</text>
  <text x="290" y="270" font-size="11" fill="#a14c00" text-anchor="middle" font-weight="700">~thousands/sec</text>

  <!-- scrypt bar (smaller) -->
  <rect x="410" y="242" width="80" height="8" fill="#0f766e" />
  <text x="450" y="232" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">scrypt</text>
  <text x="450" y="270" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="700">~hundreds/sec</text>

  <!-- Argon2 bar (smallest) -->
  <rect x="570" y="245" width="80" height="5" fill="#193e9f" />
  <text x="610" y="232" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Argon2id</text>
  <text x="610" y="270" font-size="11" fill="#193e9f" text-anchor="middle" font-weight="700">~tens/sec</text>
  <text x="610" y="286" font-size="10" fill="#475569" text-anchor="middle">current recommendation</text>
</svg>
