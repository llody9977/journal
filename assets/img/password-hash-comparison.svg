<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="720" height="320" fill="#ffffff" />

  <!-- Title / Description -->
  <text x="360" y="25" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">ATTACKER CRACKING SPEED / THROUGHPUT (HASHES PER SECOND)</text>
  <text x="360" y="42" font-size="10" fill="#64748b" text-anchor="middle">Logarithmic Scale — Higher means easier to crack via offline brute-force</text>

  <!-- Y-Axis (Cracking Speed) -->
  <line x1="75" y1="60" x2="75" y2="260" stroke="#8491a3" stroke-width="1.5" />
  <text x="25" y="160" font-size="10.5" fill="#475569" transform="rotate(-90 25 160)" text-anchor="middle" font-weight="600">Cracking Speed (Hashes / sec)</text>

  <!-- Y-Axis Tick Marks & Labels -->
  <line x1="70" y1="70" x2="75" y2="70" stroke="#8491a3" stroke-width="1.5" />
  <text x="65" y="73" font-size="9" fill="#64748b" text-anchor="end">100 Billion (Fast)</text>

  <line x1="70" y1="130" x2="75" y2="130" stroke="#8491a3" stroke-width="1.5" />
  <text x="65" y="133" font-size="9" fill="#64748b" text-anchor="end">1 Million</text>

  <line x1="70" y1="190" x2="75" y2="190" stroke="#8491a3" stroke-width="1.5" />
  <text x="65" y="193" font-size="9" fill="#64748b" text-anchor="end">10,000</text>

  <line x1="70" y1="250" x2="75" y2="250" stroke="#8491a3" stroke-width="1.5" />
  <text x="65" y="253" font-size="9" fill="#64748b" text-anchor="end">10 (Slow)</text>

  <!-- X-Axis (Base Line) -->
  <line x1="75" y1="260" x2="680" y2="260" stroke="#8491a3" stroke-width="1.5" />

  <!-- SHA-256 bar (huge throughput) -->
  <rect x="110" y="70" width="80" height="190" fill="#9f1239" />
  <text x="150" y="60" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">SHA-256</text>
  <text x="150" y="280" font-size="10.5" fill="#9f1239" text-anchor="middle" font-weight="700">~100 Billion / s</text>
  <text x="150" y="296" font-size="9.5" fill="#64748b" text-anchor="middle">Vulnerable to GPU Cracking</text>

  <!-- bcrypt bar (small throughput) -->
  <rect x="250" y="246" width="80" height="14" fill="#a14c00" />
  <text x="290" y="236" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">bcrypt</text>
  <text x="290" y="280" font-size="10.5" fill="#a14c00" text-anchor="middle" font-weight="700">~10,000 / s</text>
  <text x="290" y="296" font-size="9.5" fill="#64748b" text-anchor="middle">CPU-Bound Slowness</text>

  <!-- scrypt bar (smaller throughput) -->
  <rect x="390" y="252" width="80" height="8" fill="#0f766e" />
  <text x="430" y="242" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">scrypt</text>
  <text x="430" y="280" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="700">~1,000 / s</text>
  <text x="430" y="296" font-size="9.5" fill="#64748b" text-anchor="middle">Memory-Hard Defense</text>

  <!-- Argon2id bar (smallest throughput) -->
  <rect x="530" y="255" width="80" height="5" fill="#193e9f" />
  <text x="570" y="242" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Argon2id</text>
  <text x="570" y="280" font-size="10.5" fill="#193e9f" text-anchor="middle" font-weight="700">&lt; 10 / s</text>
  <text x="570" y="296" font-size="9.5" fill="#64748b" text-anchor="middle">NIST / OWASP Standard</text>
</svg>
