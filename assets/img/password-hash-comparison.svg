<svg viewBox="0 0 1200 410" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="410" fill="#ffffff"/>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Password Hashing Throughput &amp; GPU Resistance</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Illustrative logarithmic benchmark throughput across password hashing algorithms (Lower throughput = stronger offline resistance)</text>

  <rect x="40" y="110" width="1120" height="270" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />

  <!-- Y-Axis (shifted right to x=160 for 35px left label padding) -->
  <line x1="160" y1="140" x2="160" y2="330" stroke="#64748b" stroke-width="2"/>
  <text x="150" y="150" font-size="10.5" fill="#475569" text-anchor="end" font-weight="700">100 Billion / s</text>
  <text x="150" y="210" font-size="10.5" fill="#475569" text-anchor="end" font-weight="700">1 Million / s</text>
  <text x="150" y="270" font-size="10.5" fill="#475569" text-anchor="end" font-weight="700">10,000 / s</text>
  <text x="150" y="325" font-size="10.5" fill="#475569" text-anchor="end" font-weight="700">&lt; 10 / s</text>

  <!-- X-Axis Base Line -->
  <line x1="160" y1="330" x2="1090" y2="330" stroke="#64748b" stroke-width="2"/>

  <!-- SHA-256 Bar (x=210 to 370, center x=290) -->
  <rect x="210" y="145" width="160" height="185" fill="#dc2626" rx="4"/>
  <text x="290" y="135" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">SHA-256</text>
  <text x="290" y="235" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">~100 Billion / s</text>
  <text x="290" y="350" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Vulnerable to GPU Cracking</text>
  <text x="290" y="365" font-size="10" fill="#475569" text-anchor="middle">Fast General Digest (Unsuitable)</text>

  <!-- bcrypt Bar (x=440 to 600, center x=520) -->
  <rect x="440" y="270" width="160" height="60" fill="#d97706" rx="4"/>
  <text x="520" y="260" font-size="13" font-weight="800" fill="#d97706" text-anchor="middle">bcrypt</text>
  <text x="520" y="305" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">~10,000 / s</text>
  <text x="520" y="350" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">CPU-Bound Slowness</text>
  <text x="520" y="365" font-size="10" fill="#475569" text-anchor="middle">Approved Legacy (72-byte max)</text>

  <!-- scrypt Bar (x=670 to 830, center x=750) -->
  <rect x="670" y="295" width="160" height="35" fill="#0d9488" rx="4"/>
  <text x="750" y="285" font-size="13" font-weight="800" fill="#0d9488" text-anchor="middle">scrypt</text>
  <text x="750" y="318" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">~1,000 / s</text>
  <text x="750" y="350" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle">Memory-Hard Defense</text>
  <text x="750" y="365" font-size="10" fill="#475569" text-anchor="middle">Early Memory-Hard Standard</text>

  <!-- Argon2id Bar (x=900 to 1060, center x=980) -->
  <rect x="900" y="318" width="160" height="12" fill="#1d4ed8" rx="3"/>
  <text x="980" y="308" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">Argon2id</text>
  <text x="980" y="350" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">RFC 9106 / OWASP Recommended</text>
  <text x="980" y="365" font-size="10" fill="#475569" text-anchor="middle">Hybrid Memory-Hard (First Choice)</text>
</svg>
