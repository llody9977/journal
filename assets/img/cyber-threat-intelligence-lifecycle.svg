<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Cyber Threat Intelligence Operations &amp; Data Pipeline Architecture</title>
  <desc id="description">Cyber Threat Intelligence diagram showing CTI 6-stage lifecycle, Pyramid of Pain, STIX 2.1 JSON data model, and TAXII 2.1 dissemination.</desc>
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="50" y="50" font-size="28" font-weight="850" fill="#0f172a">Cyber Threat Intelligence (CTI) Operations</text>
  <text x="50" y="75" font-size="14" fill="#475569">The 6-stage intelligence lifecycle, STIX 2.1 / TAXII 2.1 data models, Pyramid of Pain, and threat actor profiling.</text>
  
  <!-- CTI Lifecycle 6 Stages (x=40, w=540, y=105, h=160) -->
  <rect x="40" y="105" width="540" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <text x="60" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#2563eb">CTI OPERATIONAL LIFECYCLE (6 STAGES)</text>
  <text x="60" y="155" font-size="14" font-weight="800" fill="#0f172a">Requirements-Driven Intelligence Pipeline</text>
  <line x1="60" y1="166" x2="560" y2="166" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="186" font-size="11.5" font-weight="500" fill="#475569">1. Planning &amp; Requirements (PIRs) → 2. Data Collection (OSINT, Feeds)</text>
  <text x="60" y="206" font-size="11.5" font-weight="500" fill="#475569">→ 3. Processing &amp; Parsing → 4. Analysis &amp; Production</text>
  <text x="60" y="226" font-size="11.5" font-weight="500" fill="#475569">→ 5. Dissemination (TAXII, SIEM) → 6. Feedback &amp; Evaluation</text>

  <!-- Pyramid of Pain (x=620, w=540, y=105, h=160) -->
  <rect x="620" y="105" width="540" height="160" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5" />
  <text x="640" y="132" font-size="11" font-weight="900" letter-spacing="1" fill="#b91c1c">THE PYRAMID OF PAIN (DAVID BIANCO)</text>
  <text x="640" y="155" font-size="14" font-weight="800" fill="#0f172a">Adversary Disruption Value vs Detection Effort</text>
  <line x1="640" y1="166" x2="1140" y2="166" stroke="#b91c1c" stroke-opacity="0.3" stroke-width="1" />
  <text x="640" y="186" font-size="11.5" font-weight="500" fill="#475569">• TTPs (Top - Toughest to change) → Tools → Host/Network Artifacts</text>
  <text x="640" y="206" font-size="11.5" font-weight="500" fill="#475569">• Domain Names → IP Addresses → Hash Values (Trivial / Fragile)</text>
  <text x="640" y="226" font-size="11.5" font-weight="500" fill="#475569">• Focus: Elevate from volatile IOC detection to resilient TTP hunting</text>

  <!-- STIX 2.1 & TAXII Data Standards (x=40, w=1120, y=285, h=145) -->
  <rect x="40" y="285" width="1120" height="145" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" />
  <text x="60" y="312" font-size="11" font-weight="900" letter-spacing="1" fill="#0f766e">STIX 2.1 &amp; TAXII 2.1 STANDARDS &amp; TIP ARCHITECTURE</text>
  <text x="60" y="335" font-size="14" font-weight="800" fill="#0f172a">Structured Graph Objects &amp; Automated Transport</text>
  <line x1="60" y1="346" x2="1140" y2="346" stroke="#0f766e" stroke-opacity="0.3" stroke-width="1" />
  <text x="60" y="362" font-size="11.5" font-weight="500" fill="#475569">• STIX Domain Objects (SDOs): Threat-Actor, Campaign, Indicator, Malware, Attack-Pattern, Observed-Data</text>
  <text x="60" y="379" font-size="11.5" font-weight="500" fill="#475569">• STIX Relationship Objects (SROs): Connects Indicator → indicates → Threat-Actor / Attack-Pattern</text>
  <text x="60" y="396" font-size="11.5" font-weight="500" fill="#475569">• TAXII 2.1: Collections polled over an HTTPS REST API (Channels are reserved, not specified in 2.1)</text>
  <text x="60" y="413" font-size="11.5" font-weight="500" fill="#475569">• Handling: FIRST TLP 2.0 markings travel with every shared object as STIX marking-definition references</text>

  <!-- Bottom Bar: Alignment (y=445, h=40) -->
  <rect x="40" y="445" width="1120" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="600" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">CTI PIPELINE: INGESTION → STIX PARSING → OPENCTI/MISP CORRELATION → TTP ENRICHMENT → SIEM/DETECTION ACTION</text>
</svg>
