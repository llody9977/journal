<svg viewBox="0 0 1200 767" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">How security frameworks fit together</title>
  <desc id="description">Start with strategy, select controls, add domain requirements, then collect assurance evidence.</desc>
  <rect width="1200" height="767" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">How security frameworks fit together</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">Start with strategy, select controls, add domain requirements, then collect assurance</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">evidence.</text>
  
    <g>
      <rect x="80" y="130" width="1040" height="115" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="105" y="161" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">LAYER 1</text>
      <text x="105" y="190" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Governance and strategic vocabulary</text>
      <text x="105" y="218" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">NIST CSF describes outcomes such as Govern, Identify, Protect, Detect, Respond, and Recover.</text>
    </g>

    <g>
      <rect x="80" y="289" width="1040" height="115" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="105" y="320" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">LAYER 2</text>
      <text x="105" y="349" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Control catalogs and baselines</text>
      <text x="105" y="377" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">CIS Controls and NIST SP 800-53 translate outcomes into safeguards and control requirements.</text>
    </g>

    <g>
      <rect x="80" y="448" width="1040" height="115" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="105" y="479" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">LAYER 3</text>
      <text x="105" y="508" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Domain-specific standards</text>
      <text x="105" y="536" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">OWASP ASVS, PCI DSS, and NIST SP 800-63 add requirements for a particular system or risk.</text>
    </g>

    <g>
      <rect x="80" y="607" width="1040" height="115" rx="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
      <text x="105" y="638" font-size="12" font-weight="900" letter-spacing="1" fill="#7c3aed">LAYER 4</text>
      <text x="105" y="667" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Assurance and attestation</text>
      <text x="105" y="695" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">ISO/IEC 27001 certification and SOC 2 reports provide evidence about the operating program.</text>
    </g>

    <path d="M600 249 L600 285" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="255" width="124" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="686.0" y="272" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">MAP OUTCOMES</text>
    <path d="M600 408 L600 444" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="414" width="124" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="686.0" y="431" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">ADD CONTEXT</text>
    <path d="M600 567 L600 603" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="573" width="134" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="691.0" y="590" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">COLLECT EVIDENCE</text>
</svg>
