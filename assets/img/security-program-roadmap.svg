<svg viewBox="0 0 1200 370" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">A practical security program roadmap</title>
  <desc id="description">The sequence moves from essential hygiene to repeatable governance and external assurance.</desc>
  <rect width="1200" height="370" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">A practical security program roadmap</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">The sequence moves from essential hygiene to repeatable governance and external</text>
  <text x="50" y="102" font-size="14.5" fill="#475569">assurance.</text>
  
    <g>
      <rect x="50" y="135" width="176" height="190" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">STAGE 1</text>
      <text x="75" y="200" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Technical</text>
      <text x="75" y="222" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">hygiene</text>
      <text x="75" y="258" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">CIS IG1</text>
    </g>

    <g>
      <rect x="281" y="135" width="176" height="190" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="306" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">STAGE 2</text>
      <text x="306" y="200" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Strategic</text>
      <text x="306" y="222" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">vocabulary</text>
      <text x="306" y="258" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">NIST CSF</text>
    </g>

    <g>
      <rect x="512" y="135" width="176" height="190" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="537" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">STAGE 3</text>
      <text x="537" y="200" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Product</text>
      <text x="537" y="222" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">security</text>
      <text x="537" y="258" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">OWASP ASVS</text>
    </g>

    <g>
      <rect x="743" y="135" width="176" height="190" rx="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
      <text x="768" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#7c3aed">STAGE 4</text>
      <text x="768" y="200" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Customer</text>
      <text x="768" y="222" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">assurance</text>
      <text x="768" y="258" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">SOC 2</text>
    </g>

    <g>
      <rect x="974" y="135" width="176" height="190" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
      <text x="999" y="166" font-size="12" font-weight="900" letter-spacing="1" fill="#15803d">STAGE 5</text>
      <text x="999" y="200" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">Management</text>
      <text x="999" y="222" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">system</text>
      <text x="999" y="258" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">ISO 27001</text>
    </g>
    <path d="M234 230 L273 230" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <path d="M465 230 L504 230" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <path d="M696 230 L735 230" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <path d="M927 230 L966 230" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    
</svg>
