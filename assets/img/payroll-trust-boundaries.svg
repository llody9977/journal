<svg viewBox="0 0 1200 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="790" fill="#ffffff"/>

  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#64748b"/>
    </marker>
    <linearGradient id="app-fill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <text x="40" y="48" font-size="27" font-weight="800" fill="#0f172a">Payroll payment flow: three different trust decisions</text>
  <text x="40" y="78" font-size="15" fill="#475569">An authenticated session can still carry untrusted input; every receiving component must authorize and validate what it accepts.</text>

  <!-- Trust zones -->
  <rect x="35" y="120" width="280" height="260" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="390" y="120" width="390" height="515" rx="22" fill="url(#app-fill)" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="850" y="120" width="315" height="260" rx="22" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="850" y="430" width="315" height="205" rx="22" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="10 8"/>

  <rect x="55" y="103" width="210" height="34" rx="17" fill="#e2e8f0"/>
  <text x="160" y="125" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#475569">EMPLOYEE DEVICE</text>

  <rect x="420" y="103" width="240" height="34" rx="17" fill="#dbeafe"/>
  <text x="540" y="125" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#1d4ed8">PAYROLL APPLICATION</text>

  <rect x="875" y="103" width="210" height="34" rx="17" fill="#ccfbf1"/>
  <text x="980" y="125" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#0f766e">SENSITIVE DATA</text>

  <rect x="875" y="413" width="210" height="34" rx="17" fill="#ffedd5"/>
  <text x="980" y="435" text-anchor="middle" font-size="12.5" font-weight="800" letter-spacing="0.8" fill="#9a3412">EXTERNAL PROVIDER</text>

  <!-- Employee browser -->
  <g>
    <rect x="55" y="195" width="245" height="125" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
    <rect x="55" y="195" width="245" height="30" rx="16" fill="#e2e8f0"/>
    <path d="M55 211 H300 V225 H55Z" fill="#e2e8f0"/>
    <circle cx="75" cy="210" r="4" fill="#ef4444"/>
    <circle cx="90" cy="210" r="4" fill="#f59e0b"/>
    <circle cx="105" cy="210" r="4" fill="#22c55e"/>
    <circle cx="98" cy="264" r="18" fill="#dbeafe"/>
    <circle cx="98" cy="258" r="7" fill="#2563eb"/>
    <path d="M85 278 Q98 264 111 278" fill="#2563eb"/>
    <text x="130" y="260" font-size="15" font-weight="800" fill="#0f172a">Employee browser</text>
    <text x="130" y="285" font-size="12.5" fill="#475569">authenticated user session</text>
  </g>

  <!-- Payroll API -->
  <g>
    <rect x="455" y="190" width="260" height="140" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-width="3"/>
    <text x="585" y="230" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc">Payroll web / API</text>
    <line x1="480" y1="250" x2="690" y2="250" stroke="#334155" stroke-width="2"/>
    <circle cx="490" cy="280" r="7" fill="#22c55e"/>
    <text x="510" y="286" font-size="13.5" fill="#cbd5e1">receives employee requests</text>
    <circle cx="490" cy="307" r="7" fill="#60a5fa"/>
    <text x="510" y="313" font-size="13.5" fill="#cbd5e1">runs payroll business logic</text>
  </g>

  <!-- Payroll decision gate -->
  <g>
    <rect x="455" y="405" width="260" height="150" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M485 445 L510 455 V482 Q510 504 485 514 Q460 504 460 482 V455Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M474 481 L482 489 L497 472" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="535" y="446" font-size="16" font-weight="800" fill="#0f172a">Payment decision</text>
    <text x="535" y="474" font-size="13.5" fill="#475569">authorize employee action</text>
    <text x="535" y="500" font-size="13.5" fill="#475569">validate amount and payee</text>
    <text x="535" y="526" font-size="13.5" fill="#475569">enforce approval rules</text>
  </g>

  <path d="M585 330 V395" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#flow-arrow)"/>
  <text x="604" y="368" font-size="12.5" fill="#475569">candidate instruction</text>

  <!-- Payroll database -->
  <g>
    <ellipse cx="1005" cy="205" rx="105" ry="31" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <path d="M900 205 V320 C900 337 947 351 1005 351 C1063 351 1110 337 1110 320 V205" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <ellipse cx="1005" cy="320" rx="105" ry="31" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <text x="1005" y="248" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Payroll database</text>
    <text x="1005" y="273" text-anchor="middle" font-size="13" fill="#475569">employee and payment data</text>
  </g>

  <!-- External bank API -->
  <g>
    <rect x="885" y="475" width="250" height="120" rx="18" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
    <path d="M938 525 L975 500 L1012 525Z" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <path d="M945 529 H1005 M950 529 V555 M965 529 V555 M980 529 V555 M995 529 V555 M942 558 H1008" stroke="#c2410c" stroke-width="3"/>
    <text x="1025" y="526" font-size="17" font-weight="800" fill="#0f172a">Bank API</text>
    <text x="1025" y="552" font-size="13" fill="#475569">third-party</text>
    <text x="1025" y="574" font-size="13" fill="#475569">payment service</text>
  </g>

  <!-- Data flow 1: browser to API -->
  <path d="M300 258 H445" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#flow-arrow)"/>
  <rect x="305" y="192" width="140" height="55" rx="10" fill="#ffffff" opacity="0.96"/>
  <text x="375" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">HTTPS request</text>
  <text x="375" y="236" text-anchor="middle" font-size="11.5" fill="#64748b">session + untrusted data</text>
  <circle cx="390" cy="258" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
  <text x="390" y="264" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">1</text>

  <!-- Data flow 2: API to database -->
  <path d="M715 258 H888" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#flow-arrow)"/>
  <rect x="720" y="192" width="170" height="55" rx="10" fill="#ffffff" opacity="0.96"/>
  <text x="805" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">database request</text>
  <text x="805" y="236" text-anchor="middle" font-size="11.5" fill="#64748b">workload / service identity</text>
  <circle cx="815" cy="258" r="18" fill="#0f766e" stroke="#ffffff" stroke-width="4"/>
  <text x="815" y="264" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">2</text>

  <!-- Data flow 3: approved instruction to bank -->
  <rect x="718" y="444" width="128" height="58" rx="10" fill="#ffffff" opacity="0.96"/>
  <path d="M715 515 C770 515 805 535 888 535" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#flow-arrow)"/>
  <text x="782" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">approved payment</text>
  <text x="782" y="489" text-anchor="middle" font-size="10.5" fill="#64748b">authenticated request</text>
  <circle cx="835" cy="528" r="18" fill="#c2410c" stroke="#ffffff" stroke-width="4"/>
  <text x="835" y="534" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">3</text>

  <!-- Boundary checks -->
  <g>
    <rect x="35" y="665" width="350" height="95" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="65" cy="712" r="15" fill="#2563eb"/>
    <text x="65" y="717" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">1</text>
    <text x="92" y="693" font-size="12.5" font-weight="800" fill="#1e3a8a">USER → APPLICATION</text>
    <text x="92" y="718" font-size="12" fill="#475569">authenticate session · authorize action</text>
    <text x="92" y="740" font-size="12" fill="#475569">validate untrusted input</text>
  </g>

  <g>
    <rect x="425" y="665" width="350" height="95" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="455" cy="712" r="15" fill="#0f766e"/>
    <text x="455" y="717" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">2</text>
    <text x="482" y="693" font-size="12.5" font-weight="800" fill="#134e4a">APPLICATION → DATABASE</text>
    <text x="482" y="718" font-size="12" fill="#475569">workload identity · least privilege</text>
    <text x="482" y="740" font-size="12" fill="#475569">use parameterized queries</text>
  </g>

  <g>
    <rect x="815" y="665" width="350" height="95" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <circle cx="845" cy="712" r="15" fill="#c2410c"/>
    <text x="845" y="717" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">3</text>
    <text x="872" y="693" font-size="12.5" font-weight="800" fill="#7c2d12">APPLICATION → BANK</text>
    <text x="872" y="718" font-size="12" fill="#475569">approve payment · authenticate endpoint</text>
    <text x="872" y="740" font-size="12" fill="#475569">protect integrity · prevent replay</text>
  </g>
</svg>
