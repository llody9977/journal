<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="100%" height="100%" role="img" aria-labelledby="dm-title dm-desc">
  <title id="dm-title">Diamond Model of Intrusion Analysis</title>
  <desc id="dm-desc">Four vertices joined as a diamond: Adversary at top, Victim at bottom, Capability at left, Infrastructure at right. The vertical diagonal joining Adversary and Victim is the socio-political axis. The horizontal diagonal joining Capability and Infrastructure is the technology axis.</desc>
  <rect width="700" height="470" fill="#ffffff"/>
  <style>
    .vertex { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    .vlabel { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; fill: #0f172a; text-anchor: middle; font-weight: 700; }
    .edge { fill: none; stroke: #94a3b8; stroke-width: 2; }
    .axis-sp { stroke: #b45309; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .axis-tech { stroke: #0f766e; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .axis-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 800; letter-spacing: .6px; text-anchor: middle; }
    .legend { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #475569; }
  </style>

  <!-- Diamond edges: adversary-capability, adversary-infrastructure, capability-victim, infrastructure-victim -->
  <polygon points="350,82 500,196 350,310 200,196" class="edge"/>

  <!-- Diagonals: the two structural axes -->
  <line x1="350" y1="82" x2="350" y2="310" class="axis-sp"/>
  <line x1="200" y1="196" x2="500" y2="196" class="axis-tech"/>

  <!-- Socio-political axis label, sitting on the vertical Adversary-Victim diagonal -->
  <rect x="273" y="132" width="154" height="20" fill="#ffffff"/>
  <text x="350" y="146" class="axis-tag" fill="#b45309">SOCIO-POLITICAL AXIS</text>

  <!-- Technology axis label, sitting on the horizontal Capability-Infrastructure diagonal -->
  <rect x="352" y="186" width="128" height="20" fill="#ffffff"/>
  <text x="416" y="200" class="axis-tag" fill="#0f766e">TECHNOLOGY AXIS</text>

  <!-- Vertices -->
  <rect x="272" y="26" width="156" height="38" rx="6" class="vertex"/>
  <text x="350" y="50" class="vlabel">ADVERSARY</text>

  <rect x="272" y="328" width="156" height="38" rx="6" class="vertex"/>
  <text x="350" y="352" class="vlabel">VICTIM</text>

  <rect x="26" y="177" width="168" height="38" rx="6" class="vertex"/>
  <text x="110" y="201" class="vlabel">CAPABILITY</text>

  <rect x="506" y="177" width="184" height="38" rx="6" class="vertex"/>
  <text x="598" y="201" class="vlabel">INFRASTRUCTURE</text>

  <!-- Legend: states explicitly which vertices each axis connects -->
  <line x1="30" y1="410" x2="66" y2="410" class="axis-sp"/>
  <text x="78" y="414" class="legend">Socio-political axis: Adversary &#8596; Victim (motivation, intent, relationship)</text>

  <line x1="30" y1="442" x2="66" y2="442" class="axis-tech"/>
  <text x="78" y="446" class="legend">Technology axis: Capability &#8596; Infrastructure (technical execution mechanism)</text>
</svg>
