<svg viewBox="0 0 1200 608" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">CIS Controls implementation groups</title>
  <desc id="description">Each group builds on the safeguards in the group below it.</desc>
  <rect width="1200" height="608" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">CIS Controls implementation groups</text>
  <text x="50" y="88" font-size="15" fill="#475569">Each group builds on the safeguards in the group below it.</text>
  
    <g>
      <rect x="80" y="130" width="1040" height="115" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="105" y="161" font-size="12" font-weight="900" letter-spacing="1" fill="#2563eb">IG1</text>
      <text x="105" y="190" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Essential cyber hygiene</text>
      <text x="105" y="218" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">The minimum prioritized safeguards for every enterprise.</text>
    </g>

    <g>
      <rect x="80" y="289" width="1040" height="115" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
      <text x="105" y="320" font-size="12" font-weight="900" letter-spacing="1" fill="#0f766e">IG2</text>
      <text x="105" y="349" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">Enterprise baseline</text>
      <text x="105" y="377" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Adds safeguards for organizations with greater complexity, data, and operational risk.</text>
    </g>

    <g>
      <rect x="80" y="448" width="1040" height="115" rx="20" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
      <text x="105" y="479" font-size="12" font-weight="900" letter-spacing="1" fill="#b45309">IG3</text>
      <text x="105" y="508" text-anchor="start" font-size="20" font-weight="800" fill="#0f172a">High-assurance defense</text>
      <text x="105" y="536" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Adds safeguards for sensitive operations and targeted, sophisticated threats.</text>
    </g>

    <path d="M600 249 L600 285" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="255" width="124" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="686.0" y="272" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">BUILD ON IG1</text>
    <path d="M600 408 L600 444" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="624" y="414" width="136" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="692.0" y="431" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">BUILD ON IG1 + IG2</text>
</svg>
