<svg viewBox="0 0 1200 554" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Common AWS STS role-assumption mechanisms</title>
  <desc id="description">Each API exchanges a different kind of trusted caller evidence for temporary AWS credentials.</desc>
  <rect width="1200" height="554" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">Common AWS STS role-assumption mechanisms</text>
  <text x="50" y="88" font-size="16" fill="#475569">Each API exchanges a different kind of trusted caller evidence for temporary AWS credentials.</text>
  <rect x="55" y="130" width="1090" height="115" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="85" y="172" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">AssumeRole</text><text x="400" y="167" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">An AWS principal assumes a target IAM role.</text>
<text x="400" y="190" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Useful for cross-account or delegated access.</text><rect x="55" y="263" width="1090" height="115" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/><text x="85" y="305" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">AssumeRoleWithWebIdentity</text><text x="400" y="300" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">An external OIDC token is exchanged for role credentials.</text>
<text x="400" y="323" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Common for CI/CD and federated workloads.</text><rect x="55" y="396" width="1090" height="115" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/><text x="85" y="438" text-anchor="start" font-size="18" font-weight="800" fill="#0f172a">AssumeRoleWithSAML</text><text x="400" y="433" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">A SAML 2.0 assertion is exchanged for role credentials.</text>
<text x="400" y="456" text-anchor="start" font-size="14.5" font-weight="500" fill="#475569">Common for enterprise workforce federation.</text>
</svg>
