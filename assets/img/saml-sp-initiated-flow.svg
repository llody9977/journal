<svg viewBox="0 0 1200 555" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">SAML service-provider-initiated sign-in</title>
  <desc id="description">The browser carries messages between the service provider and identity provider.</desc>
  <rect width="1200" height="555" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">SAML service-provider-initiated sign-in</text>
  <text x="50" y="88" font-size="16" fill="#475569">The browser carries messages between the service provider and identity provider.</text>
  <rect x="10" y="120" width="250" height="60" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="135" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">User browser</text><path d="M135 180 V520" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="475" y="120" width="250" height="60" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="600" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Service provider</text><path d="M600 180 V520" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="940" y="120" width="250" height="60" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="3"/><text x="1065" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Identity provider</text><path d="M1065 180 V520" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M135 220 L600 220" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="302.7" y="188" width="129.6" height="24" rx="12" fill="#ffffff"/><text x="367.5" y="205" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">1. REQUEST SERVICE</text>
    <path d="M600 290 L135 290" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="305.5" y="258" width="124" height="24" rx="12" fill="#ffffff"/><text x="367.5" y="275" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">2. REDIRECT</text><text x="367.5" y="314" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">SAMLRequest</text>
    <path d="M135 360 L1065 360" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="328" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="345" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">3. AUTHENTICATE</text><text x="600" y="384" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">User proves identity</text>
    <path d="M1065 430 L135 430" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="538" y="398" width="124" height="24" rx="12" fill="#ffffff"/><text x="600" y="415" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">4. FORM RESPONSE</text><text x="600" y="454" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">Signed SAMLResponse</text>
    <path d="M135 500 L600 500" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="305.5" y="468" width="124" height="24" rx="12" fill="#ffffff"/><text x="367.5" y="485" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".5" fill="#475569">5. POST ASSERTION</text><text x="367.5" y="524" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">Service validates signature and conditions</text>
</svg>
