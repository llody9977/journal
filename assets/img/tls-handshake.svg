<svg viewBox="0 0 1200 690" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="tls-title tls-desc">
  <title id="tls-title">TLS 1.3 certificate-authenticated one-round-trip handshake</title>
  <desc id="tls-desc">A client sends a ClientHello with a key-establishment share and an optional separate Encrypted Client Hello extension. The server returns a ServerHello key-establishment response, followed by encrypted certificate and Finished messages. The client returns its encrypted Finished flight and application data follows. X25519 and hybrid X25519 plus ML-KEM share formats are distinguished.</desc>
  <rect width="1200" height="690" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="50" y="55" font-size="30" font-weight="850" fill="#0f172a">TLS 1.3 Certificate-Authenticated 1-RTT Handshake</text>
  <text x="50" y="82" font-size="14.5" fill="#475569">The key-establishment share format depends on the selected group; ECH is a separate ClientHello extension</text>

  <rect x="40" y="110" width="1120" height="540" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>

  <rect x="80" y="130" width="220" height="50" rx="8" fill="#1e40af"/>
  <text x="190" y="160" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">CLIENT</text>
  <line x1="190" y1="180" x2="190" y2="610" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="900" y="130" width="220" height="50" rx="8" fill="#15803d"/>
  <text x="1010" y="160" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SERVER</text>
  <line x1="1010" y1="180" x2="1010" y2="610" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

  <path d="M190 225 L1000 225" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="315" y="188" width="570" height="70" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="210" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">1. ClientHello: cipher suites, groups, and client key-establishment share</text>
  <text x="600" y="230" font-size="10.8" fill="#334155" text-anchor="middle">X25519: DH share | X25519MLKEM768: ML-KEM encapsulation key + X25519 share</text>
  <text x="600" y="248" font-size="10.8" fill="#334155" text-anchor="middle">Optional ECH: separate extension carrying the encrypted ClientHelloInner, including the real SNI</text>

  <path d="M1010 315 L200 315" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="315" y="278" width="570" height="70" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="600" y="300" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">2. ServerHello: selected suite, group, and key-establishment response</text>
  <text x="600" y="320" font-size="10.8" fill="#334155" text-anchor="middle">X25519: server DH share | Hybrid: ML-KEM ciphertext + server X25519 share</text>
  <text x="600" y="338" font-size="10.8" fill="#334155" text-anchor="middle">Shared result → HKDF Handshake Secret → Main Secret → traffic secrets and keys</text>

  <path d="M1010 405 L200 405" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="330" y="370" width="540" height="66" rx="7" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="600" y="395" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">3. [Encrypted] EncryptedExtensions + Certificate + CertificateVerify + Finished</text>
  <text x="600" y="417" font-size="10.8" fill="#334155" text-anchor="middle">Certificate authenticates the server; CertificateVerify binds the handshake transcript</text>

  <path d="M190 485 L1000 485" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="330" y="452" width="540" height="62" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="477" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">4. [Encrypted] Client Finished</text>
  <text x="600" y="499" font-size="10.8" fill="#334155" text-anchor="middle">Preceded by client Certificate and CertificateVerify only when client authentication was requested</text>

  <path d="M190 555 L1000 555" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="350" y="532" width="500" height="44" rx="7" fill="#15803d"/>
  <text x="600" y="559" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">5. Protected Application Data</text>

  <rect x="120" y="594" width="960" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="613" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Forward secrecy: later compromise of the long-term certificate key alone does not reveal past traffic keys.</text>
  <text x="600" y="630" font-size="10.8" fill="#475569" text-anchor="middle">It still depends on uncompromised ephemeral secrets, correct derivation, and implementation-appropriate secret erasure.</text>
</svg>
