<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="100%" height="100%" role="img" aria-labelledby="th-title th-desc">
  <title id="th-title">UEBA analytics pipeline</title>
  <desc id="th-desc">Four stages in order: raw event ingestion, peer group comparison, Z-score calculation against the peer baseline, and entity risk score update.</desc>
  <rect width="860" height="120" fill="#ffffff"/>
  <style>
    .stage { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
    .st { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #0f172a; text-anchor: middle; font-weight: 600; }
    .arrow { stroke: #0f766e; stroke-width: 2; }
    .arrowhead { fill: #0f766e; }
  </style>

  <rect x="20" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="110" y="53" class="st">1. Raw</text>
  <text x="110" y="69" class="st">Event Ingestion</text>

  <rect x="230" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="320" y="53" class="st">2. Peer</text>
  <text x="320" y="69" class="st">Group Comparison</text>

  <rect x="440" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="530" y="53" class="st">3. Z-Score</text>
  <text x="530" y="69" class="st">Calculation</text>

  <rect x="650" y="34" width="180" height="44" rx="6" class="stage"/>
  <text x="740" y="53" class="st">4. Risk</text>
  <text x="740" y="69" class="st">Score Update</text>

  <line x1="204" y1="56" x2="222" y2="56" class="arrow"/><polygon points="222,52 230,56 222,60" class="arrowhead"/>
  <line x1="414" y1="56" x2="432" y2="56" class="arrow"/><polygon points="432,52 440,56 432,60" class="arrowhead"/>
  <line x1="624" y1="56" x2="642" y2="56" class="arrow"/><polygon points="642,52 650,56 642,60" class="arrowhead"/>
</svg>
