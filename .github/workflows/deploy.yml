name: Deploy Journal to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Verify Required Page Structure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify Ignored Files Are Not Tracked
        shell: bash
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [[ -n "${tracked_ignored}" ]]; then
            echo "Ignored files are still tracked:" >&2
            echo "${tracked_ignored}" >&2
            exit 1
          fi
      - name: Run Automated Page-Structure Checks
        run: python3 scripts/verify_writing_style.py
      - name: Check For Rendering Hazards
        # The site loads no math renderer, so LaTeX reaches the reader as
        # source text and a pipe inside a math span silently reparses the
        # paragraph as a table. Neither is visible to the structure check.
        run: python3 scripts/verify_rendering_hazards.py
      - name: Validate Durable Content Decisions
        run: python3 scripts/verify_content_decisions.py

  build:
    name: Build Site
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # deploy-pages v5 bundles an older artifact client that emits DEP0040
        # under Node.js 24. Remove this targeted suppression after
        # https://github.com/actions/deploy-pages/issues/413 is resolved.
        env:
          NODE_OPTIONS: --disable-warning=DEP0040
