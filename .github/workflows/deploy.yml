name: Deploy Journal to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Verify Required Page Structure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify Ignored Files Are Not Tracked
        shell: bash
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [[ -n "${tracked_ignored}" ]]; then
            echo "Ignored files are still tracked:" >&2
            echo "${tracked_ignored}" >&2
            exit 1
          fi
      - name: Run Automated Page-Structure Checks
        run: python3 scripts/verify_writing_style.py
      - name: Validate Durable Content Decisions
        run: python3 scripts/verify_content_decisions.py

  build:
    name: Build Site
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
